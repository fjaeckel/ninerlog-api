# Prometheus alerting rules for the NinerLog API.
#
# Load via prometheus.yml:
#   rule_files:
#     - /etc/prometheus/rules/ninerlog-rules.yml
#
# Validate:  promtool check rules prometheus-rules.yml
#
# Severity convention (route by the `severity` label in Alertmanager):
#   severity="critical" -> pages a human (24/7)
#   severity="warning"  -> non-paging channel (Slack/email), look at it soon
#
# The `job="ninerlog-api"` selector assumes the scrape_config job_name from the
# README. Adjust if you scrape under a different job name.

groups:
  - name: ninerlog-api.availability
    rules:
      - alert: NinerlogApiDown
        expr: up{job="ninerlog-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NinerLog API target is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} (job {{ $labels.job }}) for more than 1 minute."

      - alert: NinerlogApiUnhealthy
        expr: health_check_status == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "NinerLog API reports unhealthy"
          description: "health_check_status has been 0 for 2m on {{ $labels.instance }} — the /health check (including DB ping) is failing."

      - alert: NinerlogApiAbsentMetrics
        expr: absent(up{job="ninerlog-api"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "NinerLog API has no metrics targets"
          description: "No targets for job ninerlog-api have been scraped for 5m. Check service discovery / scrape config."

  - name: ninerlog-api.http
    rules:
      # Page when the 5xx ratio is high enough to hurt users, with enough traffic
      # to be statistically meaningful (>0.05 req/s over the window).
      - alert: NinerlogApiHighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="ninerlog-api", status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="ninerlog-api"}[5m]))
          ) > 0.05
          and
          sum(rate(http_requests_total{job="ninerlog-api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate (> 5%)"
          description: "{{ $value | humanizePercentage }} of requests are returning 5xx over the last 5m."

      - alert: NinerlogApiHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{job="ninerlog-api"}[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "P95 request latency above 1s"
          description: "P95 latency is {{ $value | humanizeDuration }} over the last 5m (sustained 10m)."

      - alert: NinerlogApiPanicsRecovered
        expr: increase(api_panics_recovered_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Recovered panics in the API"
          description: "{{ $value }} panic(s) were recovered in the last 5m on {{ $labels.instance }}. Check logs."

      # Rejection *ratio*, per limiter, rather than an absolute rate. A flat
      # threshold on rejections/s cannot distinguish a busy service shrugging
      # off a scraper from a limiter that is turning away a third of a quiet
      # service's legitimate traffic. The limiter label says which budget to
      # look at; rate_limit_requests_total supplies the denominator.
      - alert: NinerlogApiRateLimitSaturation
        expr: |
          sum by (limiter) (rate(rate_limit_hits_total{job="ninerlog-api"}[10m]))
            /
          clamp_min(sum by (limiter) (rate(rate_limit_requests_total{job="ninerlog-api"}[10m])), 0.0001)
            > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Rate limiter '{{ $labels.limiter }}' is rejecting >5% of its traffic"
          description: "{{ $value | humanizePercentage }} of requests evaluated by the '{{ $labels.limiter }}' limiter were rejected over the last 10m (sustained 15m). Either the limit is under-provisioned for real usage or something is hammering it — check the Rate Limits dashboard."

      # Interactive paths deserve a tighter threshold than bulk ones: a user
      # typing in the flights search gets a visibly broken UI the moment this
      # fires, whereas a refused PDF export is a retry.
      - alert: NinerlogApiSearchRateLimited
        expr: |
          sum(rate(rate_limit_hits_total{job="ninerlog-api", limiter="search"}[10m]))
            /
          clamp_min(sum(rate(rate_limit_requests_total{job="ninerlog-api", limiter="search"}[10m])), 0.0001)
            > 0.01
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Flight search is being rate-limited"
          description: "{{ $value | humanizePercentage }} of flight searches were rejected over the last 10m (sustained 15m). Search is interactive — users see an empty result mid-typing. Consider raising SEARCH_RATE_LIMIT_PER_MINUTE (default 60) after checking p95 latency on /api/v1/flights and the DB pool."

  - name: ninerlog-api.database
    rules:
      # Pool exhaustion: nearly all configured connections are in use and clients
      # are waiting for one to free up.
      - alert: NinerlogApiDbPoolExhausted
        expr: |
          (db_connections_in_use / db_connections_max_open) > 0.9
          and
          rate(db_wait_count_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool near exhaustion"
          description: "{{ $value | humanizePercentage }} of the pool is in use and requests are waiting for connections on {{ $labels.instance }}."

      - alert: NinerlogApiDbConnectionWaits
        expr: rate(db_wait_duration_seconds_total[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Clients waiting for database connections"
          description: "Time spent waiting for DB connections is {{ $value | humanizeDuration }}/s. Consider raising the pool size or investigating slow queries."

  - name: ninerlog-api.email
    rules:
      # Email is the only delivery channel for notifications. A high failure
      # ratio means users silently stop receiving expiry/currency warnings.
      - alert: NinerlogApiEmailDeliveryFailing
        expr: |
          (
            sum(rate(email_send_total{result="failure"}[15m]))
            /
            sum(rate(email_send_total{result=~"success|failure"}[15m]))
          ) > 0.2
          and
          sum(rate(email_send_total{result=~"success|failure"}[15m])) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Email delivery is failing"
          description: "{{ $value | humanizePercentage }} of SMTP sends failed over the last 15m. Notifications are not reaching users."

      # A suppressed address stops receiving mail permanently until an admin
      # lifts it, so the gauge only climbs on its own. Steady growth means real
      # users are silently losing notifications — and a broken mail setup
      # (server_error misclassified as a hard bounce) burns addresses far
      # faster than genuine dead mailboxes do. delta(), not increase(): this is
      # a gauge, and admins lifting suppressions make it fall.
      - alert: NinerlogApiEmailSuppressionGrowing
        expr: delta(email_suppressed_addresses{job="ninerlog-api"}[6h]) > 5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Email suppression list is growing"
          description: "{{ $value }} addresses were suppressed in the last 6h. Check email_delivery_total by status — a jump in server_error means the mail setup is at fault, not the recipients."

  - name: ninerlog-api.notifications
    rules:
      # Staleness: the background checker writes a fresh timestamp every run.
      # If it stops (crashed goroutine, stuck loop), no notifications go out.
      # Threshold = 2x the default 1h (3600s) check interval + 10m (600s) headroom.
      - alert: NinerlogApiNotificationCheckerStale
        expr: (time() - notification_last_success_timestamp_seconds) > (2 * 3600 + 600)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Notification background checker is stale"
          description: "The notification checker last completed {{ $value | humanizeDuration }} ago (expected at least hourly). It may be stuck or crashed."

      - alert: NinerlogApiNotificationCheckErrors
        expr: increase(notification_check_errors_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Notification check runs are erroring"
          description: "{{ $value }} notification check run(s) aborted with an error in the last hour."

  - name: ninerlog-api.airports
    rules:
      # The airport database refreshes every 24h (AIRPORT_REFRESH_INTERVAL) and
      # keeps serving the previous snapshot when a refresh fails, so a single
      # failure is harmless — staleness is the real signal. Threshold = 2x the
      # default interval + 1h headroom.
      - alert: NinerlogApiAirportDbStale
        expr: airport_db_age_seconds > (2 * 86400 + 3600)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Airport database is stale"
          description: "The airport database was last loaded {{ $value | humanizeDuration }} ago (expected daily). Refreshes are failing or the refresher is stuck."

      # No database at all: airport names, distances and night-time
      # calculations silently degrade for every flight.
      - alert: NinerlogApiAirportDbUnavailable
        expr: airport_db_airports == 0 or absent(airport_db_airports)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Airport database is empty"
          description: "No airports are loaded on {{ $labels.instance }} — lookups, distances and night-time calculations are unavailable."

      # One upstream failing is survivable (the other carries the merge), but
      # it means the merged data is degrading.
      - alert: NinerlogApiAirportSourceFailing
        expr: increase(airport_db_fetch_errors_total[25h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Airport source {{ $labels.source }} is failing"
          description: "{{ $value }} fetch failure(s) for source {{ $labels.source }} (reason: {{ $labels.reason }}) in the last 25h."

  - name: ninerlog-api.updates
    rules:
      # A published release this deployment has not taken. Not paging: the
      # operator chooses when to pull, and the admin console shows the same
      # thing. The series is absent when the running build carries no semantic
      # version, so an untagged build never fires this.
      - alert: NinerlogApiUpdateAvailable
        expr: app_update_available{job="ninerlog-api",component="api"} == 1
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "A newer NinerLog API release is available"
          description: "The running API is behind the newest published release. Pull the new image (docker compose pull && docker compose up -d)."

      # The check runs daily (UPDATE_CHECK_INTERVAL) and keeps serving the last
      # known releases when a lookup fails, so staleness is the signal.
      # Threshold = 3x the default interval. Deployments that opted out
      # (UPDATE_CHECK_ENABLED=false) emit no series and never fire.
      - alert: NinerlogApiUpdateCheckStale
        expr: |
          (time() - update_check_last_success_timestamp_seconds{job="ninerlog-api"}) > (3 * 86400)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Release check has not succeeded in days"
          description: "The last successful release lookup was {{ $value | humanizeDuration }} ago (expected daily). Update notices are no longer trustworthy."

  - name: ninerlog-api.auth
    rules:
      # A surge in failed logins relative to successes suggests credential
      # stuffing / brute force. Requires a meaningful volume to avoid noise.
      - alert: NinerlogApiLoginFailureSpike
        expr: |
          sum(rate(auth_login_attempts_total{result="invalid_credentials"}[5m])) > 1
          and
          (
            sum(rate(auth_login_attempts_total{result="invalid_credentials"}[5m]))
            /
            clamp_min(sum(rate(auth_login_attempts_total[5m])), 0.001)
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Spike in failed logins"
          description: "Invalid-credential logins are {{ $value | humanize }}/s and are the majority of attempts — possible brute-force / credential stuffing."

  - name: ninerlog-api.accounts
    rules:
      # Reaping an unverified account deletes it outright — there is no undo,
      # and the user is not around to complain. The usual cause of a spike is
      # not a wave of abandoned signups but verification mail that stopped
      # arriving, which turns the reaper into an account shredder. Fires on
      # volume alone rather than a ratio: any large batch deserves a look
      # regardless of signup rate.
      - alert: NinerlogApiUnverifiedDeletionSpike
        expr: increase(unverified_accounts_deleted_total{job="ninerlog-api"}[1h]) > 20
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Unverified accounts are being deleted in bulk"
          description: "{{ $value }} unverified accounts were deleted in the last hour. Confirm verification mail is being delivered before treating this as normal churn."

      # The reminder is the last chance a user gets before deletion. If sending
      # it fails, the reaper still runs on schedule.
      - alert: NinerlogApiUnverifiedRemindersFailing
        expr: |
          sum(rate(unverified_account_reminders_total{job="ninerlog-api",result=~"undeliverable|error"}[1h])) > 0
          and
          (
            sum(rate(unverified_account_reminders_total{job="ninerlog-api",result=~"undeliverable|error"}[1h]))
            /
            clamp_min(sum(rate(unverified_account_reminders_total{job="ninerlog-api"}[1h])), 0.001)
          ) > 0.5
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Verification reminders are not being delivered"
          description: "{{ $value | humanizePercentage }} of verification reminders failed over the last hour. Accounts will still be deleted on schedule without their final warning."

  - name: ninerlog-api.sessions
    rules:
      # A replay is a refresh token presented after the reuse grace has passed,
      # and it revokes the session it belonged to. A trickle is a client that
      # slept through the grace window; a sustained rate is either a client
      # that stopped coordinating its refreshes or a stolen token being
      # replayed, and both cost users their sessions.
      - alert: NinerlogApiRefreshReplaySpike
        expr: increase(auth_refresh_reuse_detected_total{job="ninerlog-api"}[1h]) > 20
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Refresh tokens are being replayed after the grace window"
          description: "{{ $value }} refresh replays in the last hour, each revoking a session. Check for a client that stopped sharing its in-flight refresh before assuming token theft."

      # The session-state check answers 503 when it cannot read the state,
      # because an unreadable state is not a revocation. That keeps a database
      # blip from signing everyone out, but it also means every authenticated
      # request fails while it lasts.
      - alert: NinerlogApiSessionStateUnavailable
        expr: rate(auth_access_tokens_rejected_total{job="ninerlog-api",reason="lookup_failed"}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Session state cannot be read, authenticated requests are failing"
          description: "Authenticated requests are being answered 503 because the session-state lookup fails. Check database health and connection pool saturation."

      # Users being signed out is the failure this whole subsystem exists to
      # prevent, so a refresh failure rate this high means it is happening
      # again — whatever the cause.
      - alert: NinerlogApiTokenRefreshFailing
        expr: |
          sum(rate(auth_token_refresh_total{job="ninerlog-api",result!="success"}[15m]))
          /
          clamp_min(sum(rate(auth_token_refresh_total{job="ninerlog-api"}[15m])), 0.001)
          > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Token refreshes are failing"
          description: "{{ $value | humanizePercentage }} of token refreshes failed over the last 15 minutes. Users are being signed out; check auth_token_refresh_total by result."
