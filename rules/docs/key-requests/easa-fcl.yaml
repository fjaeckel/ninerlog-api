# Key requests from the easa-fcl porting family (Part-FCL powered aircraft, instructors,
# examiners; Part-MED). Rating, passenger, privilege and licence keys go below
# "# --- family additions: easa-part-fcl"; the licence.medical_* keys (MED.A.030) below
# "# --- family additions: easa-part-med".
#
# Also used by this family, requested by other families with the same meaning:
#   pax.prerequisite_met, pax.prerequisite_unknown (easa-sfcl): easa.part-fcl.fcl-105-a.lapl-passengers
#   pax.experience_not_logged (faa): easa.part-fcl.fcl-060-b.passengers and .night-passengers,
#     where the missing input is pilotFlying; please widen its note to "(sole manipulator,
#     pilot flying, full-stop landings, tailwheel)".
keys:
  - { key: rating.route_sectors_not_logged, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "FCL.740.A(a)(2): the proficiency check is passed but the route sectors cannot be counted, because the flights record no cruise time (a route sector needs a cruise of at least 15 minutes, FCL.010) or an examiner sector was flown in an FSTD of unknown type." }
  - { key: rating.type_not_identifiable, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "Type rating revalidation (FCL.740.H, FCL.740.PL, FCL.740.As) cannot be decided: the rating or its flights carry no type designator, or a route sector has no recorded cruise time or FSTD type." }
  - { key: pax.prerequisite_exempt, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "Passenger prerequisite not required: FCL.105.A(b)(2), the LAPL(A) holder previously held a PPL(A), CPL(A), ATPL(A) or MPL." }
  - { key: privilege.underlying_certificate_invalid, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "FCL.940.MI: the MI certificate is valid only while an FI, TRI or CRI certificate on the same licence is valid; none is." }
  - { key: licence.medical_required, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "MED.A.030(c): no valid medical certificate of the class the licence requires (or a higher class) is recorded; the recorded one is expired or of a lower class." }
  - { key: licence.medical_not_recorded, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "MED.A.030(c): no EASA medical certificate is recorded, so whether the licence may be exercised cannot be decided." }
