# Key requests from the easa-sfcl porting family (Part-SFCL, Part-BFCL, GPL in Part-FCL).
# To be appended below "# --- family additions: easa-part-sfcl-bfcl" in messages/keys.yaml.
# Also used, and requested by de-other with the same meaning: requirement.dual_time
# (easa.part-sfcl.sfcl-130.spl-training, easa.part-sfcl.sfcl-150-b.tmg-extension).
keys:
  - { key: pax.prerequisite_met, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "Passenger prerequisite since licence issue met (SFCL.115(a)(2): 10 h or 30 launches as PIC, or an FI(S) certificate; FCL.205.G(a)(2): 10 h as PIC on gyroplanes)." }
  - { key: pax.prerequisite_unknown, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "Passenger prerequisite since licence issue cannot be counted: the licence's issue date is not recorded." }
  - { key: privilege.recency_credited, kind: message, params: ["date?"], origin: catalogue, emitted: false, documented: false, notes: "Privilege recency fully credited by another qualification (SFCL.215(g): a BIR or an IR(A) credits the cloud flying recency); date is the privilege's expiry." }
  - { key: requirement.flight_instruction, kind: requirement_name, params: [], origin: catalogue, emitted: false, documented: false, notes: "Flight instruction received: dual plus supervised solo time (training programmes; the API's training.spl.instruction_time and training.tmg.instruction_time items)." }
  - { key: requirement.supervised_solo_time, kind: requirement_name, params: [], origin: catalogue, emitted: false, documented: false, notes: "Supervised solo (SPIC) time (training programmes; the API's training.spl.supervised_solo_time item)." }
  - { key: requirement.sfcl130b_credit, kind: requirement_name, params: [], origin: catalogue, emitted: false, documented: false, notes: "SFCL.130(b) credit: 10 % of PIC time on other aircraft categories, at most 7 hours; informational (the API's training.spl.credit_sfcl130b item)." }
  - { key: training.distance_unknown, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "Training programme: every other item met, but the qualifying cross-country flight has no recorded distance (the API's per-item training.cross_country_distance_unknown)." }
  - { key: training.credited, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "Training programme fully credited by another qualification (SFCL.150(c): a Part-FCL TMG class rating credits the SPL TMG extension)." }
