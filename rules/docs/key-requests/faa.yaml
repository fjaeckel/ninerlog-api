# Key requests from the FAA porting agent (14 CFR Part 61, Part 68).
# To be appended below "# --- family additions: faa (append below this line) ---" in
# messages/keys.yaml. Same fields as keys.yaml; all origin: catalogue, emitted: false,
# documented: false.
keys:
  # --- passengers ---
  - { key: pax.experience_not_logged, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.57(a)/(b): passenger recency cannot be decided because the flights do not record a required input (sole manipulator, full-stop landings, tailwheel)." }
  - { key: pax.tailwheel_current, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.57(a)(1)(ii): three full-stop landings in a tailwheel airplane within 90 days; passengers may be carried in a tailwheel airplane." }
  - { key: pax.tailwheel_not_current, kind: message, params: [needed], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.57(a)(1)(ii): needed more full-stop landings in a tailwheel airplane before carrying passengers in one." }
  - { key: pax.tailwheel_not_applicable, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.57(a)(1)(ii): no tailwheel airplane flown in this class; the tailwheel condition does not apply." }
  # --- privilege ---
  - { key: privilege.recency_not_logged, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "Privilege recency cannot be decided because the flights do not record a required input (e.g. what a tow flight towed, 61.69)." }
  - { key: privilege.cfi_reinstate_refresher, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.197(c)/61.199(a)(1): flight instructor recent experience lapsed at most 3 calendar months ago; an approved refresher course or a practical test reinstates the privileges." }
  - { key: privilege.cfi_reinstate_practical_test, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.197(c)/61.199(a)(2): flight instructor recent experience lapsed more than 3 calendar months ago; only a flight instructor practical test reinstates the privileges." }
  # --- credential ---
  - { key: credential.basicmed_not_met, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.23(c)(3): BasicMed course (24 calendar months) or comprehensive examination (48 calendar months) not current; the rows say which." }
  - { key: credential.drivers_license_required, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.113(i): BasicMed needs a valid U.S. driver's license; none is recorded." }
  - { key: credential.drivers_license_expired, kind: message, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.113(i): the recorded U.S. driver's license has expired; BasicMed privileges may not be used." }
  # --- requirement names ---
  - { key: requirement.tailwheel_flights, kind: requirement_name, params: [], origin: catalogue, emitted: false, documented: false, notes: "Flights in a tailwheel airplane (ever)." }
  - { key: requirement.instructor_endorsement, kind: requirement_name, params: [], origin: catalogue, emitted: false, documented: false, notes: "Endorsement from an authorized instructor (61.217(d), 61.101(g))." }
  - { key: requirement.solo_endorsement, kind: requirement_name, params: [], origin: catalogue, emitted: false, documented: false, notes: "Student pilot solo endorsement (61.87(n))." }
  # --- rule descriptions ---
  - { key: faa_medical_atp, kind: rule_description, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.23(d)(1)(i)-(ii): first-class medical duration for ATP privileges (12 months under 40, 6 months from 40)." }
  - { key: faa_medical_commercial, kind: rule_description, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.23(d)(1)(iii), (d)(2)(i): first- or second-class medical duration for commercial privileges (12 months)." }
  - { key: faa_medical_private, kind: rule_description, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.23(d): medical duration for private, recreational, student, sport and instructor privileges (60 months under 40, 24 months from 40)." }
  - { key: faa_basicmed, kind: rule_description, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.23(c)(3), 61.113(i), Part 68: BasicMed course every 24 and examination every 48 calendar months, with a valid U.S. driver's license." }
  - { key: faa_cfi, kind: rule_description, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.19(d), 61.197, 61.199: flight instructor certificate expiry (issued before 1 Dec 2024) or recent experience within 24 calendar months (issued since)." }
  - { key: faa_ground_instructor, kind: rule_description, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.217: ground instructor recent experience within 12 calendar months." }
  - { key: faa_cat_ii_iii, kind: rule_description, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.21: Category II/III pilot authorization expires at the end of the 6th calendar month after issue or renewal." }
  - { key: faa_student_solo, kind: rule_description, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.87(n): student solo endorsement within the preceding 90 days." }
  - { key: faa_recreational, kind: rule_description, params: [], origin: catalogue, emitted: false, documented: false, notes: "FAA 61.101(g): recreational pilot under 400 hours needs PIC time within 180 days or an instructor's endorsement." }
