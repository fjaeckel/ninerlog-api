rule: easa.part-sfcl.sfcl-155-c.bungee
name: current
description: Two bungee launches in 24 months, one on the window's first day, keep bungee current.
covers: [stage:current, requirement:launches:met, window:edge-in]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  ratings:
    - { id: r-gld, licenceId: l-spl, class: GLIDER }
  flights:
    - { date: 2024-09-15, class: GLIDER, launchMethod: bungee, minutes: { total: 30, pic: 30 }, launches: 1, landings: { day: 1 } }
    - { date: 2026-07-01, class: GLIDER, launchMethod: bungee, minutes: { total: 45, pic: 45 }, launches: 1, landings: { day: 1 } }
expect:
  - subject: { kind: launch_method, id: r-gld, detail: bungee }
    status: current
    messageKey: launch_method.current
    validUntil: 2026-09-15
    requirements:
      launches: { current: 2, required: 2, met: true }
