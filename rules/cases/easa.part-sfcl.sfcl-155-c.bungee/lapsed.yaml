rule: easa.part-sfcl.sfcl-155-c.bungee
name: lapsed
description: One bungee launch in 24 months is one short; the launch the day before the window does not count.
covers: [stage:lapsed, requirement:launches:unmet, window:edge-out]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  ratings:
    - { id: r-gld, licenceId: l-spl, class: GLIDER }
  flights:
    - { date: 2024-09-14, class: GLIDER, launchMethod: bungee, minutes: { total: 30, pic: 30 }, launches: 1, landings: { day: 1 } }
    - { date: 2026-07-01, class: GLIDER, launchMethod: bungee, minutes: { total: 45, pic: 45 }, launches: 1, landings: { day: 1 } }
expect:
  - subject: { kind: launch_method, id: r-gld, detail: bungee }
    status: lapsed
    messageKey: launch_method.lapsed
    requirements:
      launches: { current: 1, met: false, remedyKey: remedy.launch_method_dual, remedyParams: { method: bungee, missing: 1 } }
