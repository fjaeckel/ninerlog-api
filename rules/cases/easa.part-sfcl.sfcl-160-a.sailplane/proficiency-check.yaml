rule: easa.part-sfcl.sfcl-160-a.sailplane
name: proficiency-check
description: A proficiency check on a sailplane in the last 24 months keeps the rating current without the experience.
covers: [stage:current, any_of:recency:proficiency_check, requirement:proficiency_check:met]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  ratings:
    - { id: r-gld, licenceId: l-spl, class: GLIDER }
  flights:
    - { date: 2025-10-02, class: GLIDER, launchMethod: winch, minutes: { total: 15, pic: 15 }, launches: 1, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
expect:
  - subject: { kind: rating, id: r-gld }
    status: current
    messageKey: rating.recency_current
    validUntil: 2027-10-02
    requirements:
      proficiency_check: { current: 1, met: true, lastDate: 2025-10-02 }
      launches: { current: 1, met: false }
