rule: easa.part-sfcl.sfcl-160-a.sailplane
name: tmg-launches-not-counted
description: >-
  TMG take-offs, TMG dual flights and a TMG proficiency check do not count toward the
  launches, training flights or check, which must be on sailplanes excluding TMGs.
covers: [stage:lapsed, requirement:flight_time:met, requirement:launches:unmet, requirement:training_flights:unmet, requirement:proficiency_check:unmet]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  ratings:
    - { id: r-gld, licenceId: l-spl, class: GLIDER }
    - { id: r-tmg, licenceId: l-spl, class: TMG }
  flights:
    - { date: 2026-03-01, class: TMG, minutes: { total: 240, pic: 180, dual: 60 }, takeoffs: { day: 12 }, landings: { day: 12 }, launches: 12 }
    - { date: 2026-04-01, class: TMG, minutes: { total: 60, dual: 60 }, takeoffs: { day: 3 }, landings: { day: 3 }, launches: 3, flags: { proficiencyCheck: true } }
    - { date: 2026-05-01, class: GLIDER, launchMethod: winch, minutes: { total: 10, pic: 10 }, launches: 1, landings: { day: 1 } }
expect:
  - subject: { kind: rating, id: r-gld }
    status: lapsed
    messageKey: rating.recency_not_met
    requirements:
      flight_time: { current: 310, met: true }
      launches: { current: 1, met: false }
      training_flights: { current: 0, met: false }
      proficiency_check: { current: 0, met: false }
