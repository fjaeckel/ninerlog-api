rule: easa.part-sfcl.sfcl-160-a.sailplane
name: lapsed
description: >-
  A flight one day before the 24-month window no longer counts; with too few hours,
  launches and training flights and no proficiency check the rating is lapsed, and each
  shortfall carries a remedy.
covers: [stage:lapsed, requirement:flight_time:unmet, requirement:launches:unmet, requirement:training_flights:unmet, window:edge-out]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: LBA, type: SPL }
  ratings:
    - { id: r-gld, licenceId: l-spl, class: GLIDER }
  flights:
    - { date: 2024-09-14, class: GLIDER, minutes: { total: 300, dual: 300 }, launches: 20, landings: { day: 20 } }
    - { date: 2026-04-01, class: GLIDER, minutes: { total: 45, dual: 45 }, launches: 3, landings: { day: 3 } }
expect:
  - subject: { kind: rating, id: r-gld }
    status: lapsed
    messageKey: rating.recency_not_met
    requirements:
      flight_time: { current: 45, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 255, unit: minutes } }
      launches: { current: 3, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 12, unit: launches } }
      training_flights: { current: 1, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 1, unit: flights } }
