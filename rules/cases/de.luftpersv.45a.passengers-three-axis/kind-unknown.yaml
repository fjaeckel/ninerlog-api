rule: de.luftpersv.45a.passengers-three-axis
name: kind-unknown
description: >-
  The only take-offs and landings in 90 days were on an ultralight with no kind recorded;
  they cannot be shown to be "derselben Art" and are not counted.
covers: [stage:not_current, unknown:ulKinds]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DULV, type: UL }
  ratings:
    - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
  privileges:
    - { id: p-pax, licenceId: l-ul, kind: UL_PASSENGER_AUTH }
  flights:
    - { date: 2026-09-01, class: ULTRALIGHT, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 } }
expect:
  - subject: { kind: passengers, id: l-ul }
    status: expired
    messageKey: pax.not_current
    requirements:
      day: { tracked: false, met: false }
