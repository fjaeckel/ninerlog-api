rule: de.luftpersv.45a.passengers-three-axis
name: not-applicable
description: >-
  Trike ratings follow the other-kinds passenger rule; a rating with no kind, and three-axis
  ratings on EASA or FAA licences, get no ultralight passenger evaluation.
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DULV, type: UL }
    - { id: l-easa, authority: EASA, type: PPL(A) }
    - { id: l-faa, authority: FAA, type: SPORT }
  ratings:
    - { id: r-ws, licenceId: l-ul, class: ULTRALIGHT, ulKind: WEIGHT_SHIFT }
    - { id: r-none, licenceId: l-ul, class: ULTRALIGHT }
    - { id: r-easa-ul, licenceId: l-easa, class: ULTRALIGHT, ulKind: THREE_AXIS }
    - { id: r-faa-ul, licenceId: l-faa, class: ULTRALIGHT, ulKind: THREE_AXIS }
expect: []
