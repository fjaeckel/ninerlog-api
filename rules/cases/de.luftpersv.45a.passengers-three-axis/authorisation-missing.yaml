rule: de.luftpersv.45a.passengers-three-axis
name: authorisation-missing
description: >-
  Recency met, but the passenger authorisation on this licence expired and the one on the
  other licence does not count: status unknown with the progress toward § 84a(2). Five
  cross-country flights with an instructor since the licence was issued on 1 March 2025
  (the one on 28 February does not count), two of them with an intermediate landing over
  at least 200 km.
covers: [stage:authorisation_missing, requirement:ul_xc_flights:met, requirement:ul_xc_landing_flights:met, window:since_issue=licence:edge-in, window:since_issue=licence:edge-out]
asOf: 2026-09-15
record:
