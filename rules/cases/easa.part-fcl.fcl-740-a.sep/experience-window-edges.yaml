rule: easa.part-fcl.fcl-740-a.sep
name: experience-window-edges
description: A flight on 31 October 2025, 12 months before expiry, counts; one on 30 October does not.
covers: [window:before_expiry_months=12:edge-in, window:before_expiry_months=12:edge-out]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2026-10-31 }
  flights:
    - { date: 2025-10-30, class: SEP_LAND, minutes: { total: 600, pic: 600 }, takeoffs: { day: 10 }, landings: { day: 10 } }
    - { date: 2025-10-31, class: SEP_LAND, minutes: { total: 300, pic: 300 }, takeoffs: { day: 5 }, landings: { day: 5 } }
    - { date: 2026-05-20, class: SEP_LAND, minutes: { total: 60, dual: 60 }, takeoffs: { day: 2 }, landings: { day: 2 } }
    - { date: 2026-06-12, class: SEP_LAND, minutes: { total: 360, pic: 60, dual: 300 }, takeoffs: { day: 5 }, landings: { day: 5 } }
expect:
  - subject: { kind: rating, id: r-sep }
    status: expiring
    messageKey: rating.revalidation_expiring_met
    requirements:
      total_time: { current: 720, met: true }
      takeoffs: { current: 12, met: true }
