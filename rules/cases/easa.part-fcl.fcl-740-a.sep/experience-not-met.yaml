rule: easa.part-fcl.fcl-740-a.sep
name: experience-not-met
description: 5 h and 5 take-offs and landings are not enough; every unmet row carries its remedy.
covers:
  - stage:not_met
  - requirement:total_time:unmet
  - requirement:pic_time:unmet
  - requirement:takeoffs:unmet
  - requirement:landings:unmet
  - requirement:refresher_training:unmet
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2026-10-31 }
  flights:
    - { date: 2026-03-10, class: SEP_LAND, minutes: { total: 300, pic: 300 }, takeoffs: { day: 5 }, landings: { day: 5 } }
expect:
  - subject: { kind: rating, id: r-sep }
    status: expiring
    messageKey: rating.revalidation_not_met
    requirements:
      total_time: { current: 300, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 420, unit: minutes } }
      pic_time: { current: 300, met: false, remedyParams: { missing: 60, unit: minutes } }
      takeoffs: { current: 5, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 7, unit: takeoffs } }
      landings: { current: 5, met: false, remedyParams: { missing: 7, unit: landings } }
      refresher_training: { current: 0, met: false, remedyParams: { missing: 60, unit: minutes } }
      refresher_exemption: { met: false, remedyKey: "" }
