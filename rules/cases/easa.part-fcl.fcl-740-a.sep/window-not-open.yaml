rule: easa.part-fcl.fcl-740-a.sep
name: window-not-open
description: A rating valid until March 2028 is current; its revalidation window opens on 31 March 2027.
covers: [stage:window_not_open]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2028-03-31 }
  flights:
    - { date: 2026-05-20, class: SEP_LAND, minutes: { total: 60, dual: 60 }, takeoffs: { day: 2 }, landings: { day: 2 } }
expect:
  - subject: { kind: rating, id: r-sep }
    status: current
    messageKey: rating.window_not_open
    messageParams: { date: 2027-03-31 }
    windowOpensAt: 2027-03-31
    requirements:
      total_time: { current: 0, met: false }
