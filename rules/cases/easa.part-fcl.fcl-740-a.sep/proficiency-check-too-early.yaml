rule: easa.part-fcl.fcl-740-a.sep
name: proficiency-check-too-early
description: A proficiency check on 30 July is one day too early to revalidate, but it exempts the pilot from the refresher training, so the experience route is met without dual time.
covers:
  - window:before_expiry_months=3:edge-out
  - any_of:refresher:refresher_exemption
  - requirement:refresher_exemption:met
  - requirement:refresher_training:unmet
  - requirement:proficiency_check:unmet
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2026-10-31 }
  flights:
    - { date: 2026-03-10, class: SEP_LAND, minutes: { total: 660, pic: 300, picus: 360 }, takeoffs: { day: 11 }, landings: { day: 11 } }
    - { date: 2026-07-30, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true } }
expect:
  - subject: { kind: rating, id: r-sep }
    status: expiring
    messageKey: rating.revalidation_expiring_met
    requirements:
      proficiency_check: { current: 0, met: false }
      refresher_training: { current: 0, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 60, unit: minutes } }
      refresher_exemption: { current: 1, met: true }
      total_time: { current: 720, met: true }
