rule: easa.part-fcl.fcl-740-a.sep
name: proficiency-check-window-first-day
description: A proficiency check on 31 July, exactly 3 months before the 31 October expiry, counts.
covers: [window:before_expiry_months=3:edge-in, requirement:proficiency_check:met]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2026-10-31 }
  flights:
    - { date: 2026-07-31, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true } }
expect:
  - subject: { kind: rating, id: r-sep }
    status: expiring
    messageKey: rating.revalidation_expiring_met
    requirements:
      proficiency_check: { current: 1, met: true }
