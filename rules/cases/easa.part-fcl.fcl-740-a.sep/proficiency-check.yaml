rule: easa.part-fcl.fcl-740-a.sep
name: proficiency-check
description: A proficiency check in the class within the 3 months before expiry revalidates the rating without the experience route.
covers: [any_of:revalidation:proficiency_check, requirement:proficiency_check:met, requirement:total_time:unmet]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2026-10-31 }
  flights:
    - { date: 2026-08-01, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
expect:
  - subject: { kind: rating, id: r-sep }
    status: expiring
    messageKey: rating.revalidation_expiring_met
    messageParams: { days: 46 }
    requirements:
      proficiency_check: { current: 1, met: true, lastDate: 2026-08-01 }
      total_time: { current: 60, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 660, unit: minutes } }
