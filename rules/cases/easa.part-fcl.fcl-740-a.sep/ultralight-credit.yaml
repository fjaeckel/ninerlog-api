rule: easa.part-fcl.fcl-740-a.sep
name: ultralight-credit
description: >-
  Three-axis ultralight hours count toward the 12 h and 6 h PIC, but not toward take-offs,
  landings or the refresher; weight-shift hours never count; an ultralight flight with no
  kind cannot be classified and is reported as unknown input.
covers: [unknown:ulCredit, stage:met_expiring]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2026-10-31 }
  flights:
    - { date: 2026-04-01, class: SEP_LAND, minutes: { total: 120, pic: 60, dual: 60 }, takeoffs: { day: 12 }, landings: { day: 12 } }
    - { date: 2026-05-01, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 600, pic: 540, dual: 60 }, takeoffs: { day: 10 }, landings: { day: 10 } }
    - { date: 2026-06-01, class: ULTRALIGHT, minutes: { total: 90, pic: 90 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    - { date: 2026-06-02, class: ULTRALIGHT, ulKind: WEIGHT_SHIFT, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
expect:
  - subject: { kind: rating, id: r-sep }
    status: expiring
    messageKey: rating.revalidation_expiring_met
    requirements:
      total_time: { current: 720, met: true, tracked: true }
      pic_time: { current: 600, met: true }
      takeoffs: { current: 12 }
      landings: { current: 12 }
      refresher_training: { current: 60, met: true }
