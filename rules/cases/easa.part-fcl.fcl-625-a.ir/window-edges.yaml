rule: easa.part-fcl.fcl-625-a.ir
name: window-edges
description: An IR check on 31 July, 3 months before the 31 October expiry, counts; one on 30 July does not.
covers: [window:edge-in, window:edge-out]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-ir, licenceId: l-1, class: IR, expires: 2026-10-31 }
  flights:
    - { date: 2026-07-30, class: MEP_LAND, minutes: { total: 60, pic: 60, ifr: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, checkRating: IR, flags: { proficiencyCheck: true, examinerOnBoard: true } }
    - { date: 2026-07-31, class: MEP_LAND, minutes: { total: 60, pic: 60, ifr: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, checkRating: IR, flags: { proficiencyCheck: true, examinerOnBoard: true } }
expect:
  - subject: { kind: rating, id: r-ir }
    status: expiring
    messageKey: rating.revalidation_expiring_met
    requirements:
      proficiency_check: { current: 1, lastDate: 2026-07-31 }
