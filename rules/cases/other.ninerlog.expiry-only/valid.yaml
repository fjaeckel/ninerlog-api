rule: other.ninerlog.expiry-only
name: valid
description: A rating expiring in 91 days is simply valid; the 90-day warning has not started.
covers: [stage:valid, expiry:before]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: FOCA, type: PPL }
  ratings:
    - { id: r-1, licenceId: l-1, class: SEP_LAND, expires: 2026-12-15 }
expect:
  - subject: { kind: rating, id: r-1 }
    status: current
    messageKey: rating.valid_until
    expiresOn: 2026-12-15
