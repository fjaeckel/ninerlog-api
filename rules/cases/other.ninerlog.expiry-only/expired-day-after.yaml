rule: other.ninerlog.expiry-only
name: expired-day-after
description: The day after its expiry date the rating is expired.
covers: [stage:expired, expiry:after]
asOf: 2026-09-16
record:
  licences:
    - { id: l-1, authority: FOCA, type: PPL }
  ratings:
    - { id: r-1, licenceId: l-1, class: SEP_LAND, expires: 2026-09-15 }
expect:
  - subject: { kind: rating, id: r-1 }
    status: expired
    messageKey: rating.expired
