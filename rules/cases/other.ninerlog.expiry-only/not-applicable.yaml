rule: other.ninerlog.expiry-only
name: not-applicable
description: >-
  Licences of authorities with rules (matched case-insensitively, so " easa " and "Dulv" too)
  and glider ratings are not tracked by expiry only; a licence with no authority is.
asOf: 2026-09-15
record:
  licences:
    - { id: l-easa, authority: " easa ", type: PPL(A) }
    - { id: l-faa, authority: Faa, type: PRIVATE }
    - { id: l-ul, authority: Dulv, type: UL }
    - { id: l-lba, authority: LBA, type: PPL(A) }
    - { id: l-daec, authority: DAeC, type: UL }
    - { id: l-caa, authority: CAA, type: PPL }
    - { id: l-none, authority: "", type: PPL }
  ratings:
    - { id: r-easa, licenceId: l-easa, class: SEP_LAND, expires: 2027-01-31 }
    - { id: r-faa, licenceId: l-faa, class: SEP_LAND }
    - { id: r-ul, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
    - { id: r-lba, licenceId: l-lba, class: MEP_LAND, expires: 2027-01-31 }
    - { id: r-daec, licenceId: l-daec, class: ULTRALIGHT, ulKind: SAILPLANE }
    - { id: r-caa-glider, licenceId: l-caa, class: GLIDER, expires: 2027-01-31 }
    - { id: r-none, licenceId: l-none, class: MEP_LAND, expires: 2027-01-31 }
expect:
  - subject: { kind: rating, id: r-none }
    status: current
    messageKey: rating.valid_until
