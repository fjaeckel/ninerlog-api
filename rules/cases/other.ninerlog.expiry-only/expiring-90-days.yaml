rule: other.ninerlog.expiry-only
name: expiring-90-days
description: Ninety days before the expiry date the rating is reported expiring.
covers: [stage:expiring, expiry:before]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: FOCA, type: PPL }
  ratings:
    - { id: r-1, licenceId: l-1, class: SEP_LAND, expires: 2026-12-14 }
expect:
  - subject: { kind: rating, id: r-1 }
    status: expiring
    messageKey: rating.expiring
    messageParams: { days: 90 }
