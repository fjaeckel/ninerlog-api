rule: easa.part-fcl.fcl-060-b.passengers
name: per-class
description: "Each class is evaluated on its own flights: MEP landings do not count for SEP passengers; night landings count toward the three."
covers: [stage:current, stage:not_current]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
    - { id: r-mep, licenceId: l-ppl, class: MEP_LAND, expires: 2027-06-30 }
  flights:
    - { date: 2026-08-01, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 }, pilotFlying: true }
    - { date: 2026-08-05, class: SEP_LAND, minutes: { total: 60, pic: 60, night: 60 }, takeoffs: { night: 1 }, landings: { night: 1 }, pilotFlying: true }
    - { date: 2026-08-06, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, pilotFlying: true }
expect:
  - subject: { kind: passengers, id: l-ppl, class: SEP_LAND }
    status: expired
    messageKey: pax.not_current
    messageParams: { needed: 1 }
    requirements:
      takeoffs_landings: { current: 2 }
  - subject: { kind: passengers, id: l-ppl, class: MEP_LAND }
    status: current
    messageKey: pax.day_current
