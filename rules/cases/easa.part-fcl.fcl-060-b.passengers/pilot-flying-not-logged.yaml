rule: easa.part-fcl.fcl-060-b.passengers
name: pilot-flying-not-logged
description: When no flight in the 90 days records whether the pilot was flying, the recency is unknown, never current.
covers: [unknown:pilotFlying, stage:pilot_flying_not_logged]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
  flights:
    - { date: 2026-08-20, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 5 }, landings: { day: 5 } }
expect:
  - subject: { kind: passengers, id: l-ppl, class: SEP_LAND }
    status: unknown
    messageKey: pax.experience_not_logged
    requirements:
      takeoffs_landings: { met: false, tracked: false }
