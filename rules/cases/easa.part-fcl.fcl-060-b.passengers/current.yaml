rule: easa.part-fcl.fcl-060-b.passengers
name: current
description: Three take-offs and landings as pilot flying in the class within 90 days allow carrying passengers; the recency lasts until the first of them is 90 days old.
covers: [stage:current, requirement:takeoffs_landings:met]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
  flights:
    - { date: 2026-08-01, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, pilotFlying: true }
    - { date: 2026-08-20, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 2 }, landings: { day: 2 }, pilotFlying: true }
expect:
  - subject: { kind: passengers, id: l-ppl, class: SEP_LAND }
    status: current
    messageKey: pax.day_current
    validUntil: 2026-10-30
    requirements:
      takeoffs_landings: { current: 3, required: 3, met: true, validUntil: 2026-10-30, lastDate: 2026-08-20 }
