rule: easa.part-fcl.fcl-060-b.passengers
name: not-current
description: Two take-offs and landings are one short.
covers: [stage:not_current, requirement:takeoffs_landings:unmet]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
  flights:
    - { date: 2026-08-20, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 2 }, landings: { day: 2 }, pilotFlying: true }
expect:
  - subject: { kind: passengers, id: l-ppl, class: SEP_LAND }
    status: expired
    messageKey: pax.not_current
    messageParams: { needed: 1 }
    requirements:
      takeoffs_landings: { current: 2, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 1, unit: landings } }
