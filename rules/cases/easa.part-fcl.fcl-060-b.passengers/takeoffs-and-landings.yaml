rule: easa.part-fcl.fcl-060-b.passengers
name: takeoffs-and-landings
description: Three landings but two take-offs (a touch-and-go logged as landing only) are two take-offs and landings.
covers: [stage:not_current]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
  flights:
    - { date: 2026-08-20, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 2 }, landings: { day: 3 }, pilotFlying: true }
expect:
  - subject: { kind: passengers, id: l-ppl, class: SEP_LAND }
    status: expired
    messageKey: pax.not_current
    messageParams: { needed: 1 }
    requirements:
      takeoffs_landings: { current: 2, met: false }
