rule: easa.part-fcl.fcl-105-a.lapl-passengers
name: issue-date-edges
description: "PIC time on the issue date counts; PIC time the day before (during training) does not."
covers: [window:edge-in, window:edge-out, stage:not_met]
asOf: 2026-09-15
record:
  licences:
    - { id: l-lapl, authority: EASA, type: LAPL(A), issued: 2025-04-01 }
  ratings:
    - { id: r-sep, licenceId: l-lapl, class: SEP_LAND }
  flights:
    - { date: 2025-03-31, class: SEP_LAND, minutes: { total: 600, pic: 600, dual: 0 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    - { date: 2025-04-01, class: SEP_LAND, minutes: { total: 300, pic: 300, dual: 0 }, takeoffs: { day: 1 }, landings: { day: 1 } }
expect:
  - subject: { kind: passengers, id: l-lapl, class: SEP_LAND }
    status: expired
    messageKey: pax.prerequisite_not_met
    requirements:
      pic_since_issue: { current: 300 }
