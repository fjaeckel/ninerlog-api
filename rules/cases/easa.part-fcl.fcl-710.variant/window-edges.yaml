rule: easa.part-fcl.fcl-710.variant
name: window-edges
description: "A flight on 15 September 2024 counts on 15 September 2026; one on 14 September 2024 does not."
covers: [window:edge-in, window:edge-out]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
  variants:
    - { id: v-electric, ratingId: r-sep, name: ELECTRIC, issued: 2023-05-01 }
  flights:
    - { date: 2024-09-14, class: SEP_LAND, variant: ELECTRIC, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    - { date: 2024-09-15, class: SEP_LAND, variant: ELECTRIC, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
expect:
  - subject: { kind: type, id: v-electric, class: SEP_LAND }
    status: current
    messageKey: type.current
    validUntil: 2026-09-15
    requirements:
      variant_flown: { current: 1 }
