rule: easa.part-sfcl.sfcl-150-b.tmg-extension
name: in-progress
description: >-
  Sailplane instruction does not count, a dual cross-country flight is not solo and a
  120 km solo flight is too short; the skill test is still to come.
covers: [stage:in_progress, requirement:instruction_time:unmet, requirement:dual_time:unmet, requirement:solo_cross_country:unmet, requirement:skill_test:unmet]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  flights:
    - { date: 2026-04-01, class: GLIDER, launchMethod: winch, minutes: { total: 600, dual: 600 }, launches: 30, landings: { day: 30 } }
    - { date: 2026-05-01, class: TMG, minutes: { total: 120, dual: 120, crossCountry: 120 }, distanceKm: 200, takeoffs: { day: 2 }, landings: { day: 2 }, launches: 2 }
    - { date: 2026-05-02, class: TMG, minutes: { total: 90, pic: 90, crossCountry: 90 }, distanceKm: 120, takeoffs: { day: 2 }, landings: { day: 2 }, launches: 2 }
expect:
  - subject: { kind: training, id: l-spl, detail: SPL_TMG_EXTENSION }
    status: lapsed
    messageKey: training.in_progress
    requirements:
      instruction_time: { current: 120, met: false }
      dual_time: { current: 120, met: false }
      solo_cross_country: { current: 0, met: false }
      skill_test: { current: 0, met: false }
