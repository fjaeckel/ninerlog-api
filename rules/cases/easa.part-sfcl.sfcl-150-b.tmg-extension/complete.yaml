rule: easa.part-sfcl.sfcl-150-b.tmg-extension
name: complete
description: >-
  Six hours of TMG instruction with 4 hours dual, a 160 km solo cross-country flight and a
  TMG skill test complete the extension.
covers: [stage:complete, requirement:instruction_time:met, requirement:dual_time:met, requirement:solo_cross_country:met, requirement:skill_test:met]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  flights:
    - { date: 2026-04-01, class: TMG, minutes: { total: 240, dual: 240 }, takeoffs: { day: 12 }, landings: { day: 12 }, launches: 12 }
    - { date: 2026-05-01, class: TMG, minutes: { total: 150, spic: 150, crossCountry: 150 }, distanceKm: 160, takeoffs: { day: 2 }, landings: { day: 2 }, launches: 2 }
  events:
    - { date: 2026-06-01, kind: skill_test, class: TMG }
expect:
  - subject: { kind: training, id: l-spl, detail: SPL_TMG_EXTENSION }
    status: current
    messageKey: training.all_met
    requirements:
      instruction_time: { current: 390, met: true }
      dual_time: { current: 240, met: true }
      solo_cross_country: { current: 1, met: true }
      skill_test: { current: 1, met: true }
