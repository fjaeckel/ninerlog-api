rule: other.ninerlog.privilege-expiry
name: valid-on-expiry-day
description: A privilege is valid through its recorded expiry date.
covers: [stage:valid, expiry:on]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: DULV, type: UL }
  privileges:
    - { id: p-1, licenceId: l-1, kind: UL_PASSENGER_AUTH, expires: 2026-09-15 }
expect:
  - subject: { kind: privilege, id: p-1 }
    status: current
    messageKey: privilege.valid
    messageParams: { date: "2026-09-15" }
    expiresOn: 2026-09-15
