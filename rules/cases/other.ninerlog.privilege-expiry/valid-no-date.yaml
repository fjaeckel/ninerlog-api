rule: other.ninerlog.privilege-expiry
name: valid-no-date
description: A privilege with no recorded expiry is valid indefinitely.
covers: [stage:valid]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: DULV, type: UL }
  privileges:
    - { id: p-1, licenceId: l-1, kind: UL_PASSENGER_AUTH }
expect:
  - subject: { kind: privilege, id: p-1 }
    status: current
    messageKey: privilege.valid
    messageParams: {}
