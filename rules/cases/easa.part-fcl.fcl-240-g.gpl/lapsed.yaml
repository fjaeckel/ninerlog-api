rule: easa.part-fcl.fcl-240-g.gpl
name: lapsed
description: >-
  Twelve landings but 11 take-offs are not 12 take-offs and landings; the flight the day
  before the 2-year window no longer counts; without refresher training or a check the GPL
  privileges are lapsed.
covers: [stage:lapsed, requirement:total_time:unmet, requirement:takeoffs_landings:unmet, requirement:refresher:unmet, window:edge-out]
asOf: 2026-09-15
record:
  licences:
    - { id: l-gpl, authority: LBA, type: GPL }
  ratings:
    - { id: r-gyro, licenceId: l-gpl, class: GYROPLANE }
  flights:
    - { date: 2024-09-14, class: GYROPLANE, minutes: { total: 600, pic: 540, dual: 60 }, takeoffs: { day: 12 }, landings: { day: 12 } }
    - { date: 2026-03-01, class: GYROPLANE, minutes: { total: 300, pic: 300 }, takeoffs: { day: 11 }, landings: { day: 12 } }
expect:
  - subject: { kind: rating, id: r-gyro }
    status: lapsed
    messageKey: rating.recency_not_met
    requirements:
      total_time: { current: 300, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 420, unit: minutes } }
      takeoffs_landings: { current: 11, met: false, remedyParams: { missing: 1, unit: landings } }
      refresher: { current: 0, met: false }
      proficiency_check: { current: 0, met: false, remedyKey: remedy.proficiency_check }
