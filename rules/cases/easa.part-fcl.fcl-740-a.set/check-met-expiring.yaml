rule: easa.part-fcl.fcl-740-a.set
name: check-met-expiring
description: A proficiency check in the class within the 3 months before expiry revalidates the rating.
covers: [stage:met_expiring, requirement:proficiency_check:met, expiry:before]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-set, licenceId: l-ppl, class: SET_LAND, expires: 2026-10-31 }
  flights:
    - { date: 2026-08-20, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
expect:
  - subject: { kind: rating, id: r-set, class: SET_LAND }
    status: expiring
    messageKey: rating.revalidation_expiring_met
    messageParams: { days: 46 }
    windowOpensAt: 2026-07-31
    requirements:
      proficiency_check: { current: 1, required: 1, met: true, lastDate: 2026-08-20 }
