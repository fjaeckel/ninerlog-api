rule: easa.part-fcl.fcl-740-a.set
name: met-current
description: With 92 days to expiry, on the first day of the window, a check makes the rating current.
covers: [stage:met]
asOf: 2026-09-30
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-set, licenceId: l-ppl, class: SET_LAND, expires: 2026-12-31 }
  flights:
    - { date: 2026-09-30, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
expect:
  - subject: { kind: rating, id: r-set }
    status: current
    messageKey: rating.revalidation_current
