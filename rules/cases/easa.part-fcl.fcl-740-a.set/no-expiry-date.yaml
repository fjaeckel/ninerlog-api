rule: easa.part-fcl.fcl-740-a.set
name: no-expiry-date
description: Without an expiry date the window cannot be placed.
covers: [stage:no_expiry]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-set, licenceId: l-ppl, class: SET_LAND }
  flights:
    - { date: 2026-08-20, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
expect:
  - subject: { kind: rating, id: r-set }
    status: unknown
    messageKey: rating.no_expiry_date
