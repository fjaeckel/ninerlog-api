rule: easa.part-sfcl.sfcl-160-e-2.tmg-passengers
name: expired-night-rating
description: A TMG night rating that expired the day before gives no night privilege; day passengers only.
covers: [stage:day_no_night_rating, requirement:day:met]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  ratings:
    - { id: r-tmg, licenceId: l-spl, class: TMG }
  privileges:
    - { id: p-night, licenceId: l-spl, kind: TMG_NIGHT, expires: 2026-09-14 }
  flights:
    - { date: 2026-08-01, class: TMG, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 }, launches: 3 }
expect:
  - subject: { kind: passengers, id: l-spl, class: TMG }
    status: current
    messageKey: pax.current_day_no_night_privilege
    requirements:
      night_landings: { absent: true }
