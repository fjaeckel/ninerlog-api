rule: easa.part-sfcl.sfcl-160-e-2.tmg-passengers
name: not-current
description: >-
  Three landings but two take-offs as PIC do not make three take-offs and landings;
  take-offs the day before the window and dual flights do not count.
covers: [stage:not_current, requirement:day:unmet, window:edge-out]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  ratings:
    - { id: r-tmg, licenceId: l-spl, class: TMG }
  flights:
    - { date: 2026-06-16, class: TMG, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 }, launches: 3 }
    - { date: 2026-07-01, class: TMG, minutes: { total: 60, dual: 60 }, takeoffs: { day: 3 }, landings: { day: 3 }, launches: 3 }
    - { date: 2026-08-01, class: TMG, minutes: { total: 60, pic: 60 }, takeoffs: { day: 2 }, landings: { day: 3 }, launches: 2 }
expect:
  - subject: { kind: passengers, id: l-spl, class: TMG }
    status: expired
    messageKey: pax.not_current
    messageParams: { needed: 1 }
    requirements:
      day: { current: 2, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 1, unit: landings } }
