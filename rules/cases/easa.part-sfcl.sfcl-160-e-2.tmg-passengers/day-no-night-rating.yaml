rule: easa.part-sfcl.sfcl-160-e-2.tmg-passengers
name: day-no-night-rating
description: >-
  Three take-offs and landings as PIC in a TMG, the first on the window's first day, allow
  day passengers; without a TMG night rating there are no night rows.
covers: [stage:day_no_night_rating, requirement:day:met, window:edge-in]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  ratings:
    - { id: r-tmg, licenceId: l-spl, class: TMG }
  flights:
    - { date: 2026-06-17, class: TMG, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, launches: 1 }
    - { date: 2026-08-17, class: TMG, minutes: { total: 60, pic: 60 }, takeoffs: { day: 2 }, landings: { day: 2 }, launches: 2 }
expect:
  - subject: { kind: passengers, id: l-spl, class: TMG }
    status: current
    messageKey: pax.current_day_no_night_privilege
    validUntil: 2026-09-15
    requirements:
      day: { current: 3, met: true }
      night_takeoffs: { absent: true }
      night_landings: { absent: true }
