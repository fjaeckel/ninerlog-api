rule: easa.part-sfcl.sfcl-215.cloud-flying
name: time-current
description: >-
  One hour of cloud flying as PIC in sailplanes in the last 24 months, part of it on the
  window's first day, keeps the privilege current; IFR time in a TMG does not count.
covers: [stage:current, any_of:cloud_flying:cloud_flying_time, requirement:cloud_flying_time:met, requirement:cloud_flying_flights:unmet, window:edge-in, expiry:before]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  privileges:
    - { id: p-cloud, licenceId: l-spl, kind: CLOUD_FLYING, expires: 2030-12-31 }
  flights:
    - { date: 2024-09-15, class: GLIDER, minutes: { total: 120, pic: 120, ifr: 20 }, launches: 1, landings: { day: 1 } }
    - { date: 2026-06-01, class: GLIDER, minutes: { total: 180, pic: 180, ifr: 40 }, launches: 1, landings: { day: 1 } }
    - { date: 2026-07-01, class: TMG, minutes: { total: 60, pic: 60, ifr: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, launches: 1 }
expect:
  - subject: { kind: privilege, id: p-cloud }
    status: current
    messageKey: privilege.recency_current
    messageParams: { date: 2030-12-31 }
    validUntil: 2026-09-15
    requirements:
      cloud_flying_time: { current: 60, met: true }
      cloud_flying_flights: { current: 2, met: false }
