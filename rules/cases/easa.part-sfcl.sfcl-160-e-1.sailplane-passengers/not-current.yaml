rule: easa.part-sfcl.sfcl-160-e-1.sailplane-passengers
name: not-current
description: >-
  Launches the day before the 90-day window, dual launches, supervised solo launches and
  TMG take-offs do not count; one launch as PIC leaves two to fly.
covers: [stage:not_current, requirement:launches:unmet, window:edge-out]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: LBA, type: SPL }
  ratings:
    - { id: r-gld, licenceId: l-spl, class: GLIDER }
  flights:
    - { date: 2026-06-16, class: GLIDER, launchMethod: winch, minutes: { total: 30, pic: 30 }, launches: 3, landings: { day: 3 } }
    - { date: 2026-07-01, class: GLIDER, launchMethod: winch, minutes: { total: 30, dual: 30 }, launches: 4, landings: { day: 4 } }
    - { date: 2026-07-02, class: GLIDER, launchMethod: winch, minutes: { total: 30, spic: 30 }, launches: 4, landings: { day: 4 } }
    - { date: 2026-08-01, class: TMG, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 }, launches: 3 }
    - { date: 2026-09-01, class: GLIDER, launchMethod: aerotow, minutes: { total: 90, pic: 90 }, launches: 1, landings: { day: 1 } }
expect:
  - subject: { kind: passengers, id: l-spl, class: GLIDER }
    status: expired
    messageKey: pax.not_current
    messageParams: { needed: 2 }
    requirements:
      launches: { current: 1, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 2, unit: launches } }
