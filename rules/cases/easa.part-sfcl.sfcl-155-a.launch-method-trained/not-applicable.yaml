rule: easa.part-sfcl.sfcl-155-a.launch-method-trained
name: not-applicable
description: >-
  A launch-method training privilege on a DAeC or FAA licence is not a Part-SFCL training
  record; other.ninerlog.privilege-expiry.launch-method evaluates it instead.
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DAeC, type: UL }
    - { id: l-faa, authority: FAA, type: PRIVATE }
  privileges:
    - { id: p-1, licenceId: l-ul, kind: LAUNCH_METHOD_TRAINED, detail: winch }
    - { id: p-2, licenceId: l-faa, kind: LAUNCH_METHOD_TRAINED, detail: aerotow }
expect: []
