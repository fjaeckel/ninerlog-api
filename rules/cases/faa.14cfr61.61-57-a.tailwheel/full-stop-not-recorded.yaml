rule: faa.14cfr61.61-57-a.tailwheel
name: full-stop-not-recorded
description: One tailwheel flight lacks the full-stop count and another the sole-manipulator field; neither can be counted, so the status is unknown.
covers: [unknown:full_stop_landings, unknown:soleManipulator, stage:not_logged]
asOf: 2026-08-16
record:
  licences:
    - { id: l-faa, authority: FAA, type: PRIVATE }
  ratings:
    - { id: r-sep, licenceId: l-faa, class: SEP_LAND }
  flights:
    - { date: 2026-08-01, class: SEP_LAND, tailwheel: true, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 }, soleManipulator: true }
    - { date: 2026-08-02, class: SEP_LAND, tailwheel: true, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 }, fullStopLandings: 3 }
expect:
  - subject: { kind: passengers, id: l-faa, class: SEP_LAND }
    status: unknown
    messageKey: pax.experience_not_logged
    requirements:
      tailwheel_full_stop: { tracked: false, met: false }
      tailwheel_flown: { current: 2, met: true }
