rule: faa.14cfr61.61-57-a.tailwheel
name: tailwheel-not-recorded
description: When flights do not say whether the airplane has a tailwheel, the tailwheel condition cannot be decided.
covers: [unknown:tailwheel, stage:not_logged]
asOf: 2026-08-16
record:
  licences:
    - { id: l-faa, authority: FAA, type: PRIVATE }
  ratings:
    - { id: r-sep, licenceId: l-faa, class: SEP_LAND }
  flights:
    - { date: 2026-08-01, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 }, fullStopLandings: 3, soleManipulator: true }
expect:
  - subject: { kind: passengers, id: l-faa, class: SEP_LAND }
    status: unknown
    messageKey: pax.experience_not_logged
    requirements:
      tailwheel_full_stop: { tracked: false, met: false }
      tailwheel_flown: { tracked: false }
