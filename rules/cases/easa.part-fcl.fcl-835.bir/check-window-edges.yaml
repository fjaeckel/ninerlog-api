rule: easa.part-fcl.fcl-835.bir
name: check-window-edges
description: "A BIR check on 1 August, 3 months before the 1 November expiry, counts; one on 31 July does not; an IR check is not a BIR check."
covers: [window:before_expiry_months=3:edge-in, window:before_expiry_months=3:edge-out]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: PPL(A) }
  privileges:
    - { id: p-1, licenceId: l-1, kind: BIR, issued: 2025-11-01 }
  events:
    - { date: 2026-07-31, kind: proficiency_check, class: SEP_LAND, rating: BIR }
    - { date: 2026-08-01, kind: proficiency_check, class: SEP_LAND, rating: BIR }
    - { date: 2026-08-02, kind: proficiency_check, class: SEP_LAND, rating: IR }
  flights: []
expect:
  - subject: { kind: privilege, id: p-1 }
    status: current
    requirements:
      proficiency_check: { current: 1, lastDate: 2026-08-01 }
