rule: easa.part-fcl.fcl-835.bir
name: validity-window-edges
description: "IFR time on 1 November 2025, the first day of the validity period, counts; IFR time the day before does not."
covers: [window:before_expiry_months=12:edge-in, window:before_expiry_months=12:edge-out]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: PPL(A) }
  privileges:
    - { id: p-1, licenceId: l-1, kind: BIR, issued: 2025-11-01 }
  flights:
    - { date: 2025-10-31, class: SEP_LAND, minutes: { total: 120, pic: 120, ifr: 120 }, takeoffs: { day: 1 }, landings: { day: 1 }, approaches: 1 }
    - { date: 2025-11-01, class: SEP_LAND, minutes: { total: 120, pic: 120, ifr: 120 }, takeoffs: { day: 1 }, landings: { day: 1 }, approaches: 1 }
expect:
  - subject: { kind: privilege, id: p-1 }
    status: expiring
    requirements:
      ifr_pic_time: { current: 120 }
