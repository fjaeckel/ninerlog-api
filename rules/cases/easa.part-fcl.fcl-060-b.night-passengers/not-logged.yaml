rule: easa.part-fcl.fcl-060-b.night-passengers
name: not-logged
description: A night landing without the pilot-flying field cannot be counted; an FFS session of unknown type is unknown too.
covers: [unknown:pilotFlying, unknown:fstdTypes, stage:pilot_flying_not_logged]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
  flights:
    - { date: 2026-08-20, class: SEP_LAND, minutes: { total: 60, pic: 60, night: 60 }, takeoffs: { night: 1 }, landings: { night: 1 } }
    - { date: 2026-08-21, class: SEP_LAND, isSimulator: true, minutes: { total: 60 }, takeoffs: { night: 1 }, landings: { night: 1 }, pilotFlying: true }
expect:
  - subject: { kind: passengers, id: l-ppl, class: SEP_LAND }
    status: unknown
    messageKey: pax.experience_not_logged
    requirements:
      night_landings: { met: false, tracked: false }
