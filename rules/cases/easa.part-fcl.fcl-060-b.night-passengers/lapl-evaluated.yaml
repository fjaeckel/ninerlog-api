rule: easa.part-fcl.fcl-060-b.night-passengers
name: lapl-evaluated
description: "A LAPL(A) holder is evaluated too: whether the pilot may fly at night (night rating) is a separate question."
covers: [stage:current]
asOf: 2026-09-15
record:
  licences:
    - { id: l-lapl, authority: EASA, type: LAPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-lapl, class: SEP_LAND }
  flights:
    - { date: 2026-08-20, class: SEP_LAND, minutes: { total: 60, pic: 60, night: 60 }, takeoffs: { night: 1 }, landings: { night: 1 }, pilotFlying: true }
expect:
  - subject: { kind: passengers, id: l-lapl, class: SEP_LAND }
    status: current
    messageKey: pax.night_current
