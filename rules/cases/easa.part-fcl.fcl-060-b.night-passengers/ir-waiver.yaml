rule: easa.part-fcl.fcl-060-b.night-passengers
name: ir-waiver
description: A valid IR on the same licence waives the night take-off and landing.
covers: [stage:ir_waiver, requirement:night_landings:unmet, requirement:night_takeoffs:unmet]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
    - { id: r-ir, licenceId: l-ppl, class: IR, expires: 2026-12-31 }
  flights:
    - { date: 2026-08-20, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, pilotFlying: true }
expect:
  - subject: { kind: passengers, id: l-ppl, class: SEP_LAND }
    status: current
    messageKey: pax.night_waived_ir
    requirements:
      night_landings: { current: 0, met: false }
