rule: de.luftpersv.42.weight-shift-training
name: in-progress
description: Nine hours dual and no solo yet; kindless ultralight flights are unknown input.
covers: [stage:in_progress, requirement:total_time:unmet, requirement:dual_time:unmet, requirement:solo_time:unmet, unknown:ulKinds]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DULV, type: UL }
  flights:
    - { date: 2025-04-01, class: ULTRALIGHT, ulKind: WEIGHT_SHIFT, minutes: { total: 540, dual: 540 } }
    - { date: 2025-04-02, class: ULTRALIGHT, minutes: { total: 60, dual: 60 } }
expect:
  - subject: { kind: training, id: l-ul, detail: UL_WEIGHT_SHIFT }
    status: lapsed
    messageKey: training.in_progress
    requirements:
      total_time: { current: 540, met: false }
      dual_time: { current: 540, met: false, remedyParams: { missing: 60, unit: minutes } }
      solo_time: { current: 0, met: false }
