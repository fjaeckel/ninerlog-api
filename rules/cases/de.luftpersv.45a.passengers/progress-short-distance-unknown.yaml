rule: de.luftpersv.45a.passengers
name: progress-short-distance-unknown
description: >-
  No authorisation and no recency on a UL helicopter: two cross-country flights with an
  instructor; one landing flight covers 210 km, the other has no distance recorded.
covers: [stage:not_current, requirement:ul_xc_flights:unmet, requirement:ul_xc_landing_flights:unmet, unknown:minDistanceKm]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DULV, type: UL, issued: 2025-03-01 }
  ratings:
    - { id: r-heli, licenceId: l-ul, class: ULTRALIGHT, ulKind: HELICOPTER }
  flights:
    - { date: 2025-05-01, class: ULTRALIGHT, ulKind: HELICOPTER, minutes: { total: 120, dual: 120, crossCountry: 120 }, landings: { day: 2 }, distanceKm: 210 }
    - { date: 2025-05-02, class: ULTRALIGHT, ulKind: HELICOPTER, minutes: { total: 120, dual: 120, crossCountry: 120 }, landings: { day: 2 } }
expect:
  - subject: { kind: passengers, id: l-ul, ulKind: HELICOPTER }
    status: expired
    messageKey: pax.not_current
    messageParams: { needed: 3 }
    requirements:
      ul_xc_flights: { current: 2, met: false }
      ul_xc_landing_flights: { current: 1, met: false }
