rule: de.luftpersv.45a.passengers
name: kind-unknown
description: Take-offs and landings on an ultralight with no kind recorded are not counted for the powered paraglider.
covers: [stage:not_current, unknown:ulKinds]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DULV, type: UL }
  ratings:
    - { id: r-ppg, licenceId: l-ul, class: ULTRALIGHT, ulKind: POWERED_PARAGLIDER }
  privileges:
    - { id: p-pax, licenceId: l-ul, kind: UL_PASSENGER_AUTH }
  flights:
    - { date: 2026-09-01, class: ULTRALIGHT, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 } }
expect:
  - subject: { kind: passengers, id: l-ul, ulKind: POWERED_PARAGLIDER }
    status: expired
    messageKey: pax.not_current
    requirements:
      day: { tracked: false }
