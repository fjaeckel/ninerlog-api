rule: easa.part-fcl.fcl-625-h.ir
name: fstd-check
description: An IR check in an FSTD recorded with the HELICOPTER class counts; an IR check recorded in SEP_LAND does not.
covers: [requirement:proficiency_check:met, stage:met_expiring]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: PPL(H) }
  ratings:
    - { id: r-ir, licenceId: l-1, class: IR, expires: 2026-10-31 }
  events:
    - { date: 2026-08-10, kind: proficiency_check, class: SEP_LAND, rating: IR }
  flights:
    - { date: 2026-08-20, class: HELICOPTER, isSimulator: true, fstdType: FFS, minutes: { total: 60, simulatedInstrument: 60 }, checkRating: IR, flags: { proficiencyCheck: true } }
expect:
  - subject: { kind: rating, id: r-ir }
    status: expiring
    messageKey: rating.revalidation_expiring_met
    requirements:
      proficiency_check: { current: 1, met: true, lastDate: 2026-08-20 }
