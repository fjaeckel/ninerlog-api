rule: easa.part-fcl.fcl-625-h.ir
name: valid-on-expiry-day
description: On its expiry date the IR is still valid.
covers: [expiry:on, stage:met_expiring]
asOf: 2026-10-31
record:
  licences:
    - { id: l-1, authority: EASA, type: PPL(H) }
  ratings:
    - { id: r-ir, licenceId: l-1, class: IR, expires: 2026-10-31 }
  flights:
    - { date: 2026-08-20, class: HELICOPTER, minutes: { total: 60, pic: 60, ifr: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, checkRating: IR, flags: { proficiencyCheck: true, examinerOnBoard: true } }
expect:
  - subject: { kind: rating, id: r-ir }
    status: expiring
    messageKey: rating.revalidation_expiring_met
    messageParams: { days: 0 }
