rule: easa.part-med.med-a-045.class-1
name: revalidation-from-previous-expiry
description: "A revalidated certificate runs from the previous expiry date (validFrom), not from the examination."
covers: [stage:valid]
asOf: 2026-09-15
record:
  holder: { dateOfBirth: 1980-05-20 }
  credentials:
    - { id: c-med, type: EASA_CLASS1_MEDICAL, issued: 2026-02-10, validFrom: 2026-03-01 }
expect:
  - subject: { kind: credential, id: c-med }
    status: current
    expiresOn: 2027-03-01
