rule: easa.part-sfcl.sfcl-115-a-2.passengers
name: not-met
description: >-
  Flights before the SPL was issued (here the day before) do not count; with 2 hours and
  12 launches since issue the pilot may not carry passengers yet.
covers: [stage:not_met, requirement:pax_prerequisite_time:unmet, requirement:pax_prerequisite_launches:unmet, window:edge-out]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL, issued: 2025-04-01 }
  ratings:
    - { id: r-gld, licenceId: l-spl, class: GLIDER }
  flights:
    - { date: 2025-03-31, class: GLIDER, launchMethod: winch, minutes: { total: 900, pic: 900 }, launches: 60, landings: { day: 60 } }
    - { date: 2025-08-01, class: GLIDER, launchMethod: winch, minutes: { total: 120, pic: 120 }, launches: 12, landings: { day: 12 } }
expect:
  - subject: { kind: passengers, id: l-spl, class: GLIDER }
    status: expired
    messageKey: pax.prerequisite_not_met
    messageParams: { needed: 480 }
    requirements:
      pax_prerequisite_time: { current: 120, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 480, unit: minutes } }
      pax_prerequisite_launches: { current: 12, met: false, remedyParams: { missing: 18, unit: launches } }
