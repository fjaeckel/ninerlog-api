rule: easa.part-sfcl.sfcl-115-a-2.passengers
name: issue-date-unknown
description: Without a recorded SPL issue date the flights since issue cannot be counted.
covers: [stage:issue_date_unknown]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  ratings:
    - { id: r-gld, licenceId: l-spl, class: GLIDER }
  flights:
    - { date: 2025-08-01, class: GLIDER, launchMethod: winch, minutes: { total: 900, pic: 900 }, launches: 40, landings: { day: 40 } }
expect:
  - subject: { kind: passengers, id: l-spl, class: GLIDER }
    status: unknown
    messageKey: pax.prerequisite_unknown
    requirements:
      pax_prerequisite_time: { tracked: false }
