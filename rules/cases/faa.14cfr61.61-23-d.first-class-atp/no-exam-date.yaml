rule: faa.14cfr61.61-23-d.first-class-atp
name: no-exam-date
description: A first-class medical recorded without an examination date and without an expiry has no derivable duration.
covers: [stage:no_exam_date]
asOf: 2026-08-16
record:
  holder: { dateOfBirth: 1980-06-01 }
  licences:
    - { id: l-atp, authority: FAA, type: ATP }
  credentials:
    - { id: c-med, type: FAA_CLASS1_MEDICAL }
expect:
  - subject: { kind: credential, id: c-med }
    status: unknown
    messageKey: credential.no_expiry_date
