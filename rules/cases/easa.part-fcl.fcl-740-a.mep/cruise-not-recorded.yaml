rule: easa.part-fcl.fcl-740-a.mep
name: cruise-not-recorded
description: With the proficiency check passed but no cruise time recorded on any flight, the route sectors cannot be counted and the rating is reported unknown, never current.
covers: [unknown:route_sectors, stage:sectors_not_logged]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-mep, licenceId: l-ppl, class: MEP_LAND, expires: 2026-10-31 }
  flights:
    - { date: 2026-05-10, class: MEP_LAND, minutes: { total: 90, pic: 90 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    - { date: 2026-08-20, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true } }
expect:
  - subject: { kind: rating, id: r-mep }
    status: unknown
    messageKey: rating.route_sectors_not_logged
    requirements:
      proficiency_check: { met: true }
      sectors: { met: false, tracked: false }
      examiner_sector: { current: 0, met: false, tracked: true }
