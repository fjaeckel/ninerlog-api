rule: easa.part-fcl.fcl-740-a.mep
name: window-not-open
description: More than 12 months before expiry the revalidation window is not open yet.
covers: [stage:window_not_open]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-mep, licenceId: l-ppl, class: MEP_LAND, expires: 2027-12-31 }
  flights: []
expect:
  - subject: { kind: rating, id: r-mep }
    status: current
    messageKey: rating.window_not_open
    messageParams: { date: 2026-12-31 }
    windowOpensAt: 2026-12-31
