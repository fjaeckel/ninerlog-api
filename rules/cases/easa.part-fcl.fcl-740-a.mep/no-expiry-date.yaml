rule: easa.part-fcl.fcl-740-a.mep
name: no-expiry-date
description: Without an expiry date the windows cannot be placed.
covers: [stage:no_expiry]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-mep, licenceId: l-ppl, class: MEP_LAND }
  flights:
    - { date: 2026-08-20, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30, flags: { proficiencyCheck: true, examinerOnBoard: true } }
expect:
  - subject: { kind: rating, id: r-mep }
    status: unknown
    messageKey: rating.no_expiry_date
    requirements:
      proficiency_check: { met: false, tracked: false }
