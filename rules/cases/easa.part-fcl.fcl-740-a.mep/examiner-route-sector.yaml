rule: easa.part-fcl.fcl-740-a.mep
name: examiner-route-sector
description: The proficiency check flown with an examiner is also the one route sector with an examiner; no further sectors are needed.
covers: [any_of:route_sectors:examiner_sector, requirement:examiner_sector:met, requirement:sectors:unmet, stage:met_expiring]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-mep, licenceId: l-ppl, class: MEP_LAND, expires: 2026-10-31 }
  flights:
    - { date: 2026-08-20, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30, flags: { proficiencyCheck: true, examinerOnBoard: true } }
expect:
  - subject: { kind: rating, id: r-mep }
    status: expiring
    messageKey: rating.revalidation_expiring_met
    requirements:
      proficiency_check: { current: 1, met: true }
      sectors: { current: 1, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 9, unit: sectors } }
      examiner_sector: { current: 1, met: true }
