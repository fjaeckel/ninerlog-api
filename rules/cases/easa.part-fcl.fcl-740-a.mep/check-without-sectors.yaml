rule: easa.part-fcl.fcl-740-a.mep
name: check-without-sectors
description: >-
  A proficiency check in the class alone does not revalidate an MEP rating: the 10 route
  sectors, or one with an examiner, are needed as well.
covers: [expiry:before, requirement:examiner_sector:unmet, requirement:proficiency_check:met, requirement:sectors:unmet, stage:not_met]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-mep, licenceId: l-ppl, class: MEP_LAND, expires: 2026-10-31 }
  flights:
    - { date: 2026-08-20, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 10, flags: { proficiencyCheck: true } }
expect:
  - subject: { kind: rating, class: MEP_LAND, id: r-mep }
    status: expiring
    messageKey: rating.revalidation_not_met_prof_check
    requirements:
      proficiency_check: { current: 1, met: true }
      sectors: { current: 0, met: false }
      examiner_sector: { current: 0, met: false }
