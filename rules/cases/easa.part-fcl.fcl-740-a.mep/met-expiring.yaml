rule: easa.part-fcl.fcl-740-a.mep
name: met-expiring
description: A proficiency check in the 3 months before expiry and 10 route sectors in the 12 months before expiry revalidate the rating; with 46 days left it shows as expiring.
covers:
  - stage:met_expiring
  - any_of:route_sectors:sectors
  - requirement:proficiency_check:met
  - requirement:sectors:met
  - requirement:examiner_sector:unmet
  - expiry:before
asOf: 2026-09-15
record:
  licences:
    - { id: l-ppl, authority: EASA, type: PPL(A) }
  ratings:
    - { id: r-mep, licenceId: l-ppl, class: MEP_LAND, expires: 2026-10-31 }
  flights:
    - { date: 2026-01-10, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
    - { date: 2026-02-10, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
    - { date: 2026-03-10, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
    - { date: 2026-04-10, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
    - { date: 2026-05-10, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
    - { date: 2026-06-10, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
    - { date: 2026-06-20, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
    - { date: 2026-07-05, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
    - { date: 2026-07-15, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
    - { date: 2026-08-20, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30, flags: { proficiencyCheck: true } }
expect:
  - subject: { kind: rating, id: r-mep, class: MEP_LAND }
    status: expiring
    messageKey: rating.revalidation_expiring_met
    messageParams: { days: 46 }
    expiresOn: 2026-10-31
    windowOpensAt: 2025-10-31
    requirements:
      proficiency_check: { current: 1, required: 1, met: true, lastDate: 2026-08-20 }
      sectors: { current: 10, required: 10, met: true }
      examiner_sector: { current: 0, met: false }
