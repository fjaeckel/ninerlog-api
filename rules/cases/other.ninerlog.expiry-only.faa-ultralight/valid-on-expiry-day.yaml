rule: other.ninerlog.expiry-only.faa-ultralight
name: valid-on-expiry-day
description: On its expiry date the rating is still valid (expiring, 0 days left).
covers: [stage:expiring, expiry:on]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: FAA, type: PPL }
  ratings:
    - { id: r-1, licenceId: l-1, class: ULTRALIGHT, expires: 2026-09-15 }
expect:
  - subject: { kind: rating, id: r-1 }
    status: expiring
    messageKey: rating.expiring
    messageParams: { days: 0 }
