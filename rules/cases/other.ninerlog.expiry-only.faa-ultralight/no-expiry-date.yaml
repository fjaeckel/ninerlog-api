rule: other.ninerlog.expiry-only.faa-ultralight
name: no-expiry-date
description: Without a recorded expiry date there is nothing to track; the pilot is asked to enter it.
covers: [stage:no_expiry]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: FAA, type: PPL }
  ratings:
    - { id: r-1, licenceId: l-1, class: ULTRALIGHT }
expect:
  - subject: { kind: rating, id: r-1 }
    status: unknown
    messageKey: rating.no_expiry_date_manual
