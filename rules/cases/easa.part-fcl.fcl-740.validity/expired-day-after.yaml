rule: easa.part-fcl.fcl-740.validity
name: expired-day-after
description: The day after its expiry date the rating is expired.
covers: [stage:expired, expiry:after]
asOf: 2026-11-01
record:
  licences:
    - { id: l-atpl, authority: EASA, type: ATPL(A) }
  ratings:
    - { id: r-type, licenceId: l-atpl, class: OTHER, typeDesignator: A320, expires: 2026-10-31 }
expect:
  - subject: { kind: rating, id: r-type, class: OTHER }
    status: expired
    messageKey: rating.expired
