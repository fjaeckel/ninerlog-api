rule: easa.part-fcl.fcl-740.validity
name: expiring
description: With 46 days left the rating shows as expiring.
covers: [stage:expiring]
asOf: 2026-09-15
record:
  licences:
    - { id: l-atpl, authority: EASA, type: ATPL(A) }
  ratings:
    - { id: r-type, licenceId: l-atpl, class: OTHER, typeDesignator: A320, expires: 2026-10-31 }
expect:
  - subject: { kind: rating, id: r-type, class: OTHER }
    status: expiring
    messageKey: rating.expiring
    messageParams: { days: 46 }
