rule: de.daec.ul-recency.sailplane
name: kind-unknown
description: Ultralight flights with no kind recorded cannot be counted as UL sailplane flights; the recency is unknown.
covers: [stage:kind_unknown, unknown:ulKinds]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DAeC, type: UL }
  ratings:
    - { id: r-sail, licenceId: l-ul, class: ULTRALIGHT, ulKind: SAILPLANE }
  flights:
    - { date: 2026-04-01, class: ULTRALIGHT, minutes: { total: 60, pic: 60 }, landings: { day: 5 } }
expect:
  - subject: { kind: rating, id: r-sail }
    status: unknown
    messageKey: rating.ul_flights_kind_unknown
