rule: de.daec.ul-recency.sailplane
name: current-edge-in
description: >-
  Five landings with ultralight sailplanes in 12 months, the first on the first day of the
  window; winch-launched flights count.
covers: [stage:current, window:edge-in, requirement:landings:met]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DAeC, type: UL }
  ratings:
    - { id: r-sail, licenceId: l-ul, class: ULTRALIGHT, ulKind: SAILPLANE }
  flights:
    - { date: 2025-09-15, class: ULTRALIGHT, ulKind: SAILPLANE, launchMethod: winch, minutes: { total: 20, pic: 20 }, landings: { day: 1 } }
    - { date: 2026-05-01, class: ULTRALIGHT, ulKind: SAILPLANE, launchMethod: aerotow, minutes: { total: 240, pic: 240 }, landings: { day: 4 } }
expect:
  - subject: { kind: rating, id: r-sail, ulKind: SAILPLANE }
    status: current
    messageKey: rating.recency_current
    validUntil: 2026-09-15
    requirements:
      landings: { current: 5, required: 5, met: true }
