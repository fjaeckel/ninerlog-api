rule: de.daec.ul-recency.sailplane
name: window-day-before
description: The landing of 14 September 2025 is outside the 12 months, and Part-FCL glider landings do not count.
covers: [stage:lapsed, window:edge-out, requirement:landings:unmet]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DULV, type: UL }
  ratings:
    - { id: r-sail, licenceId: l-ul, class: ULTRALIGHT, ulKind: SAILPLANE }
  flights:
    - { date: 2025-09-14, class: ULTRALIGHT, ulKind: SAILPLANE, launchMethod: winch, minutes: { total: 20, pic: 20 }, landings: { day: 1 } }
    - { date: 2026-05-01, class: ULTRALIGHT, ulKind: SAILPLANE, launchMethod: aerotow, minutes: { total: 240, pic: 240 }, landings: { day: 4 } }
    - { date: 2026-05-02, class: GLIDER, launchMethod: winch, minutes: { total: 30, pic: 30 }, landings: { day: 3 } }
expect:
  - subject: { kind: rating, id: r-sail }
    status: lapsed
    messageKey: rating.recency_not_met
    requirements:
      landings: { current: 4, met: false, remedyParams: { missing: 1, unit: landings } }
