rule: easa.part-fcl.fcl-140-a.lapl-a
name: land-sea-split-met
description: With 1 hour and 6 take-offs and landings in each class, the experience is valid for both privileges.
covers: [requirement:sep_sea_time:met, requirement:sep_sea_takeoffs_landings:met, stage:current]
asOf: 2026-09-15
record:
  licences:
    - { id: l-lapl, authority: EASA, type: LAPL(A) }
  ratings:
    - { id: r-land, licenceId: l-lapl, class: SEP_LAND }
    - { id: r-sea, licenceId: l-lapl, class: SEP_SEA }
  flights:
    - { date: 2026-03-10, class: SEP_LAND, minutes: { total: 600, pic: 600 }, takeoffs: { day: 6 }, landings: { day: 6 } }
    - { date: 2026-04-10, class: SEP_SEA, minutes: { total: 60, pic: 60 }, takeoffs: { day: 6 }, landings: { day: 6 } }
    - { date: 2026-05-10, class: SEP_LAND, minutes: { total: 60, dual: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
expect:
  - subject: { kind: rating, id: r-land }
    status: current
    messageKey: rating.recency_current
    requirements:
      sep_sea_time: { current: 60, met: true }
      sep_sea_takeoffs_landings: { current: 6, met: true }
  - subject: { kind: rating, id: r-sea }
    status: current
    messageKey: rating.recency_current
