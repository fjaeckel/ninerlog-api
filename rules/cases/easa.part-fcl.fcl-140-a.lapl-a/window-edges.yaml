rule: easa.part-fcl.fcl-140-a.lapl-a
name: window-edges
description: A flight on 15 September 2024, 2 years before, counts; one on 14 September 2024 does not.
covers: [window:edge-in, window:edge-out]
asOf: 2026-09-15
record:
  licences:
    - { id: l-lapl, authority: EASA, type: LAPL(A) }
  ratings:
    - { id: r-land, licenceId: l-lapl, class: SEP_LAND }
  flights:
    - { date: 2024-09-14, class: SEP_LAND, minutes: { total: 600, pic: 600 }, takeoffs: { day: 10 }, landings: { day: 10 } }
    - { date: 2024-09-15, class: SEP_LAND, minutes: { total: 300, pic: 300 }, takeoffs: { day: 5 }, landings: { day: 5 } }
    - { date: 2025-11-20, class: TMG, minutes: { total: 60, dual: 60 }, takeoffs: { day: 2 }, landings: { day: 2 } }
    - { date: 2026-06-12, class: SEP_LAND, minutes: { total: 360, pic: 60, dual: 300 }, takeoffs: { day: 5 }, landings: { day: 5 } }
expect:
  - subject: { kind: rating, id: r-land }
    status: current
    messageKey: rating.recency_current
    validUntil: 2026-09-15
    requirements:
      flight_time: { current: 720, met: true }
      takeoffs_landings: { current: 12, met: true }
