rule: easa.part-fcl.fcl-140-a.lapl-a
name: ultralight-credit
description: Three-axis ultralight hours count toward the 12 hours but not toward take-offs, landings or refresher training; weight-shift hours never count; an ultralight flight with no kind is unknown.
covers: [unknown:ulCredit, stage:current]
asOf: 2026-09-15
record:
  licences:
    - { id: l-lapl, authority: EASA, type: LAPL(A) }
  ratings:
    - { id: r-land, licenceId: l-lapl, class: SEP_LAND }
  flights:
    - { date: 2026-04-01, class: SEP_LAND, minutes: { total: 120, pic: 60, dual: 60 }, takeoffs: { day: 12 }, landings: { day: 12 } }
    - { date: 2026-05-01, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 600, pic: 540, dual: 60 }, takeoffs: { day: 10 }, landings: { day: 10 } }
    - { date: 2026-06-01, class: ULTRALIGHT, minutes: { total: 90, pic: 90 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    - { date: 2026-06-02, class: ULTRALIGHT, ulKind: WEIGHT_SHIFT, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
expect:
  - subject: { kind: rating, id: r-land }
    status: current
    messageKey: rating.recency_current
    requirements:
      flight_time: { current: 720, met: true, tracked: true }
      takeoffs_landings: { current: 12 }
      refresher_training: { current: 60, met: true }
