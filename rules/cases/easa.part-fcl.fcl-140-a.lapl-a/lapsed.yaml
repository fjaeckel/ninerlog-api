rule: easa.part-fcl.fcl-140-a.lapl-a
name: lapsed
description: 5 hours and 5 take-offs and landings are not enough; the privilege lapses, every unmet row carries its remedy.
covers: [stage:lapsed, requirement:flight_time:unmet, requirement:takeoffs_landings:unmet, requirement:refresher_training:unmet]
asOf: 2026-09-15
record:
  licences:
    - { id: l-lapl, authority: EASA, type: LAPL(A) }
  ratings:
    - { id: r-land, licenceId: l-lapl, class: SEP_LAND }
  flights:
    - { date: 2026-03-10, class: SEP_LAND, minutes: { total: 300, pic: 300 }, takeoffs: { day: 5 }, landings: { day: 5 } }
expect:
  - subject: { kind: rating, id: r-land }
    status: lapsed
    messageKey: rating.recency_not_met
    requirements:
      flight_time: { current: 300, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 420, unit: minutes } }
      takeoffs_landings: { current: 5, met: false, remedyParams: { missing: 7, unit: landings } }
      refresher_training: { current: 0, met: false, remedyParams: { missing: 60, unit: minutes } }
