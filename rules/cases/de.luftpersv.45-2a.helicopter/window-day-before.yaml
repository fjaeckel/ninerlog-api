rule: de.luftpersv.45-2a.helicopter
name: window-day-before
description: >-
  The training flight of 14 September 2025 is one day outside the 12 months: time, take-offs,
  landings and the training flight all fall short, and the privileges lapse.
covers: [stage:lapsed, window:edge-out, requirement:total_time:unmet, requirement:takeoffs:unmet, requirement:landings:unmet, requirement:training_flight:unmet]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DULV, type: UL }
  ratings:
    - { id: r-heli, licenceId: l-ul, class: ULTRALIGHT, ulKind: HELICOPTER }
  flights:
    - { date: 2025-09-14, class: ULTRALIGHT, ulKind: HELICOPTER, minutes: { total: 75, dual: 75 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    - { date: 2026-05-01, class: ULTRALIGHT, ulKind: HELICOPTER, minutes: { total: 285, pic: 285 }, takeoffs: { day: 5 }, landings: { day: 5 } }
    - { date: 2026-06-01, class: HELICOPTER, minutes: { total: 600, pic: 540, dual: 60 }, takeoffs: { day: 10 }, landings: { day: 10 } }
expect:
  - subject: { kind: rating, id: r-heli }
    status: lapsed
    messageKey: rating.recency_not_met
    requirements:
      total_time: { current: 285, met: false, remedyParams: { missing: 75, unit: minutes } }
      takeoffs: { current: 5, met: false }
      landings: { current: 5, met: false }
      training_flight: { current: 0, met: false, remedyKey: remedy.training_flight }
