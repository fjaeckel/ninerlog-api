rule: de.luftpersv.45-2a.helicopter
name: takeoffs-short
description: >-
  Six hours with six landings but only four take-offs logged on ultralight helicopters, and a
  training flight with an instructor: the article asks for 6 take-offs and 6 landings.
covers: [requirement:landings:met, requirement:proficiency_check:unmet, requirement:takeoffs:unmet, requirement:total_time:met, requirement:training_flight:met, stage:lapsed]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DULV, type: UL }
  ratings:
    - { id: r-heli, licenceId: l-ul, class: ULTRALIGHT, ulKind: HELICOPTER }
  flights:
    - { date: 2026-03-01, class: ULTRALIGHT, ulKind: HELICOPTER, minutes: { total: 75, dual: 75 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    - { date: 2026-05-01, class: ULTRALIGHT, ulKind: HELICOPTER, minutes: { total: 300, pic: 300 }, takeoffs: { day: 3 }, landings: { day: 5 } }
expect:
  - subject: { kind: rating, class: ULTRALIGHT, id: r-heli, ulKind: HELICOPTER }
    status: lapsed
    messageKey: rating.recency_not_met
    requirements:
      total_time: { current: 375, met: true }
      takeoffs: { current: 4, met: false }
      landings: { current: 6, met: true }
      training_flight: { current: 75, met: true }
      proficiency_check: { current: 0, met: false }
