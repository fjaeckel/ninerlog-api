rule: de.luftpersv.45-2a.helicopter
name: kind-unknown
description: Ultralight flights with no kind recorded cannot be counted as helicopter flights; the recency is unknown.
covers: [stage:kind_unknown, unknown:ulKinds]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DULV, type: UL }
  ratings:
    - { id: r-heli, licenceId: l-ul, class: ULTRALIGHT, ulKind: HELICOPTER }
  flights:
    - { date: 2026-04-01, class: ULTRALIGHT, minutes: { total: 400, pic: 340, dual: 60 }, takeoffs: { day: 6 }, landings: { day: 6 } }
expect:
  - subject: { kind: rating, id: r-heli }
    status: unknown
    messageKey: rating.ul_flights_kind_unknown
    requirements:
      total_time: { tracked: false }
