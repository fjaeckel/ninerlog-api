rule: de.luftpersv.45-2a.helicopter
name: proficiency-check
description: >-
  A proficiency check with an examiner on an ultralight helicopter replaces the experience;
  a check in a Part-FCL helicopter does not.
covers: [stage:current, any_of:recency:proficiency_check, requirement:proficiency_check:met]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DAeC, type: UL }
  ratings:
    - { id: r-heli, licenceId: l-ul, class: ULTRALIGHT, ulKind: HELICOPTER }
  events:
    - { date: 2026-01-20, kind: proficiency_check, class: HELICOPTER }
    - { date: 2026-02-20, kind: proficiency_check, class: ULTRALIGHT, ulKind: HELICOPTER }
expect:
  - subject: { kind: rating, id: r-heli }
    status: current
    messageKey: rating.recency_current
    validUntil: 2027-02-20
    requirements:
      proficiency_check: { current: 1, met: true }
