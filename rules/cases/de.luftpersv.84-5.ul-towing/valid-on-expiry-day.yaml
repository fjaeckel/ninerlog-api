rule: de.luftpersv.84-5.ul-towing
name: valid-on-expiry-day
description: A towing rating with a recorded expiry date is valid on that date and its recency still decides the status.
covers: [stage:current, expiry:on]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DULV, type: UL }
  privileges:
    - { id: p-tow, licenceId: l-ul, kind: UL_TOWING, expires: 2026-09-15 }
  flights:
    - { date: 2026-05-01, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 90, pic: 90 }, towedGliders: 10, flags: { towFlight: true } }
expect:
  - subject: { kind: privilege, id: p-tow }
    status: current
    messageKey: privilege.recency_current
    messageParams: { date: "2026-09-15" }
