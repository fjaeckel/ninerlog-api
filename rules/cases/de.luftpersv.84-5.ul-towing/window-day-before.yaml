rule: de.luftpersv.84-5.ul-towing
name: window-day-before
description: The four tows of 14 September 2024 are one day outside the 24 months; the rating may not be used until the tows are made up.
covers: [stage:lapsed, requirement:tows:unmet, window:edge-out]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DAeC, type: UL }
  privileges:
    - { id: p-tow, licenceId: l-ul, kind: UL_TOWING }
  flights:
    - { date: 2024-09-14, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 60, pic: 60 }, towedGliders: 4, flags: { towFlight: true } }
    - { date: 2026-05-01, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 90, pic: 90 }, towedGliders: 6, flags: { towFlight: true } }
expect:
  - subject: { kind: privilege, id: p-tow }
    status: lapsed
    messageKey: privilege.recency_not_met
    requirements:
      tows: { current: 6, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 4, unit: tows } }
