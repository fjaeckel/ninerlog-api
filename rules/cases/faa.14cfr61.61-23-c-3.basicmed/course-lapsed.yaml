rule: faa.14cfr61.61-23-c-3.basicmed
name: course-lapsed
description: A course on 31 July 2024 is outside the 24 calendar months on 16 August 2026 (they start on 1 August 2024); an examination on 1 August 2022 is just inside the 48.
covers: [stage:not_met, requirement:course:unmet, requirement:exam:met, window:calendar_months=24:edge-out, window:calendar_months=48:edge-in]
asOf: 2026-08-16
record:
  credentials:
    - { id: c-dl, type: US_DRIVERS_LICENSE, expires: 2030-01-01 }
    - { id: c-bm, type: FAA_BASICMED }
  events:
    - { date: 2022-08-01, kind: basicmed_exam }
    - { date: 2024-07-31, kind: basicmed_course }
expect:
  - subject: { kind: credential, id: c-bm }
    status: lapsed
    messageKey: credential.basicmed_not_met
    requirements:
      course: { current: 0, met: false }
      exam: { current: 1, met: true, validUntil: 2026-08-31 }
