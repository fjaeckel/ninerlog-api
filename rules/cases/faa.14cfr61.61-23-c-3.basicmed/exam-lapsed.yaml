rule: faa.14cfr61.61-23-c-3.basicmed
name: exam-lapsed
description: A course on 1 August 2024 still counts; the examination of 31 July 2022 is outside the 48 calendar months, so a new comprehensive examination is needed.
covers: [stage:not_met, requirement:exam:unmet, requirement:course:met, window:calendar_months=24:edge-in, window:calendar_months=48:edge-out]
asOf: 2026-08-16
record:
  credentials:
    - { id: c-dl, type: US_DRIVERS_LICENSE, expires: 2030-01-01 }
    - { id: c-bm, type: FAA_BASICMED }
  events:
    - { date: 2022-07-31, kind: basicmed_exam }
    - { date: 2024-08-01, kind: basicmed_course }
expect:
  - subject: { kind: credential, id: c-bm }
    status: lapsed
    messageKey: credential.basicmed_not_met
    requirements:
      course: { met: true }
      exam: { current: 0, met: false }
