    - { id: l-1, authority: EASA, type: CPL(A) }
  ratings:
    - { id: r-type, licenceId: l-1, class: POWERED_LIFT, typeDesignator: AW609, expires: 2026-10-31 }
  flights:
    - { date: 2026-08-20, class: POWERED_LIFT, typeDesignator: AW609, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30, flags: { proficiencyCheck: true, examinerOnBoard: true } }
expect:
