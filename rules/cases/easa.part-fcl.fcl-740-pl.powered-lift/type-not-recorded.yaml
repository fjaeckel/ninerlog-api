rule: easa.part-fcl.fcl-740-pl.powered-lift
name: type-not-recorded
description: "Without a type designator on the rating no flight can be matched to the type; the result is unknown."
covers: [unknown:typeDesignators, stage:undetermined]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: CPL(A) }
  ratings:
    - { id: r-type, licenceId: l-1, class: POWERED_LIFT, expires: 2026-10-31 }
  flights:
    - { date: 2026-03-10, class: POWERED_LIFT, minutes: { total: 120, pic: 120 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
    - { date: 2026-08-20, class: POWERED_LIFT, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30, flags: { proficiencyCheck: true, examinerOnBoard: true } }
expect:
  - subject: { kind: rating, id: r-type, class: POWERED_LIFT }
    status: unknown
    messageKey: rating.type_not_identifiable
