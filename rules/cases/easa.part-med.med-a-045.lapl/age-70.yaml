rule: easa.part-med.med-a-045.lapl
name: age-70
description: "Issued at 70 the certificate runs 24 months."
covers: [stage:valid]
asOf: 2026-09-15
record:
  holder: { dateOfBirth: 1956-01-01 }
  credentials:
    - { id: c-med, type: EASA_LAPL_MEDICAL, issued: 2026-06-01 }
expect:
  - subject: { kind: credential, id: c-med }
    status: current
    expiresOn: 2028-06-01
