rule: easa.part-med.med-a-045.lapl
name: revalidation-window
description: "45 days before expiry the revalidation examination may be taken."
covers: [stage:revalidation_window]
asOf: 2028-01-16
record:
  holder: { dateOfBirth: 1980-05-20 }
  credentials:
    - { id: c-med, type: EASA_LAPL_MEDICAL, issued: 2026-03-01 }
expect:
  - subject: { kind: credential, id: c-med }
    status: expiring
    messageKey: credential.revalidation_window_open
    messageParams: { days: 45, date: 2028-03-01 }
