rule: faa.14cfr61.61-57-b.night-passengers
name: full-stop-not-logged
description: Night takeoffs and landings are logged but not whether the landings were to a full stop; night passenger recency is unknown, not current.
covers: [unknown:full_stop_night_landings, stage:not_logged]
asOf: 2026-08-16
record:
  licences:
    - { id: l-faa, authority: FAA, type: PRIVATE }
  ratings:
    - { id: r-sep, licenceId: l-faa, class: SEP_LAND }
  flights:
    - { date: 2026-08-01, class: SEP_LAND, minutes: { total: 60, pic: 60, night: 60 }, takeoffs: { night: 3 }, landings: { night: 3 }, soleManipulator: true }
expect:
  - subject: { kind: passengers, id: l-faa, class: SEP_LAND }
    status: unknown
    messageKey: pax.experience_not_logged
    requirements:
      night_takeoffs: { current: 3, met: true }
      full_stop_night_landings: { current: 0, met: false, tracked: false }
