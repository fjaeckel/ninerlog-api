rule: easa.part-fcl.fcl-940.validity
name: expired-day-after
description: "The day after its expiry date the certificate is expired."
covers: [stage:expired, expiry:after]
asOf: 2027-01-16
record:
  licences:
    - { id: l-1, authority: EASA, type: CPL(A) }
  privileges:
    - { id: p-1, licenceId: l-1, kind: TRI, issued: 2024-01-15 }
  flights: []
expect:
  - subject: { kind: privilege, id: p-1 }
    status: expired
    messageKey: privilege.expired
    messageParams: { date: 2027-01-15 }
