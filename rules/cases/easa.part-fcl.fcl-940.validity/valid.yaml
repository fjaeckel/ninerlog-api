rule: easa.part-fcl.fcl-940.validity
name: valid
description: "A TRI certificate issued on 15 January 2024 is valid for 3 years."
covers: [stage:valid, expiry:before]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: CPL(A) }
  privileges:
    - { id: p-1, licenceId: l-1, kind: TRI, issued: 2024-01-15 }
  flights: []
expect:
  - subject: { kind: privilege, id: p-1 }
    status: current
    messageKey: privilege.valid
    messageParams: { date: 2027-01-15 }
    expiresOn: 2027-01-15
