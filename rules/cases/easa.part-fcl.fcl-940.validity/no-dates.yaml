rule: easa.part-fcl.fcl-940.validity
name: no-dates
description: "Without an issue or expiry date nothing can be said."
covers: [stage:no_expiry]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: CPL(A) }
  privileges:
    - { id: p-1, licenceId: l-1, kind: TRI }
  flights: []
expect:
  - subject: { kind: privilege, id: p-1 }
    status: unknown
    messageKey: privilege.no_expiry_date
