rule: de.dulv.ul-recency.powered-paraglider
name: kind-unknown
description: Ultralight flights with no kind recorded cannot be counted as powered paraglider flights; the recency is unknown.
covers: [stage:kind_unknown, unknown:ulKinds]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DULV, type: UL }
  ratings:
    - { id: r-ppg, licenceId: l-ul, class: ULTRALIGHT, ulKind: POWERED_PARAGLIDER }
  flights:
    - { date: 2026-04-01, class: ULTRALIGHT, minutes: { total: 60, pic: 60 }, landings: { day: 30 } }
expect:
  - subject: { kind: rating, id: r-ppg }
    status: unknown
    messageKey: rating.ul_flights_kind_unknown
