rule: de.dulv.ul-recency.powered-paraglider
name: window-day-before
description: The landings of 14 September 2024 are outside the 24 months, and trike landings do not count.
covers: [stage:lapsed, window:edge-out, requirement:landings:unmet]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DULV, type: UL }
  ratings:
    - { id: r-ppg, licenceId: l-ul, class: ULTRALIGHT, ulKind: POWERED_PARAGLIDER }
  flights:
    - { date: 2024-09-14, class: ULTRALIGHT, ulKind: POWERED_PARAGLIDER, minutes: { total: 60, pic: 60 }, landings: { day: 10 } }
    - { date: 2026-05-01, class: ULTRALIGHT, ulKind: POWERED_PARAGLIDER, minutes: { total: 120, pic: 120 }, landings: { day: 20 } }
    - { date: 2026-05-02, class: ULTRALIGHT, ulKind: WEIGHT_SHIFT, minutes: { total: 120, pic: 120 }, landings: { day: 20 } }
expect:
  - subject: { kind: rating, id: r-ppg }
    status: lapsed
    messageKey: rating.recency_not_met
    requirements:
      landings: { current: 20, met: false, remedyParams: { missing: 10, unit: landings } }
