rule: other.ninerlog.privilege-expiry.launch-method
name: expired-day-after
description: The day after its expiry date the privilege is expired.
covers: [stage:expired, expiry:after]
asOf: 2026-09-16
record:
  licences:
    - { id: l-1, authority: EASA, type: SPL }
  privileges:
    - { id: p-1, licenceId: l-1, kind: LAUNCH_METHOD_TRAINED, expires: 2026-09-15 }
expect:
  - subject: { kind: privilege, id: p-1 }
    status: expired
    messageKey: privilege.expired
    messageParams: { date: "2026-09-15" }
