rule: other.ninerlog.privilege-expiry.launch-method
name: valid-before-expiry
description: Before its expiry date the privilege is valid and the date is shown.
covers: [stage:valid, expiry:before]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: SPL }
  privileges:
    - { id: p-1, licenceId: l-1, kind: LAUNCH_METHOD_TRAINED, expires: 2027-03-31 }
expect:
  - subject: { kind: privilege, id: p-1 }
    status: current
    messageKey: privilege.valid
    messageParams: { date: "2027-03-31" }
