rule: faa.14cfr61.61-56.flight-review
name: current-91-days
description: A review on 10 November 2024 holds through 30 November 2026; on 31 August 2026 that is 91 days away, so the review is current.
covers: [stage:reviewed]
asOf: 2026-08-31
record:
  licences:
    - { id: l-faa, authority: FAA, type: PRIVATE }
  events:
    - { date: 2024-11-10, kind: flight_review, class: SEP_LAND }
expect:
  - subject: { kind: flight_review, id: l-faa }
    status: current
    messageKey: flight_review.current
    messageParams: { date: 2024-11-10 }
    validUntil: 2026-11-30
