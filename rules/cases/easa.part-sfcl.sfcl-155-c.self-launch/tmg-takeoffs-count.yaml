rule: easa.part-sfcl.sfcl-155-c.self-launch
name: tmg-takeoffs-count
description: >-
  Two self-launches in a sailplane and three take-offs in a TMG, one on the window's first
  day, make the five launches; winch launches do not count.
covers: [stage:current, requirement:launches:met, window:edge-in]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  ratings:
    - { id: r-gld, licenceId: l-spl, class: GLIDER }
  flights:
    - { date: 2024-09-15, class: TMG, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, launches: 1 }
    - { date: 2026-04-01, class: TMG, minutes: { total: 60, pic: 60 }, takeoffs: { day: 2 }, landings: { day: 2 }, launches: 2 }
    - { date: 2026-06-01, class: GLIDER, launchMethod: self-launch, minutes: { total: 240, pic: 240 }, launches: 2, landings: { day: 2 } }
    - { date: 2026-06-02, class: GLIDER, launchMethod: winch, minutes: { total: 10, pic: 10 }, launches: 5, landings: { day: 5 } }
expect:
  - subject: { kind: launch_method, id: r-gld, detail: self-launch }
    status: current
    messageKey: launch_method.current
    requirements:
      launches: { current: 5, met: true }
