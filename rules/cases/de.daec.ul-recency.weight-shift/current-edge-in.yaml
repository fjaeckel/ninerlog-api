rule: de.daec.ul-recency.weight-shift
name: current-edge-in
description: >-
  Twelve hours and 12 landings on trikes in 24 months under the DAeC rule; dual time counts
  toward the hours. The first flight is on the first day of the window.
covers: [stage:current, window:edge-in, requirement:total_time:met, requirement:landings:met]
asOf: 2026-09-15
record:
  licences:
    - { id: l-ul, authority: DAeC, type: UL }
  ratings:
    - { id: r-ws, licenceId: l-ul, class: ULTRALIGHT, ulKind: WEIGHT_SHIFT }
  flights:
    - { date: 2024-09-15, class: ULTRALIGHT, ulKind: WEIGHT_SHIFT, minutes: { total: 300, dual: 300 }, landings: { day: 4 } }
    - { date: 2026-06-01, class: ULTRALIGHT, ulKind: WEIGHT_SHIFT, minutes: { total: 420, pic: 420 }, landings: { day: 8 } }
expect:
  - subject: { kind: rating, id: r-ws, ulKind: WEIGHT_SHIFT }
    status: current
    messageKey: rating.recency_current
    validUntil: 2026-09-15
    requirements:
      total_time: { current: 720, met: true }
      landings: { current: 12, met: true }
