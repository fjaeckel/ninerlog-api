rule: easa.part-sfcl.sfcl-160-b.tmg
name: proficiency-check
description: A proficiency check in a TMG in the last 24 months keeps the TMG privileges current; a sailplane check does not.
covers: [stage:current, any_of:recency:proficiency_check, requirement:proficiency_check:met]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  ratings:
    - { id: r-tmg, licenceId: l-spl, class: TMG }
  flights:
    - { date: 2026-01-10, class: GLIDER, minutes: { total: 20, pic: 20 }, launches: 1, landings: { day: 1 }, flags: { proficiencyCheck: true } }
  events:
    - { date: 2025-11-20, kind: proficiency_check, class: TMG }
expect:
  - subject: { kind: rating, id: r-tmg }
    status: current
    messageKey: rating.recency_current
    validUntil: 2027-11-20
    requirements:
      proficiency_check: { current: 1, met: true, lastDate: 2025-11-20 }
