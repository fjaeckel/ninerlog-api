rule: easa.part-sfcl.sfcl-160-b.tmg
name: takeoffs-short
description: >-
  Twelve hours with 6 hours and 12 landings on TMGs and a training flight, but only 10
  take-offs: the article asks for 12 take-offs and 12 landings.
covers: [requirement:flight_time:met, requirement:proficiency_check:unmet, requirement:tmg_takeoffs_landings:unmet, requirement:tmg_time:met, requirement:tmg_training_flight:met, stage:lapsed]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  ratings:
    - { id: r-tmg, licenceId: l-spl, class: TMG }
  flights:
    - { date: 2026-02-01, class: TMG, minutes: { total: 60, dual: 60 }, takeoffs: { day: 2 }, landings: { day: 2 }, launches: 2 }
    - { date: 2026-03-01, class: TMG, minutes: { total: 300, pic: 300 }, takeoffs: { day: 8 }, landings: { day: 10 }, launches: 8 }
    - { date: 2026-06-01, class: GLIDER, launchMethod: winch, minutes: { total: 360, pic: 360 }, launches: 8, landings: { day: 8 } }
expect:
  - subject: { kind: rating, class: TMG, id: r-tmg }
    status: lapsed
    messageKey: rating.recency_not_met
    requirements:
      flight_time: { current: 720, met: true }
      tmg_time: { current: 360, met: true }
      tmg_takeoffs_landings: { current: 10, met: false }
      tmg_training_flight: { current: 60, met: true }
      proficiency_check: { current: 0, met: false }
