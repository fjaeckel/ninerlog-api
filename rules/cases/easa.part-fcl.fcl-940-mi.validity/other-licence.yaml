rule: easa.part-fcl.fcl-940-mi.validity
name: other-licence
description: "An FI certificate on another licence does not carry the MI."
covers: [stage:invalid]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: CPL(A) }
    - { id: l-2, authority: EASA, type: PPL(H) }
  privileges:
    - { id: p-mi, licenceId: l-1, kind: MI, expires: 2020-01-01 }
    - { id: p-fi, licenceId: l-2, kind: FI, expires: 2027-01-15 }
expect:
  - subject: { kind: privilege, id: p-mi }
    status: expired
