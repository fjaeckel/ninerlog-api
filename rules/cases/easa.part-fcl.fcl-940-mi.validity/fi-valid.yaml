rule: easa.part-fcl.fcl-940-mi.validity
name: fi-valid
description: "With a valid FI certificate on the licence the MI is valid; a date entered on the MI is not used."
covers: [stage:valid]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: CPL(A) }
  privileges:
    - { id: p-mi, licenceId: l-1, kind: MI, expires: 2020-01-01 }
    - { id: p-fi, licenceId: l-1, kind: FI, expires: 2027-01-15 }
expect:
  - subject: { kind: privilege, id: p-mi }
    status: current
    messageKey: privilege.valid
