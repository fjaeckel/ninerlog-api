rule: easa.part-fcl.fcl-940-mi.validity
name: cri-on-expiry-day
description: "A CRI certificate on its expiry date still carries the MI."
covers: [stage:valid]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: CPL(A) }
  privileges:
    - { id: p-mi, licenceId: l-1, kind: MI, expires: 2020-01-01 }
    - { id: p-cri, licenceId: l-1, kind: CRI, expires: 2026-09-15 }
expect:
  - subject: { kind: privilege, id: p-mi }
    status: current
