rule: easa.part-fcl.fcl-055.language-level-4
name: expired-day-after
description: "The day after its expiry date the endorsement is expired."
covers: [stage:expired, expiry:after]
asOf: 2027-04-16
record:
  credentials:
    - { id: c-lang, type: LANG_ICAO_LEVEL4, issued: 2023-04-15 }
expect:
  - subject: { kind: credential, id: c-lang }
    status: expired
    messageKey: credential.expired
    messageParams: { date: 2027-04-15 }
