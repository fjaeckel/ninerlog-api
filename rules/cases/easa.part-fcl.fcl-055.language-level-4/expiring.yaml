rule: easa.part-fcl.fcl-055.language-level-4
name: expiring
description: "90 days before expiry the endorsement shows as expiring."
covers: [stage:expiring]
asOf: 2027-01-15
record:
  credentials:
    - { id: c-lang, type: LANG_ICAO_LEVEL4, issued: 2023-04-15 }
expect:
  - subject: { kind: credential, id: c-lang }
    status: expiring
    messageKey: credential.expiring
    messageParams: { days: 90, date: 2027-04-15 }
