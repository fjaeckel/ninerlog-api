rule: faa.14cfr61.61-57-c.instrument
name: ipc-restores
description: An instrument proficiency check in June re-establishes currency through 31 December, although the rows show no tasks.
covers: [event:ipc, stage:current]
asOf: 2026-08-16
record:
  licences:
    - { id: l-faa, authority: FAA, type: PRIVATE }
  ratings:
    - { id: r-ir, licenceId: l-faa, class: IR }
  flights:
    - { date: 2024-03-01, class: SEP_LAND, minutes: { total: 90, pic: 90 }, approaches: 6, holds: 1, interceptAndTrack: true }
    - { date: 2026-06-10, class: SEP_LAND, minutes: { total: 90, dual: 90, simulatedInstrument: 80 }, interceptAndTrack: false, flags: { ipc: true } }
expect:
  - subject: { kind: rating, id: r-ir }
    status: current
    messageKey: rating.ir_current
    validUntil: 2026-12-31
    requirements:
      approaches: { current: 0, met: false }
