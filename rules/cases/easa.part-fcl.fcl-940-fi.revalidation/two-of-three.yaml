rule: easa.part-fcl.fcl-940-fi.revalidation
name: two-of-three
description: "50 hours of instruction and instructor refresher training within the validity period revalidate the certificate."
covers: [stage:met, n_of:revalidation:met, requirement:instruction:met, requirement:refresher:met, requirement:assessment:unmet, expiry:before]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: CPL(A) }
  privileges:
    - { id: p-1, licenceId: l-1, kind: FI, issued: 2024-01-15 }
  events:
    - { date: 2026-02-01, kind: instructor_refresher }
  flights:
    - { date: 2025-03-01, class: SEP_LAND, minutes: { total: 1500, dualGiven: 1500 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    - { date: 2026-03-01, class: SEP_LAND, minutes: { total: 1500, dualGiven: 1500 }, takeoffs: { day: 1 }, landings: { day: 1 } }
expect:
  - subject: { kind: privilege, id: p-1 }
    status: current
    messageKey: privilege.revalidation_current
    messageParams: { date: 2027-01-15 }
    expiresOn: 2027-01-15
    windowOpensAt: 2024-01-15
    requirements:
      instruction: { current: 3000, met: true }
      refresher: { current: 1, met: true }
      assessment: { current: 0, met: false }
