  flights:
    - { date: 2024-01-14, class: SEP_LAND, minutes: { total: 600, dualGiven: 600 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    - { date: 2024-01-15, class: SEP_LAND, minutes: { total: 600, dualGiven: 600 }, takeoffs: { day: 1 }, landings: { day: 1 } }
expect:
