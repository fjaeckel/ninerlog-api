rule: easa.part-sfcl.sfcl-460.fe-s
name: no-dates
description: Without an issue, validity or expiry date the certificate's validity cannot be determined.
covers: [stage:no_expiry]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  privileges:
    - { id: p-fes, licenceId: l-spl, kind: FE_S }
    - { id: p-fis, licenceId: l-spl, kind: FI_S }
expect:
  - subject: { kind: privilege, id: p-fes }
    status: unknown
    messageKey: privilege.no_expiry_date
