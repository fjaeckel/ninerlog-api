rule: easa.part-sfcl.sfcl-460.fe-s
name: expired
description: Five years and a day after its issue the certificate has expired; renewal is needed.
covers: [stage:expired, expiry:after]
asOf: 2026-09-15
record:
  licences:
    - { id: l-spl, authority: EASA, type: SPL }
  privileges:
    - { id: p-fes, licenceId: l-spl, kind: FE_S, validFrom: 2021-09-14, issued: 2021-08-01 }
expect:
  - subject: { kind: privilege, id: p-fes }
    status: expired
    messageKey: privilege.expired
    messageParams: { date: 2026-09-14 }
