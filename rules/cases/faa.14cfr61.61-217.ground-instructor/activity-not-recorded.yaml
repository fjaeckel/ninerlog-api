rule: faa.14cfr61.61-217.ground-instructor
name: activity-not-recorded
description: Instruction on 31 July 2025 is outside the 12 calendar months on 16 August 2026; nothing recorded shows recent activity, but ground instruction given is not recorded, so the status is unknown rather than lapsed.
covers: [stage:not_logged, requirement:ground_instruction:untracked, requirement:flight_instruction:unmet, window:edge-out]
asOf: 2026-08-16
record:
  licences:
    - { id: l-faa, authority: FAA, type: COMMERCIAL }
    - { id: l-easa, authority: EASA, type: PPL(A) }
  privileges:
    - { id: p-gi, licenceId: l-faa, kind: GROUND_INSTRUCTOR }
    - { id: p-easa, licenceId: l-easa, kind: GROUND_INSTRUCTOR }
  flights:
    - { date: 2025-07-31, class: SEP_LAND, minutes: { total: 90, pic: 90, dualGiven: 90 } }
expect:
  - subject: { kind: privilege, id: p-gi }
    status: unknown
    messageKey: privilege.recency_not_logged
    requirements:
      flight_instruction: { current: 0, met: false }
      ground_instruction: { tracked: false, met: false, messageKey: requirement.untracked }
