rule: easa.part-fcl.fcl-740-h.helicopter
name: no-expiry-date
description: "Without an expiry date the windows cannot be placed."
covers: [stage:no_expiry]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: PPL(H) }
  ratings:
    - { id: r-type, licenceId: l-1, class: HELICOPTER, typeDesignator: R44 }
  flights:
    - { date: 2026-08-20, class: HELICOPTER, typeDesignator: R44, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
expect:
  - subject: { kind: rating, id: r-type, class: HELICOPTER }
    status: unknown
    messageKey: rating.no_expiry_date
