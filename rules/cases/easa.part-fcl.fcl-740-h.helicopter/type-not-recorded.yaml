rule: easa.part-fcl.fcl-740-h.helicopter
name: type-not-recorded
description: "Without a type designator on the rating no flight can be matched to the type; the result is unknown."
covers: [unknown:typeDesignators, stage:type_unknown]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: PPL(H) }
  ratings:
    - { id: r-type, licenceId: l-1, class: HELICOPTER, expires: 2026-10-31 }
  flights:
    - { date: 2026-03-10, class: HELICOPTER, minutes: { total: 120, pic: 120 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    - { date: 2026-08-20, class: HELICOPTER, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
expect:
  - subject: { kind: rating, id: r-type, class: HELICOPTER }
    status: unknown
    messageKey: rating.type_not_identifiable
