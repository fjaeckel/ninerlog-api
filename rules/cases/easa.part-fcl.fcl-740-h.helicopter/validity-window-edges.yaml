rule: easa.part-fcl.fcl-740-h.helicopter
name: validity-window-edges
description: "Flying on 31 October 2025, 12 months before expiry, counts; flying on 30 October 2025 does not."
covers: [window:before_expiry_months=12:edge-in, window:before_expiry_months=12:edge-out]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: PPL(H) }
  ratings:
    - { id: r-type, licenceId: l-1, class: HELICOPTER, typeDesignator: R44, expires: 2026-10-31 }
  flights:
    - { date: 2025-10-30, class: HELICOPTER, typeDesignator: R44, engines: 1, mtomKg: 1134, minutes: { total: 600, pic: 600 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    - { date: 2025-10-31, class: HELICOPTER, typeDesignator: R44, engines: 1, mtomKg: 1134, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    - { date: 2026-08-20, class: HELICOPTER, typeDesignator: R44, engines: 1, mtomKg: 1134, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
expect:
  - subject: { kind: rating, id: r-type, class: HELICOPTER }
    status: expiring
    messageKey: rating.revalidation_expiring_met
    requirements:
      type_time: { current: 120, met: true }
