rule: easa.part-fcl.fcl-740-h.helicopter
name: met-expiring
description: "The proficiency check in the 3 months before expiry and the flying on the type within the validity period revalidate the rating."
covers: [stage:met_expiring, requirement:proficiency_check:met, requirement:type_time:met, expiry:before]
asOf: 2026-09-15
record:
  licences:
    - { id: l-1, authority: EASA, type: PPL(H) }
  ratings:
    - { id: r-type, licenceId: l-1, class: HELICOPTER, typeDesignator: R44, expires: 2026-10-31 }
  flights:
    - { date: 2026-03-10, class: HELICOPTER, typeDesignator: R44, engines: 1, mtomKg: 1134, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    - { date: 2026-08-20, class: HELICOPTER, typeDesignator: R44, engines: 1, mtomKg: 1134, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
expect:
  - subject: { kind: rating, id: r-type, class: HELICOPTER }
    status: expiring
    messageKey: rating.revalidation_expiring_met
    messageParams: { days: 46 }
    windowOpensAt: 2025-10-31
    requirements:
      proficiency_check: { current: 1, met: true, lastDate: 2026-08-20 }
      type_time: { current: 120, required: 120, met: true }
