rule: faa.14cfr61.61-57-a.passengers
name: sole-manipulator-not-logged
description: Enough takeoffs and landings, but no flight records whether the pilot was sole manipulator of the controls; passenger recency is unknown, not current.
covers: [unknown:soleManipulator, stage:not_logged]
asOf: 2026-08-16
record:
  licences:
    - { id: l-faa, authority: FAA, type: PRIVATE }
  ratings:
    - { id: r-sep, licenceId: l-faa, class: SEP_LAND }
  flights:
    - { date: 2026-07-10, class: SEP_LAND, minutes: { total: 90, pic: 90 }, takeoffs: { day: 5 }, landings: { day: 5 } }
expect:
  - subject: { kind: passengers, id: l-faa, class: SEP_LAND }
    status: unknown
    messageKey: pax.experience_not_logged
    requirements:
      takeoffs_landings: { current: 0, met: false, tracked: false }
