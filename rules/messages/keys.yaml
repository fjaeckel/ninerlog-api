# Every message, requirement-name, remedy and rule-description key (DESIGN.md section 4).
# Mirrors ninerlog-api docs/CURRENCY_MESSAGES.md. Fields:
#   kind       message | requirement_name | requirement_message | remedy | rule_description |
#              readiness | training_title | training_item | training_message
#   params     messageParams / remedyParams names; a trailing ? marks an optional param
#   origin     api (the API emits or emitted it) | catalogue (added by this module)
#   emitted    the API emits it today
#   documented listed in docs/CURRENCY_MESSAGES.md
#   deprecated no longer emitted; rules must not use it
# Porting agents append new keys only under the anchor for their family at the end.
keys:

