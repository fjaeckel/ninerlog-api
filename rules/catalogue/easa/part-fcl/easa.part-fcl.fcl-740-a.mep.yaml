id: easa.part-fcl.fcl-740-a.mep
title: Multi-engine class rating revalidation (MEP)
authority: easa
instrument: Part-FCL
article: FCL.740.A(a)(1), (a)(2)
support: partial
source_kind: regulation
effective_from: null
effective_to: null
source:
  cite: EASA FCL.740.A(a)
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02011R1178-20260430
  file: sources/easa/fcl-740-a.md
  quote:
    - "(a) Revalidation of multi-engine class ratings and type ratings. For revalidation of multi-engine class ratings and type ratings, the applicant shall:"
    - "(1) pass a proficiency check in accordance with Appendix 9 or complete EBT practical assessment in accordance with Appendix 10 in the relevant class or type of aeroplane or an FSTD representing that class or type, within the 3 months immediately preceding the expiry date of the rating; and"
    - "(2) complete during the period of validity of the rating, at least:"
    - "(i) 10 route sectors as pilot of the relevant class or type of aeroplane; or"
    - "(ii) 1 route sector as pilot of the relevant class or type of aeroplane or FFS, flown with an examiner. This route sector may be flown during the proficiency check."
related_sources:
  - cite: EASA FCL.010
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02011R1178-20260430
    file: sources/easa/fcl-010.md
    quote: "‘Route sector’ means a flight comprising take-off, departure, cruise of not less than 15 minutes, arrival, approach and landing phases."
  - cite: EASA FCL.740(a)(1)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02011R1178-20260430
    file: sources/easa/fcl-740.md
    quote: "The validity period of class and type ratings shall be 1 year, except for single-pilot single-engine class ratings for which the validity period shall be 2 years, unless otherwise determined in the OSD."
citations: [EASA FCL.740.A(a)(1), EASA FCL.740.A(a)(2), EASA FCL.010]

applies_to:
  subject: rating
  classes: [MEP_LAND, MEP_SEA]
  authorities: [EASA, LBA]
  excludeLicenceKinds: [LAPL_A, SPL, LAPL_S]

window: { before_expiry_months: 12 }

requirements:
  all_of:
    - id: proficiency_check
      metric: events
      window: { before_expiry_months: 3 }
      filter:
        eventKinds: [proficiency_check, ebt_assessment]
        classes: [$subject]
        simulator: include
      min: 1
      unit: check
      nameKey: requirement.proficiency_check
      remedyKey: remedy.proficiency_check
    - id: route_sectors
      any_of:
        - id: sectors
          metric: route_sectors
          filter: { classes: [$subject] }
          min: 10
          unit: sectors
          nameKey: requirement.route_sectors
          remedyKey: remedy.fly_more
        - id: examiner_sector
          metric: route_sectors
          filter:
            classes: [$subject]
            flags: { examinerOnBoard: true }
            simulator: include
            fstdTypes: [FFS]
          min: 1
          unit: sectors
          nameKey: requirement.examiner_route_sector

stages:
  - { id: no_expiry, when: no_expiry, status: unknown, messageKey: rating.no_expiry_date }
  - { id: expired, when: expired, status: expired, messageKey: rating.expired }
  - { id: window_not_open, when: before_window, status: current, messageKey: rating.window_not_open, params: { date: window_opens_at } }
  - id: met_expiring
    when: { all: [all_met, { expires_within: { days: 90 } }] }
    status: expiring
    messageKey: rating.revalidation_expiring_met
    params: { days: days_to_expiry }
  - { id: met, when: all_met, status: current, messageKey: rating.revalidation_current }
  - { id: sectors_not_logged, when: undetermined, status: unknown, messageKey: rating.route_sectors_not_logged }
  - { id: not_met, when: always, status: expiring, messageKey: rating.revalidation_not_met_prof_check }

ruleDescriptionKey: easa_mep_set

divergences:
  - id: proficiency-check-required
    api: Revalidates with either a proficiency check or 10 route sectors plus 1 hour of refresher training.
    article: A proficiency check (or EBT practical assessment) in the 3 months before expiry is always required, and in addition 10 route sectors or 1 route sector with an examiner.
    cite: EASA FCL.740.A(a)(1), (a)(2)
  - id: no-refresher
    api: Requires 1 hour of refresher training (dual time) on the route-sector path.
    article: Multi-engine class ratings have no refresher training requirement.
    cite: EASA FCL.740.A(a)
  - id: check-window
    api: Accepts a proficiency check anywhere in the 12 months before expiry.
    article: The proficiency check counts only within the 3 months immediately preceding the expiry date.
    cite: EASA FCL.740.A(a)(1)
  - id: check-in-fstd
    api: Ignores proficiency checks flown in a simulator.
    article: The proficiency check may be taken in an FSTD representing the class.
    cite: EASA FCL.740.A(a)(1)
  - id: route-sector-definition
    api: Counts every flight in the class as a route sector.
    article: A route sector needs a cruise of at least 15 minutes (FCL.010); flights without a recorded cruise time are unknown.
    cite: EASA FCL.010
  - id: examiner-sector
    api: Has no examiner alternative to the 10 route sectors.
    article: 1 route sector flown with an examiner, in the aeroplane or an FFS, replaces the 10 route sectors.
    cite: EASA FCL.740.A(a)(2)(ii)
  - id: set-separate
    api: Evaluates MEP and SET class ratings with one rule.
    article: SET class ratings are single-engine class ratings revalidated by a proficiency check only (FCL.740.A(b)(3)); see easa.part-fcl.fcl-740-a.set.
    cite: EASA FCL.740.A(b)(3)
  - id: valid-through-expiry
    api: Reports the rating expired on its expiry date.
    article: The rating is valid through its expiry date and expired from the next day (catalogue decision 2).
    cite: EASA FCL.740.A(a)
  - id: towed-launches
    api: Excludes flights with a winch, aerotow, car or bungee launch from the class count.
    article: Every route sector in the relevant class counts; no launch method is excluded.
    cite: EASA FCL.740.A(a)(2)(i)
  - id: authorities
    api: Also evaluates MEP ratings recorded on DULV or DAeC licences.
    article: FCL.740.A applies to Part-FCL class ratings, issued by EASA member-state authorities such as the LBA.
    cite: EASA FCL.740.A(a)

notes: >-
  Partial: multi-engine type ratings (recorded with class OTHER) are not evaluated here; the
  (a)(3) exemption for pilots of a commercial air transport operator is not modelled. The
  period of validity of a multi-engine class rating is 1 year (FCL.740(a)(1)), so the route
  sectors are counted in the 12 months before the recorded expiry date. A route sector is a
  flight with a recorded cruise of at least 15 minutes (FCL.010); a flight without a cruise
  time is unknown, never counted. Route sectors count in any pilot role. The examiner
  route sector may be the proficiency check flight itself (flag examinerOnBoard); in an FSTD
  only an FFS counts. The proficiency check may be taken in any FSTD representing the class
  ((a)(1) says FSTD, not FFS). An early proficiency check (FCL.740(a)(1): the new validity
  period then starts on the check date) is not credited against the recorded expiry; enter
  the new expiry date instead. The 90-day expiring threshold and the window_not_open stage
  are NinerLog presentation, not the article.
