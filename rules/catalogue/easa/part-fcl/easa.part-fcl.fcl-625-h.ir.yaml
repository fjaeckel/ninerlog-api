id: easa.part-fcl.fcl-625-h.ir
title: Instrument rating revalidation, helicopters (IR(H))
authority: easa
instrument: Part-FCL
article: FCL.625(b)(1); FCL.625.H(a), (b)
support: partial
source_kind: regulation
effective_from: null
effective_to: null
source:
  cite: EASA FCL.625.H
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02011R1178-20260430
  file: sources/easa/fcl-625-h.md
  quote:
    - "(a) To revalidate an IR(H), applicants shall:"
    - "(2) pass a proficiency check in accordance with Appendix 9 to this Annex for the relevant type of helicopter if the IR revalidation is combined with the revalidation of a type rating;"
    - "(3) if the IR revalidation is not combined with the revalidation of a type rating, complete Section 5 and the relevant parts of Section 1 of the proficiency check in accordance with Appendix 9 to this Annex for the relevant type of helicopter."
    - "(b) An FTD 2/3 or an FFS representing the relevant type of helicopter may be used for the proficiency check pursuant to point (a)(3), provided that at least each alternate proficiency check for the revalidation of an IR(H) is performed in a helicopter."
related_sources:
  - cite: EASA FCL.625(a), (b)(1)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02011R1178-20260430
    file: sources/easa/fcl-625.md
    quote:
      - "An IR shall be valid for 1 year."
      - "(1) An IR shall be revalidated within the 3 months immediately preceding its expiry date by complying with the revalidation criteria for the relevant aircraft category."
  - cite: EASA FCL.625(b)(4)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02011R1178-20260430
    file: sources/easa/fcl-625.md
    quote: "(4) Applicants for the revalidation of an IR shall receive full credits for the proficiency check as required in this Subpart when they complete EBT practical assessment in accordance with Appendix 10 related to the IR at an EBT operator."
citations: [EASA FCL.625(b)(1), EASA FCL.625.H(a), EASA FCL.625.H(b)]

applies_to:
  subject: rating
  classes: [IR]
  authorities: [EASA, LBA]
  licenceKinds: [HELICOPTER]

window: { before_expiry_months: 3 }

requirements:
  id: proficiency_check
  metric: events
  filter:
    eventKinds: [proficiency_check, ebt_assessment]
    eventRatings: [IR]
    categories: [helicopter]
    simulator: include
  min: 1
  unit: check
  nameKey: requirement.proficiency_check
  remedyKey: remedy.proficiency_check

stages:
  - { id: no_expiry, when: no_expiry, status: unknown, messageKey: rating.no_expiry_date }
  - { id: expired, when: expired, status: expired, messageKey: rating.expired }
  - { id: window_not_open, when: before_window, status: current, messageKey: rating.window_not_open, params: { date: window_opens_at } }
  - id: met_expiring
    when: { all: [all_met, { expires_within: { days: 90 } }] }
    status: expiring
    messageKey: rating.revalidation_expiring_met
    params: { days: days_to_expiry }
  - { id: met, when: all_met, status: current, messageKey: rating.revalidation_current }
  - { id: not_met, when: always, status: expiring, messageKey: rating.ir_check_not_met }

ruleDescriptionKey: easa_ir

divergences:
  - id: no-ifr-hours
    api: Requires 10 hours of IFR flight time in the 12 months before expiry as well as a proficiency check.
    article: FCL.625 and FCL.625.H revalidate an IR(H) by a proficiency check only; no IFR hours are required.
    cite: EASA FCL.625.H(a)
  - id: ir-check-only
    api: Accepts any logged proficiency check, in any class, as the IR check.
    article: Only a proficiency check for the IR in a helicopter (combined with the type rating check, or Section 5 and the relevant parts of Section 1) revalidates the IR(H).
    cite: EASA FCL.625.H(a)(2), (a)(3)
  - id: check-window
    api: Accepts a proficiency check anywhere in the 12 months before expiry.
    article: The IR is revalidated within the 3 months immediately preceding its expiry date.
    cite: EASA FCL.625(b)(1)
  - id: fstd
    api: Ignores proficiency checks flown in a simulator.
    article: An FTD 2/3 or an FFS representing the type may be used for the check.
    cite: EASA FCL.625.H(b)
  - id: valid-through-expiry
    api: Reports the rating expired on its expiry date.
    article: The IR is valid through its expiry date and expired from the next day (catalogue decision 2).
    cite: EASA FCL.625(a)
  - id: authorities
    api: Also evaluates IR ratings recorded on DULV or DAeC licences.
    article: FCL.625 applies to IRs on Part-FCL licences, issued by EASA member-state authorities such as the LBA.
    cite: EASA FCL.625(a)

notes: >-
  Partial. An IR on a helicopter licence (PPL(H), CPL(H), ATPL(H), LAPL(H)) is read as an
  IR(H). The check must be recorded as an IR check (event rating IR, or checkRating IR on a
  flight flagged as a proficiency check) in a helicopter or an FSTD whose flight is recorded
  with the helicopter class; the FSTD level (FTD 2/3 or FFS), the type, the
  every-alternate-check-in-a-helicopter condition ((b)) and holding the type rating ((a)(1))
  are not checked. Cross-credit under Appendix 8 ((c)) is not modelled. Renewal
  (FCL.625(c)) and the 7-year rule (FCL.625(d)) are not modelled. The 90-day expiring
  threshold and the window_not_open stage are NinerLog presentation, not the article.
