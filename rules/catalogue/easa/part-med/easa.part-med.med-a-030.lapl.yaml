id: easa.part-med.med-a-030.lapl
title: LAPL medical for LAPL, SPL and BPL
authority: easa
instrument: Part-MED
article: MED.A.030(c)(1)
support: partial
source_kind: regulation
effective_from: null
effective_to: null
source:
  cite: EASA MED.A.030(c)(1)
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02011R1178-20260430
  file: sources/easa/med-a-030.md
  quote:
    - "(c) When exercising the privileges of a:"
    - "(1) light aircraft pilot licence (LAPL), a balloon pilot licence (BPL) issued in accordance with Annex III (Part-BFCL) to Commission Regulation (EU) 2018/395, or a sailplane pilot licence (SPL) issued in accordance with Annex III (Part-SFCL) to Commission Implementing Regulation (EU) 2018/1976, the pilot shall hold at least a valid LAPL medical certificate;"

applies_to:
  subject: licence
  licenceKinds: [LAPL_A, LAPL_H, SPL, LAPL_S, BPL]
  authorities: [EASA, LBA]

stages:
  - { id: valid_medical, when: { holds: { credentials: [EASA_CLASS1_MEDICAL, EASA_CLASS2_MEDICAL, EASA_LAPL_MEDICAL], valid: true } }, status: current, messageKey: licence.valid }
  - { id: no_valid_medical, when: { holds: { credentials: [EASA_CLASS1_MEDICAL, EASA_CLASS2_MEDICAL, EASA_LAPL_MEDICAL] } }, status: expired, messageKey: licence.medical_required }
  - { id: no_medical_recorded, when: always, status: unknown, messageKey: licence.medical_not_recorded }

notes: >-
  Partial. A certificate of the required class or a higher one counts when it is not
  expired on the date evaluated; its validity is the entered expiry date (a certificate
  without one is taken as valid). The derived validity of MED.A.045 is evaluated by the
  easa.part-med.med-a-045 rules, not here. When no EASA medical certificate is recorded at
  all the result is unknown rather than expired, because many pilots do not record their
  medical. The class 2 requirement for commercial sailplane and balloon operations ((c)(3), (c)(4)) is not applied, because the record does not say whether the flying is commercial. A LAPL(H) (licence kind LAPL_H) needs a LAPL medical like the other LAPLs; PPL(H), CPL(H) and ATPL(H) share the licence kind HELICOPTER and are not evaluated, because the class they need differs (class 2 for PPL(H), class 1 for CPL(H) and ATPL(H)). Class 1 and class 2 certificates include the LAPL privileges (AMC1 MED.A.030). The API does not evaluate which medical class a licence needs today.
