id: easa.part-med.med-a-045.lapl
title: LAPL medical certificate validity
authority: easa
instrument: Part-MED
article: MED.A.045(a)(4)
support: supported
source_kind: regulation
effective_from: null
effective_to: null
source:
  cite: EASA MED.A.045(a)
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02011R1178-20260430
  file: sources/easa/med-a-045.md
  quote:
    - "(4) LAPL medical certificates shall be valid for a period of:"
    - "(i) 60 months, until the licence holder reaches the age of 40. A medical certificate issued prior to the licence holder reaching the age of 40 shall cease to be valid after the licence holder reaches the age of 42;"
    - "(ii) 24 months, for licence holders aged above 40."
related_sources:
  - cite: EASA MED.A.045(a)(5), (b)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02011R1178-20260430
    file: sources/easa/med-a-045.md
    quote:
      - "(5) The validity period of a medical certificate, including any associated examination or special investigation, shall be calculated from the date of the aero-medical examination in the case of initial issue and renewal, and from the expiry date of the previous medical certificate in the case of revalidation."
      - "Aero-medical examinations and assessments, as applicable, for the revalidation of a medical certificate may be undertaken up to 45 days prior to the expiry date of the medical certificate."
citations: [EASA MED.A.045(a)(4)]

applies_to:
  subject: credential
  credentialTypes: [EASA_LAPL_MEDICAL]

validity:
  from: valid_from
  periods:
    - { when: { age_under: 40 }, months: 60, cap_at_age: 42 }
    - { months: 24 }

stages:
  - { id: date_of_birth_missing, when: { all: [{ missing: date_of_birth }, no_expiry] }, status: unknown, messageKey: credential.date_of_birth_required }
  - { id: no_expiry, when: no_expiry, status: unknown, messageKey: credential.no_expiry_date }
  - { id: expired, when: expired, status: expired, messageKey: credential.expired, params: { date: expiry_date } }
  - { id: revalidation_window, when: { expires_within: { days: 45 } }, status: expiring, messageKey: credential.revalidation_window_open, params: { days: days_to_expiry, date: expiry_date } }
  - { id: valid, when: always, status: current, messageKey: credential.valid, params: { date: expiry_date } }

divergences:
  - id: derived-validity
    api: Uses only the expiry date the pilot entered.
    article: The validity period follows from the certificate class and the holder's age; when the derived date is earlier than the entered one, the derived date applies.
    cite: EASA MED.A.045(a)
  - id: valid-through-expiry
    api: Reports the medical expired on its expiry date.
    article: The certificate is valid through its expiry date and expired from the next day (catalogue decision 2).
    cite: EASA MED.A.045(a)

notes: >-
  "Aged above 40" is read as 40 or more, so that (i) and (ii) leave no gap. A certificate issued before 40 ends on the 42nd birthday at the latest.
  The period runs from validFrom (the previous expiry date, for a revalidation) or else the
  issue date (the examination date, for initial issue and renewal), MED.A.045(a)(5); the age
  is taken on that date. The effective expiry is the earlier of the derived and the entered
  date. Without a date of birth the derived date is unknown and only an entered expiry date
  is used. The 45-day stage reflects MED.A.045(b): the revalidation examination may be taken
  now. Renewal after expiry (MED.A.045(c)) is not modelled.
