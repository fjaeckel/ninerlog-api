id: easa.part-med.med-a-030.class-2
title: Class 2 medical for PPL and GPL
authority: easa
instrument: Part-MED
article: MED.A.030(c)(2)
support: partial
source_kind: regulation
effective_from: null
effective_to: null
source:
  cite: EASA MED.A.030(c)(2)
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02011R1178-20260430
  file: sources/easa/med-a-030.md
  quote:
    - "(c) When exercising the privileges of a:"
    - "(2) private pilot licence (PPL) or gyroplane pilot licence (GPL), the pilot shall hold at least a valid class 2 medical certificate;"

applies_to:
  subject: licence
  licenceKinds: [PPL_A, GPL]
  authorities: [EASA, LBA]

stages:
  - { id: valid_medical, when: { holds: { credentials: [EASA_CLASS1_MEDICAL, EASA_CLASS2_MEDICAL], valid: true } }, status: current, messageKey: licence.valid }
  - { id: no_valid_medical, when: { holds: { credentials: [EASA_CLASS1_MEDICAL, EASA_CLASS2_MEDICAL, EASA_LAPL_MEDICAL] } }, status: expired, messageKey: licence.medical_required }
  - { id: no_medical_recorded, when: always, status: unknown, messageKey: licence.medical_not_recorded }

notes: >-
  Partial. A certificate of the required class or a higher one counts when it is not
  expired on the date evaluated; its validity is the entered expiry date (a certificate
  without one is taken as valid). The derived validity of MED.A.045 is evaluated by the
  easa.part-med.med-a-045 rules, not here. When no EASA medical certificate is recorded at
  all the result is unknown rather than expired, because many pilots do not record their
  medical. A PPL(H) is not evaluated: the helicopter licence kind does not distinguish PPL(H), CPL(H), ATPL(H) and LAPL(H). A class 1 certificate includes the class 2 privileges (AMC1 MED.A.030). The API does not evaluate which medical class a licence needs today.
