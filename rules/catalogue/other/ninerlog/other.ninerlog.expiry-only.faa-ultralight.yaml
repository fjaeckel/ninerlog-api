id: other.ninerlog.expiry-only.faa-ultralight
title: Rating expiry only (ultralight ratings on FAA certificates)
authority: other
instrument: NinerLog
article: none (app policy)
support: supported
source_kind: app_policy
effective_from: null
effective_to: null
source:
  cite: "NinerLog app policy: ultralight ratings recorded on FAA certificates are tracked by their recorded expiry date"

applies_to:
  subject: rating
  classes: [ULTRALIGHT]
  authorities: [FAA]

stages:
  - { id: no_expiry, when: no_expiry, status: unknown, messageKey: rating.no_expiry_date_manual }
  - { id: expired, when: expired, status: expired, messageKey: rating.expired }
  - { id: expiring, when: { expires_within: { days: 90 } }, status: expiring, messageKey: rating.expiring, params: { days: days_to_expiry } }
  - { id: valid, when: always, status: current, messageKey: rating.valid_until }

divergences:
  - id: valid-through-expiry
    api: Reports the rating expired on its expiry date.
    article: A rating is valid through its expiry date and expired from the next day (catalogue decision 2).
    cite: DESIGN.md section 11, decision 2

notes: >-
  An ULTRALIGHT rating recorded on an FAA certificate is tracked by its recorded expiry date
  only, as in the API (faa.go faaSelectRule). 14 CFR Part 61 has no ultralight rating (Part
  103 vehicles need no pilot certificate), so no FAA rule applies. The API sends no
  ruleDescriptionKey; neither does the catalogue.
  App policy, not a regulation: source_kind app_policy (no source file, no quote). The
  evaluation cites the policy.
