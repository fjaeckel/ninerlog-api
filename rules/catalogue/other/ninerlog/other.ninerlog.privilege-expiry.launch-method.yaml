id: other.ninerlog.privilege-expiry.launch-method
title: Launch-method privilege, expiry only
authority: other
instrument: NinerLog
article: none (app policy)
support: supported
source_kind: app_policy
effective_from: null
effective_to: null
source:
  cite: "NinerLog app policy: a launch-method training privilege on a licence outside Part-SFCL is valid through its recorded expiry date"

applies_to:
  subject: privilege
  privilegeKinds: [LAUNCH_METHOD_TRAINED]
  authorities: [FAA, DULV, DAEC]

stages:
  - { id: expired, when: expired, status: expired, messageKey: privilege.expired, params: { date: expiry_date } }
  - { id: valid, when: always, status: current, messageKey: privilege.valid, params: { date: expiry_date } }

ruleDescriptionKey: sfcl_155_launch_method

notes: >-
  The LAUNCH_METHOD_TRAINED privilege records that the pilot was trained in a launch method.
  On EASA, LBA and other licences it is the SFCL.155(a) training record, evaluated by
  easa.part-sfcl.sfcl-155-a.launch-method-trained (which excludes FAA, DULV and DAeC like the
  other Part-SFCL rules); this fallback covers it on FAA, DULV and DAeC licences, so each
  privilege is evaluated by exactly one rule. As a privilege it is
  valid through its recorded expiry date, or indefinitely, with the rule
  description sfcl_155_launch_method as in the API. The launch-method recency itself
  (SFCL.155) is evaluated per launch method by the Part-SFCL family, not here.
  App policy, not a regulation: source_kind app_policy (no source file, no quote). The
  evaluation cites the policy.
