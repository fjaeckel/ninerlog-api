id: other.ninerlog.privilege-expiry.launch-method
title: Launch-method privilege, expiry only
authority: other
instrument: NinerLog
article: none (app policy)
support: supported
source_kind: national_law
effective_from: null
effective_to: null
source:
  cite: LuftPersV § 9(1) (closest fit; NinerLog app policy with no regulation source)
  url: https://www.gesetze-im-internet.de/luftpersv/__9.html
  file: sources/de/luftpersv-9.md
  quote: "Die Gültigkeitsdauer von Berechtigungen und Erweiterungen der Erlaubnis richtet sich nach den Vorschriften, die für die Erteilung der Berechtigung maßgeblich sind."

applies_to:
  subject: privilege
  privilegeKinds: [LAUNCH_METHOD_TRAINED]

stages:
  - { id: expired, when: expired, status: expired, messageKey: privilege.expired, params: { date: expiry_date } }
  - { id: valid, when: always, status: current, messageKey: privilege.valid, params: { date: expiry_date } }

ruleDescriptionKey: sfcl_155_launch_method

notes: >-
  The LAUNCH_METHOD_TRAINED privilege records that the pilot was trained in a launch method;
  as a privilege it is valid through its recorded expiry date, or indefinitely, with the rule
  description sfcl_155_launch_method as in the API. The launch-method recency itself
  (SFCL.155) is evaluated per launch method by the Part-SFCL family, not here.
  App policy, not a regulation. The schema requires a source and a source_kind, and the
  vocabulary has no kind for NinerLog policy; the closest fit is LuftPersV § 9(1), which says
  a rating's validity follows the provisions under which it was issued, so the date the
  issuing authority wrote on it is what the app can rely on (vocabulary request filed:
  docs/vocab-requests/de-other.md).
