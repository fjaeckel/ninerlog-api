id: other.ninerlog.privilege-expiry
title: Privilege expiry only
authority: other
instrument: NinerLog
article: none (app policy)
support: supported
source_kind: app_policy
effective_from: null
effective_to: null
source:
  cite: "NinerLog app policy: privileges without a recency rule are valid through their recorded expiry date"
related_sources:
  - cite: LuftPersV § 84a(5)
    url: https://www.gesetze-im-internet.de/luftpersv/__84a.html
    file: sources/de/luftpersv-84a.md
    quote: "Die Gültigkeit richtet sich nach der Gültigkeit des Luftfahrerscheins für Luftsportgeräteführer, soweit nicht der Beauftragte nach § 31c des Luftverkehrsgesetzes entsprechend § 42 Abs. 2 die Gültigkeitsdauer beschränkt und Voraussetzungen für die Verlängerung festlegt."

applies_to:
  subject: privilege
  privilegeKinds: [AEROBATIC_BASIC, AEROBATIC_ADVANCED, TMG_NIGHT, BI_S, UL_PASSENGER_AUTH, UL_TYPE_BRIEFING]

stages:
  - { id: expired, when: expired, status: expired, messageKey: privilege.expired, params: { date: expiry_date } }
  - { id: valid, when: always, status: current, messageKey: privilege.valid, params: { date: expiry_date } }

ruleDescriptionKey: privilege_expiry

notes: >-
  Privileges the API records without a recency rule are valid through their recorded expiry
  date, or indefinitely when none is recorded (privilege.valid without a date). For the
  ultralight passenger authorisation this matches § 84a(5): its validity follows the
  licence, which has no expiry, unless the Beauftragte limits it. The privilege kinds are
  the API's (privileges.go privilegeRuleFor returns no rule for them); when another family
  adds a rule for one of them (e.g. an examiner or instructor certificate), that kind should
  leave this list so it is not evaluated twice (the overlap check enforces it). FE_S left the
  list when easa.part-sfcl.sfcl-460.fe-s was written; an FE(S) certificate is a Part-SFCL
  examiner certificate, so on FAA, DULV and DAeC licences, which that rule excludes, it is
  not evaluated. LAUNCH_METHOD_TRAINED has its own rule
  description and lives in other.ninerlog.privilege-expiry.launch-method.
  App policy, not a regulation: source_kind app_policy (no source file, no quote). The
  evaluation cites the policy.
