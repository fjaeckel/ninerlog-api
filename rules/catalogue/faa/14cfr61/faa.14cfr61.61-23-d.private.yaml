id: faa.14cfr61.61-23-d.private
title: Medical duration for private, recreational, student, sport and instructor privileges
authority: faa
instrument: 14 CFR Part 61
article: 61.23(d)(1)(iv)-(v), (d)(2)(ii)-(iii), (d)(3)
support: partial
source_kind: regulation
effective_from: null
effective_to: null
source:
  cite: 14 CFR 61.23(d)
  url: https://www.ecfr.gov/current/title-14/part-61/section-61.23
  file: sources/faa/61.23.md
  quote:
    - "(d) Duration of a medical certificate. Use the following table to determine duration for each class of medical certificate:"
    - "Then your medical certificate expires, for that operation, at the end of the last day of the"
    - "(3) A third-class medical certificate"
    - "(i) Under age 40"
    - "a recreational pilot certificate, a private pilot certificate, a flight instructor certificate (when acting as pilot in command or a required pilot flight crewmember in operations other than glider or balloon), a student pilot certificate, or a sport pilot certificate (when not using a U.S. driver's license as medical qualification)"
    - "60th month after the month of the date of examination shown on the medical certificate."
    - "(ii) Age 40 or older"
    - "24th month after the month of the date of examination shown on the medical certificate."
related_sources:
  - cite: 14 CFR 61.23(a)(3)(i)
    url: https://www.ecfr.gov/current/title-14/part-61/section-61.23
    file: sources/faa/61.23.md
    quote: "(i) When exercising the privileges of a private pilot certificate, recreational pilot certificate, or student pilot certificate, except when operating under the conditions and limitations set forth in § 61.113(i);"
citations: [14 CFR 61.23(d)(1)(iv), 14 CFR 61.23(d)(1)(v), 14 CFR 61.23(d)(2)(ii), 14 CFR 61.23(d)(2)(iii), 14 CFR 61.23(d)(3)]

group: faa_medical_duration

applies_to:
  subject: credential
  credentialTypes: [FAA_CLASS1_MEDICAL, FAA_CLASS2_MEDICAL, FAA_CLASS3_MEDICAL]
  holds: { licenceKinds: [FAA_STUDENT, FAA_SPORT, FAA_RECREATIONAL, FAA_PRIVATE, FAA_COMMERCIAL, FAA_ATP] }

validity:
  from: issued
  periods:
    - { when: { age_under: 40 }, months: 60, end_of_month: true }
    - { when: { age_at_least: 40 }, months: 24, end_of_month: true }

stages:
  - { id: date_of_birth, when: { missing: date_of_birth }, status: unknown, messageKey: credential.date_of_birth_required }
  - { id: no_exam_date, when: no_expiry, status: unknown, messageKey: credential.no_expiry_date }
  - { id: expired, when: expired, status: expired, messageKey: credential.expired, params: { date: expiry_date } }
  - { id: expiring, when: { expires_within: { days: 30 } }, status: expiring, messageKey: credential.expiring, params: { days: days_to_expiry, date: expiry_date } }
  - { id: valid, when: always, status: current, messageKey: credential.valid, params: { date: expiry_date } }

ruleDescriptionKey: faa_medical_private

divergences:
  - id: derived-expiry
    api: Uses only the expiry date entered for the medical, and treats it as expired on that day.
    article: For private, recreational, student, sport and flight instructor privileges any class of medical runs to the end of the 60th month after the month of the examination (under 40 on the examination date) or the 24th month (40 or older), and is valid through that last day; the entered date is used only when earlier.
    cite: 14 CFR 61.23(d)(1)(iv)-(v), (d)(2)(ii)-(iii), (d)(3)

notes: >-
  Partial: one evaluation per FAA medical for holders of an FAA pilot certificate (the
  privilege level every certificate includes; commercial and ATP durations are separate
  rules). Operations that need no medical (61.23(b): gliders, balloons, instructing without
  acting as PIC) and operations under BasicMed or a U.S. driver's license (61.23(c)) are not
  distinguished; see faa.14cfr61.61-23-c-3.basicmed. The issued date is the examination date;
  the age is taken on that date.
