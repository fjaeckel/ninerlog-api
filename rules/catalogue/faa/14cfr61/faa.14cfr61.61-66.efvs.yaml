notes: >-
  Not supported: 61.66(d) needs six instrument approaches flown using EFVS as sole
  manipulator within the 6 calendar months before the month of the flight, one to a full
  stop, and (e) an EFVS refresher course after more than six further months. The record does
  not mark approaches as flown with EFVS, so the approaches cannot be counted.
