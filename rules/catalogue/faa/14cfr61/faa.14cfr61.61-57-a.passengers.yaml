id: faa.14cfr61.61-57-a.passengers
title: Passenger recency, takeoffs and landings (powered aircraft)
authority: faa
instrument: 14 CFR Part 61
article: 61.57(a)(1)
support: partial
source_kind: regulation
effective_from: null
effective_to: null
source:
  cite: 14 CFR 61.57(a)(1)
  url: https://www.ecfr.gov/current/title-14/part-61/section-61.57
  file: sources/faa/61.57.md
  quote:
    - "no person may act as a pilot in command of an aircraft carrying persons or of an aircraft certificated for more than one pilot flight crewmember unless that person has made at least three takeoffs and three landings within the preceding 90 days, and—"
    - "(i) The person acted as the sole manipulator of the flight controls; and"
    - "(ii) The required takeoffs and landings were performed in an aircraft of the same category, class, and type (if a class or type rating is required)"
related_sources:
  - cite: 14 CFR 61.89(a)(1)
    url: https://www.ecfr.gov/current/title-14/part-61/section-61.89
    file: sources/faa/61.89.md
    quote: ["(a) A student pilot may not act as pilot in command of an aircraft:", "(1) That is carrying a passenger;"]
citations: [14 CFR 61.57(a)(1)]

group: faa_passengers

applies_to:
  subject: passengers
  authorities: [FAA]
  excludeClasses: [IR, GLIDER, ULTRALIGHT]
  excludeLicenceKinds: [FAA_STUDENT]
  typeRated: false

window: { rolling_days: 90 }

requirements:
  all_of:
    - id: takeoffs_landings
      metric: takeoffs_and_landings
      min: 3
      unit: landings
      nameKey: requirement.takeoffs_and_landings
      remedyKey: remedy.fly_more
      filter: { classes: [$subject], soleManipulator: true }

stages:
  - { id: current, when: all_met, status: current, messageKey: pax.day_current }
  - { id: not_logged, when: undetermined, status: unknown, messageKey: pax.experience_not_logged }
  - { id: not_current, when: always, status: lapsed, messageKey: pax.not_current, params: { needed: { needed: takeoffs_landings } } }

ruleDescriptionKey: faa_pax_day_night

divergences:
  - id: takeoffs
    api: Counts landings only.
    article: At least three takeoffs and three landings; the smaller of the two counts.
    cite: 14 CFR 61.57(a)(1)
  - id: sole-manipulator
    api: Counts landings on every flight in the class, whatever the pilot's role.
    article: Only takeoffs and landings made as sole manipulator of the flight controls count. When no flight in the window records it, passenger recency is unknown, never current.
    cite: 14 CFR 61.57(a)(1)(i)
  - id: rating-status
    api: Also reports the class rating itself (faa.14cfr61.61-57-ab.rating) as expired or expiring when the passenger landings are missing, which makes readiness report the aircraft class as not ready.
    article: 61.57(a) restricts only carrying persons (and multi-pilot aircraft); FAA class ratings have no recency of their own and are not evaluated.
    cite: 14 CFR 61.57(a)(1)
  - id: night-separate
    api: Reports day and night passenger recency in one evaluation (pax.current_day_night, pax.day_current_night_not).
    article: Night recency is a separate requirement (61.57(b)) and is evaluated by faa.14cfr61.61-57-b.night-passengers; this rule reports day recency only (pax.day_current).
    cite: 14 CFR 61.57(b)(1)
  - id: status-lapsed
    api: Reports unmet passenger recency as expired.
    article: Passenger recency is rolling recent experience; the certificate and rating stay valid, so the status is lapsed.
    cite: 14 CFR 61.57(a)(1)
  - id: student
    api: Evaluates passenger recency for every FAA licence type.
    article: A student pilot may not carry passengers at all; student certificates are not evaluated.
    cite: 14 CFR 61.89(a)(1)

notes: >-
  Partial: class ratings only (typeRated: false); takeoffs and landings count per class. A
  rating that carries a type designator is a type rating and is evaluated per type by
  faa.14cfr61.61-57-a.passengers-type ("category, class, and type (if a class or type rating
  is required)"). 61.57(a) also applies to aircraft certificated for more than one pilot without
  passengers; that is not a separate subject. Takeoffs and landings in a full flight simulator
  or flight training device (61.57(a)(3)) need an approved part 142 course, which the record
  cannot show, so simulator sessions do not count. The (e) exceptions for part 119
  certificate holders, trainees with an authorized instructor and practical tests are not
  modelled. Gliders are evaluated by faa.14cfr61.61-57-a.glider-passengers and the tailwheel
  full-stop condition by faa.14cfr61.61-57-a.tailwheel. Ultralight vehicles (part 103) carry
  no passengers under part 61 and are excluded. A student pilot may not carry a passenger
  (61.89(a)(1)), so student certificates are excluded.
