id: faa.14cfr61.61-57-e.exceptions
title: Exceptions to pilot-in-command recent experience
authority: faa
instrument: 14 CFR Part 61
article: 61.57(e)
support: not_supported
source_kind: regulation
effective_from: null
effective_to: null
source:
  cite: 14 CFR 61.57(e)
  url: https://www.ecfr.gov/current/title-14/part-61/section-61.57
  file: sources/faa/61.57.md
  quote:
    - "(5) Paragraphs (a) and (b) of this section do not apply to a person receiving flight training from an authorized instructor, provided:"
    - "(6) Paragraphs (a) and (b) of this section do not apply to the examiner or the applicant during a practical test required by this part."
applies_to: { subject: passengers, authorities: [FAA] }
notes: >-
  Not supported: the exceptions depend on the operation, not the pilot's record: employment
  by a part 119 certificate holder under parts 121, 125 or 135 with that operator's own
  recency ((e)(1)-(3)), the turbine multi-pilot night alternative ((e)(4)), flight training
  with an instructor as sole occupants ((e)(5)) and practical tests ((e)(6)). The 61.57
  rules report the general requirement.
