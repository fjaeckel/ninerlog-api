id: de.dulv.ul-recency.weight-shift
title: Ultralight recency, weight-shift trikes (DULV)
authority: de
instrument: DULV
article: DULV recency rule for weight-shift ultralights, under LuftPersV § 45(4)
support: partial
source_kind: association
effective_from: null
effective_to: null
source:
  cite: DULV recency rule for weight-shift ultralights (document title not verified)
related_sources:
  - cite: LuftPersV § 45(4)
    url: https://www.gesetze-im-internet.de/luftpersv/__45.html
    file: sources/de/luftpersv-45.md
    quote:
      - "Die Rechte aus einem Luftfahrerschein für Luftsportgeräteführer nach § 1 Absatz 4 Satz 1 Nummer 1 der Luftverkehrs-Zulassungs-Ordnung sowie für Sprungfallschirmführer dürfen nur ausgeübt werden, wenn der Inhaber des Luftfahrerscheins eine ausreichende fliegerische Übung nachweist."
      - "Die Einzelheiten legt der Beauftragte nach § 31c des Luftverkehrsgesetzes entsprechend § 42 Absatz 2 fest."
  - cite: LuftVZO § 1(4)
    url: https://www.gesetze-im-internet.de/luftvzo/__1.html
    file: sources/de/luftvzo-1.md
    quote: "Von der Musterzulassung befreit sind ein- oder zweisitzige Luftsportgeräte mit einer höchstzulässigen Leermasse von 120 Kilogramm einschließlich Gurtzeug und Rettungsgerät;"
citations: [DULV recency rule for weight-shift ultralights (document title not verified), LuftPersV § 45(4)]

