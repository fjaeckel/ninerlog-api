ruleDescriptionKey: ul_trike_dulv

divergences:
  - id: kindless-ul
    api: Counts ultralight flights with no kind when every ultralight rating the pilot holds has one and the same kind.
    article: The licence covers the ultralight kind entered in it; a flight whose ultralight kind is not recorded cannot be attributed and is reported as unknown input, never counted.
    cite: LuftPersV § 44(2)

notes: >-
  Partial: association rule. The number (12 hours as PIC on weight-shift trikes in 24 months,
  with no proficiency-check alternative) comes from the rules the DULV sets as Beauftragter
  under § 31c LuftVG, to which § 45(4) LuftPersV delegates; it is not in the statute. The
  association document is private and is not stored in sources/; its title and text were not
  verified for this port (TODO: verify), so the threshold is the one the API implements
  (internal/service/currency/german_ul.go germanULTrikeDULVRule). DULV and DAeC differ for
  trikes, so the rule follows the licence authority: DAeC licences use
  de.daec.ul-recency.weight-shift, every other German ultralight licence (DULV, LBA) this rule.
  Ambiguity, § 45(4): it refers to "§ 1 Absatz 4 Satz 1 Nummer 1" LuftVZO, but LuftVZO § 1(4)
  Satz 1 has no numbered items; read literally it covers one- and two-seat sport aircraft of
  at most 120 kg empty mass. Ultralights of this kind above 120 kg are named neither in
  § 45(2), (2a) nor (4); the catalogue applies the association rule regardless of mass, as the
  API does, because the record has no empty mass per ultralight.
