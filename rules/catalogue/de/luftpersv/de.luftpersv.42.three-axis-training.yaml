id: de.luftpersv.42.three-axis-training
title: Ultralight licence training progress, three-axis
authority: de
instrument: LuftPersV
article: § 42 (not in sources/), § 45b
support: partial
source_kind: national_law
effective_from: null
effective_to: null
source:
  cite: LuftPersV § 45b
  url: https://www.gesetze-im-internet.de/luftpersv/__45b.html
  file: sources/de/luftpersv-45b.md
  quote:
    - "Als Flugzeiten für den Erwerb und die Erweiterung eines Luftfahrerscheins für Luftsportgeräteführer sowie den Nachweis für die Ausübung der Rechte aus diesem gelten, sofern in dieser Verordnung nichts anderes bestimmt ist:"
    - "die Flugzeit als Schüler mit Fluglehrer,"
    - "die Flugzeit als Luftfahrzeugführer bei vorgeschriebenen Übungsflügen mit Fluglehrer,"
citations: [LuftPersV § 42, LuftPersV § 45b]

applies_to:
  subject: training
  programme: UL_THREE_AXIS
  licenceKinds: [UL]

window: { lifetime: true }
filter: { classes: [ULTRALIGHT], ulKinds: [THREE_AXIS, THREE_AXIS_MOTORGLIDER] }

requirements:
  all_of:
    - { id: total_time, metric: minutes.picOrDualOrSpic, min: 1800, unit: minutes, nameKey: requirement.flight_time, remedyKey: remedy.fly_more }
    - { id: solo_time, metric: minutes.picOrSpic, min: 300, unit: minutes, nameKey: requirement.solo_time, remedyKey: remedy.fly_more }

stages:
  - { id: complete, when: all_met, status: current, messageKey: training.all_met }
  - { id: in_progress, when: always, status: lapsed, messageKey: training.in_progress }

notes: >-
  Partial: training progress toward the three-axis ultralight licence, as the API shows it
  (programme UL_THREE_AXIS, items training.ul.total_time and training.ul.solo_time): 30 hours
  of flight time (dual, supervised solo and PIC) including 5 hours solo, on three-axis
  ultralights and UL motorgliders over the whole logbook. The text of § 42 LuftPersV is not in
  sources/, so the hours could not be checked against it (TODO: verify); § 42(2) appears to
  leave the training details to the Beauftragte (DULV, DAeC), in which case the hours are an
  association rule. The source quoted here, § 45b, only says which flight time counts: time as
  a student with an instructor and as pilot on prescribed training flights with an instructor;
  supervised solo and PIC time are counted as the API does. As in the API, PIC time flown after
  the licence was issued also counts (lifetime window), and the programme is evaluated once
  for a holder with an ultralight licence record (licence kind UL, which may be the licence in
  training); the API decides from the pilot profile whether to show it. Ultralight flights
  with no kind are unknown input and never counted (the API also leaves them out). The API
  shows the items with the requirement-name keys training.ul.*; the catalogue needs
  requirement_name keys and uses requirement.flight_time and requirement.solo_time.
