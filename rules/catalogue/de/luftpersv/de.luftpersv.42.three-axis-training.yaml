id: de.luftpersv.42.three-axis-training
title: Ultralight licence training progress, three-axis
authority: de
instrument: LuftPersV
article: § 42(4) no. 1, § 45b
support: partial
source_kind: national_law
effective_from: null
effective_to: null
source:
  cite: LuftPersV § 42(4) Nr. 1
  url: https://www.gesetze-im-internet.de/luftpersv/__42.html
  file: sources/de/luftpersv-42.md
  quote:
    - "Die Ausbildung von Führern für aerodynamisch gesteuerte Ultraleichtflugzeuge nach § 1 Abs. 1 Nr. 7 der Luftverkehrs-Zulassungs-Ordnung umfasst"
    - "eine Gesamtflugzeit von 30 Flugstunden mit aerodynamisch gesteuerten Ultraleichtflugzeugen; davon können bis zu 20 Flugstunden durch Flugzeit als verantwortlicher Führer von Segelflugzeugen oder Hubschraubern oder fünf Flugstunden durch Flugzeit als Führer von schwerkraftgesteuerten Ultraleichtflugzeugen ersetzt werden, wobei in der Gesamtflugzeit mindestens fünf Flugstunden im Alleinflug enthalten sein müssen, sowie"
related_sources:
  - cite: LuftPersV § 45b
    url: https://www.gesetze-im-internet.de/luftpersv/__45b.html
    file: sources/de/luftpersv-45b.md
    quote:
      - "Als Flugzeiten für den Erwerb und die Erweiterung eines Luftfahrerscheins für Luftsportgeräteführer sowie den Nachweis für die Ausübung der Rechte aus diesem gelten, sofern in dieser Verordnung nichts anderes bestimmt ist:"
      - "die Flugzeit als Schüler mit Fluglehrer,"
      - "die Flugzeit als Luftfahrzeugführer bei vorgeschriebenen Übungsflügen mit Fluglehrer,"
citations: [LuftPersV § 42(4) Nr. 1, LuftPersV § 45b]

applies_to:
  subject: training
  programme: UL_THREE_AXIS
  licenceKinds: [UL]

window: { lifetime: true }
filter: { classes: [ULTRALIGHT], ulKinds: [THREE_AXIS, THREE_AXIS_MOTORGLIDER] }

requirements:
  all_of:
    - { id: total_time, metric: minutes.picOrDualOrSpic, min: 1800, unit: minutes, nameKey: requirement.flight_time, remedyKey: remedy.fly_more }
    - { id: solo_time, metric: minutes.picOrSpic, min: 300, unit: minutes, nameKey: requirement.solo_time, remedyKey: remedy.fly_more }

stages:
  - { id: complete, when: all_met, status: current, messageKey: training.all_met }
  - { id: in_progress, when: always, status: lapsed, messageKey: training.in_progress }

notes: >-
  Partial: training progress toward the three-axis ultralight licence, as the API shows it
  (programme UL_THREE_AXIS, items training.ul.total_time and training.ul.solo_time): the
  30 hours of flight time and the 5 hours solo of § 42(4) no. 1 LuftPersV, counted on
  three-axis ultralights and UL motorgliders over the whole logbook. Not modelled: the credit
  of up to 20 hours as PIC of sailplanes or helicopters, or 5 hours as pilot of weight-shift
  ultralights, toward the 30 hours; and the items of § 42(4) no. 2 (take-offs and landings at
  different aerodromes, outlanding exercises and two cross-country flights of 200 km with an
  instructor, briefings), which the API does not track. § 45b, quoted as a related source, says
  which flight time counts: time as a student with an instructor and as pilot on prescribed
  training flights with an instructor; supervised solo and PIC time are counted as the API does.
  As in the API, PIC time flown after the licence was issued also counts (lifetime window), and
  the programme is evaluated once for a holder with an ultralight licence record (licence kind
  UL, which may be the licence in training); the API decides from the pilot profile whether to
  show it. Ultralight flights with no kind are unknown input and never counted (the API also
  leaves them out). The catalogue uses requirement_name keys (requirement.flight_time,
  requirement.solo_time) for the API items training.ul.*.
