  # ======================= Passenger rules =======================

  - id: easa.part-fcl.fcl-060-b.passengers
    where:
      definition: internal/service/currency/easa.go:661-777 (EASAEvaluator.EvaluatePassengerCurrency)
      ir_waiver: internal/service/currency/easa.go:779-793 (hasValidIRRating)
      night_privilege: internal/service/currency/faa.go:262-282 (HasNightPrivilege)
      window: internal/service/currency/passenger_expiry.go:9-16
      expiry: internal/service/currency/passenger_expiry.go:36-55
    article: [EASA FCL.060(b)(1), FCL.060(b)(2)(i), FCL.060(b)(2)(ii)]
    ruleDescriptionKey: easa_pax
    subject:
      kind: passengers
      classes: every non-IR class with a rating under EASA or delegated German authority (SEP, MEP, SET, TMG on non-sailplane licence, OTHER, GYROPLANE); not GLIDER, not TMG on SPL/LAPL(S) (variants below)
      once_per: class + authority string (first licence wins)
    window:
      kind: rolling_days
      value: 90
      code: "midnight UTC of today .AddDate(0,0,-90) (paxWindowStart); a landing on day D counts through D+90 inclusive"
    requirements:
      day:
        - { id: day, metric: 'landings.total (day + night) on the class, towed excluded, any role', min: 3, unit: landings }
      night:
        applies_when: HasNightPrivilege(licenseType, authority) and class != GLIDER
        requirement: { id: night, metric: landings.night on the class, min: 1, unit: landings }
        waived_when: the same licence carries an IR rating with a non-nil expiry that is not expired (hasValidIRRating uses time.Now, not the as-of instant)
    stages: see stages_day, stages_night and summary_message_order
    stages_day:
      - { when: data read error, dayStatus: unknown, nightStatus: unknown, messageKey: pax.evaluation_failed }
      - { when: 'landings >= 3', dayStatus: current }
      - { when: otherwise, dayStatus: expired }
    stages_night:
      - { when: no night privilege, nightStatus: unknown }
      - { when: valid IR, nightStatus: current }
      - { when: 'night landings >= 1', nightStatus: current }
      - { when: otherwise, nightStatus: expired }
    summary_message_order:
      - { when: 'GPL shortfall (gyroplane variant)', messageKey: pax.gpl_experience_not_met, params: [needed] }
      - { when: day not current, messageKey: pax.not_current, params: [needed = 3 - landings] }
      - { when: no night privilege, messageKey: pax.current_day_no_night_privilege }
      - { when: valid IR, messageKey: pax.current_day_night_ir_waived }
      - { when: night current, messageKey: pax.current_day_night }
      - { when: otherwise, messageKey: pax.day_current_night_not, params: [needed = 1] }
    output_fields: [dayLandings, nightLandings, dayRequired 3, nightRequired 1 or 0 (IR), nightPrivilege, dayExpiresOn, nightExpiresOn (only with night privilege and not waived)]
    expiry_logic: >-
      Walk landing days newest first accumulating the counted landings; the date where the
      running total first reaches the requirement + 90 days is the expiry (last current day).
      Nil when unmet or required == 0.
    messages: [pax.evaluation_failed, pax.not_current, pax.current_day_no_night_privilege, pax.current_day_night_ir_waived, pax.current_day_night, pax.day_current_night_not]
    edge_cases:
      - Night privilege false for LAPL(A), SPL/LAPL(S), GPL, DULV/DAeC authorities, LBA + UL licence, FAA sport/recreational/glider; PPL etc. true.
      - IR waiver only from an IR on the SAME licence; IR without expiry date does not waive (TestEASA_PassengerCurrency_IRWithNoExpiryDoesNotExempt).
      - Never pooled across classes; UL time never credited.
      - Night landings count toward day too.
    suspected_divergence:
      - status: suspected
        what: Counts landings only (not take-offs and approaches) and counts dual flights; FCL.060(b)(1) is believed to require the pilot as sole manipulator of the controls.
      - status: suspected
        what: FFS time excluded (simulators filtered) although FCL.060(b)(1) is believed to accept an FFS.
      - status: suspected
        what: The phrase same type or class is approximated by aircraft_class; type-rated aircraft classed OTHER pool across types.
      - status: suspected
        what: hasValidIRRating uses wall-clock time (r.IsExpired()) - as-of / readiness evaluations use today's IR validity, not the requested date.
      - status: suspected
        what: A LAPL(A) holder with a night rating (FCL.810) is never evaluated for night passengers.
    tests: [two_tier_test.go TestEASA_PassengerCurrency_*, passenger_expiry_test.go TestPaxWindowStart*, TestPaxExpiryDate*, TestEASA_PassengerCurrency_*, TestPassengerCurrency_*, two_tier_test.go TestHasNightPrivilege, TestService_TwoTier_NoDuplicatePassengerCurrency, TestService_TwoTier_IR_NoPassengerCurrency]
    maps_to:

  - id: easa.part-fcl.fcl-205-g-a-2.gpl-passengers
    where:
      definition: internal/service/currency/easa.go:742-757, 761-762; gpl.go:7-9
    article: [EASA FCL.205.G(a)(2)]
    ruleDescriptionKey: easa_pax
    subject:
      kind: passengers
      classes: [GYROPLANE]
      licence_kinds: GPL only (when licence type classifies as GPL)
    window:
      kind: since_issue
      code: "GetProgressByAircraftClass(GYROPLANE, includeTowed=false, since=license.IssueDate)"
    requirements:
      - { id: gpl_pic, metric: minutes.pic on GYROPLANE since licence issue, min: 600, unit: minutes }
      - plus the FCL.060(b) day rule (night not applicable for GPL)
    stages:
      - { when: read error, dayStatus: unknown, nightStatus: unknown, messageKey: pax.evaluation_failed }
      - { when: PIC minutes < 600, dayStatus: expired, dayExpiresOn: null, messageKey: pax.gpl_experience_not_met, params: ["needed = 600 - PIC minutes"] }
    messages: [pax.gpl_experience_not_met, pax.evaluation_failed]
    edge_cases:
      - UL gyroplane PIC time does not count toward the 10 h.
      - A PPL holder's GYROPLANE rating does not get this check (and keeps night privilege).
    suspected_divergence:
      - status: suspected
        what: Licence re-issue resets the counting start (issue date of the stored licence).
    tests: [gpl_test.go TestGPL_PassengersNeed10hPICAfterIssue, TestHasNightPrivilege_GermanAndGPL]
    maps_to:

  - id: easa.part-sfcl.sfcl-160-e-1.sailplane-passengers
    where:
      definition: internal/service/currency/easa.go:687-693, 705
    article: [EASA SFCL.160(e)(1)]
    ruleDescriptionKey: easa_spl_pax
    subject:
      kind: passengers
      classes: GLIDER on any EASA / delegated licence (PPL with GLIDER rating included)
    window: { kind: rolling_days, value: 90, code: paxWindowStart }
    requirements:
