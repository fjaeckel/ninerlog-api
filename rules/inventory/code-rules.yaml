    subject:
      kind: rating (modifier of easa.part-sfcl.sfcl-160-b.tmg)
    window: none
    requirements: none
    stages:
      - { when: "user holds a TMG class rating on any licence evaluated by EASAEvaluator or GermanULEvaluator whose type is neither SPL/LAPL(S) nor a UL licence type", status: current, messageKey: rating.sfcl_tmg_exempt, effect: "requirements and validUntil cleared" }
    messages: [rating.sfcl_tmg_exempt]
    edge_cases:
