  - id: de.luftpersv.45-2.three-axis
    where:
      definition: internal/service/currency/german_ul.go:155-171 (germanULRule), 124-143 (germanULNativeCredit, germanULSEPTMGClasses)
      finalize: internal/service/currency/engine.go:394-426
      kindless: internal/service/currency/german_ul.go:73-91 (kindlessULCounts); engine.go:277-287 (countUnclassifiedUL)
    article: [LuftPersV §45(2), §45(3)]
    ruleDescriptionKey: ul_luftpersv
    subject: { kind: rating, classes: [ULTRALIGHT], ulKind: 'THREE_AXIS (and default for unexpected kinds)', authorities: [LBA, DULV, DAeC, DAEC] }
    window: { kind: rolling_months, value: 24, code: "windowSpec{windowRollingNow, years: 2}" }
    requirements:
      any_of:
        - all_of:
            - { id: total_time, nameKey: requirement.total_time, metric: minutes.total, min: 720, unit: minutes }
            - { id: pic_time, nameKey: requirement.pic_time, metric: minutes.pic, min: 360, unit: minutes }
            - { id: landings, nameKey: requirement.landings, metric: landings.total, min: 12, unit: landings }
            - { id: training_flight, nameKey: requirement.training_flight, metric: 'longest_training_flight_minutes (UL only)', min: 60, unit: minutes }
        - { id: proficiency_check, nameKey: requirement.proficiency_check, metric: "latest check on SEP_LAND/TMG (towed excluded) or on native UL kinds", min: 1, unit: check }
      filters: >-
        SEP_LAND + TMG class flights (towed excluded) add total, PIC, landings but NOT dual,
        SPIC, training flights (classesNoDual) - their total_time still counts even when
        dual. Native UL: THREE_AXIS + THREE_AXIS_MOTORGLIDER aircraft, plus kindless UL when
        every UL rating the user holds (all licences) has one and the same kind; towed
        excluded; dual counted.
    stages:
      - { when: any read error, status: unknown, messageKey: rating.evaluation_failed }
      - { when: experience met or check, status: current, messageKey: rating.recency_current }
      - { when: otherwise, status: lapsed, messageKey: rating.recency_not_met }
    output_fields: [unclassifiedFlights (kindless UL flights in window not counted), creditedUltralightKinds, "countedClasses [SEP_LAND, TMG]", validUntil]
    messages: [rating.evaluation_failed, rating.recency_current, rating.recency_not_met, requirement.progress, requirement.prof_check_completed, requirement.prof_check_missing, remedy.fly_more, remedy.training_flight, remedy.proficiency_check]
    edge_cases:
      - Training flight must be on a UL (SEP dual does not meet it, TestGermanUL_ThreeAxis_DualOnSEPDoesNotCount).
      - Proficiency check on SEP counts (TestGermanUL_ProficiencyCheckOnSEPCountsForThreeAxis).
      - Rating expiry ignored.
    suspected_divergence:
      - status: suspected
        what: Dual flights on SEP/TMG still add their total_time to the 12 h while their dual/training flag is dropped; check §45(2) wording.
      - status: suspected
        what: Landings stand for take-offs and landings.
    tests: [german_ul_test.go TestGermanUL_ThreeAxis_*, TestGermanUL_ProficiencyCheck*, TestGermanUL_ZeroActivity, TestGermanUL_EvaluationFailed, ul_recency_test.go TestTrainingFlight_IsOneFlightOfAnHour, TestKindlessULFlights, projection_test.go TestValidUntil_GermanULThreeAxis]
    maps_to:

