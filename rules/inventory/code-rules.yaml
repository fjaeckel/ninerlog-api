    article: []
    ruleDescriptionKey: privilege_expiry
    subject:
      kind: privilege
      privilege_kinds: [AEROBATIC_BASIC, AEROBATIC_ADVANCED, TMG_NIGHT, BI_S, FE_S, UL_PASSENGER_AUTH, UL_TYPE_BRIEFING, LAUNCH_METHOD_TRAINED (key sfcl_155_launch_method)]
    window: none
    requirements: none
    stages:
      - { when: "expiresOn set and DateOnly(expiresOn) < DateOnly(now)", status: expired, messageKey: privilege.expired, params: [date] }
      - { when: always, status: current, messageKey: privilege.valid, params: [date if expiresOn] }
    messages: [privilege.expired, privilege.valid]
    edge_cases:
      - Valid THROUGH the expiry date (date-only compare), unlike class ratings.
