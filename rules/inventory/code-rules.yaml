      - { when: met, ready: true, status: current, reasonKey: readiness.launch_method_current, params: "date = validUntil when set" }
      - { when: otherwise, ready: false, status: lapsed, reasonKey: remedy.launch_method_dual, params: [method, missing] }
    messages: [readiness.launch_method_current, remedy.launch_method_dual]
    edge_cases:
      - Launch methods of every listed rating appear even when aircraftReg selects a GLIDER only; filtered through ratingCovers of the parent rating.
      - Trained-but-never-logged methods added by the SFCL.155(a) overlay have no validUntil, so no date param.
    suspected_divergence: []
    tests: [readiness_test.go TestEvaluate_Items]
    maps_to:

  - id: other.ninerlog.readiness.passengers
    where: { definition: "internal/service/readiness/readiness.go:279-290, 153-160, 206-216" }
    subject: { kind: 'readiness item "passengers", only when passengers=true' }
    article: []
    window: as the passenger rule, evaluated as of the date
    requirements: none (reads PassengerCurrency.dayStatus)
    messages: [any passenger messageKey]
    stages:
      - { when: dayStatus current, ready: true, reasonKey: passenger messageKey }
