      - { when: otherwise, status: lapsed, messageKey: rating.recency_not_met }
    messages: [rating.sfcl_tmg_exempt, rating.evaluation_failed, rating.recency_current, rating.recency_not_met, requirement.progress, requirement.prof_check_completed, requirement.prof_check_missing, remedy.fly_more, remedy.training_flight, remedy.proficiency_check]
    edge_cases:
