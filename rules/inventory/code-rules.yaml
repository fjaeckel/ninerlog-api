metrics:
  # Every value the code computes from flights. SQL in internal/repository/postgres/.
  # Common filter on all: NOT is_simulator AND NOT is_passenger.
  - { id: flights, definition: "COUNT(*)", where: "currency_flight_data.go:40", used_by: [route sectors (MEP/SET)] }
  - { id: minutes.total, definition: "SUM(total_time)", where: "currency_flight_data.go:41", used_by: [SEP/TMG, LAPL, GPL, German UL] }
  - { id: minutes.pic, definition: "SUM(pic_time)", where: "currency_flight_data.go:42", used_by: [SEP/TMG, German UL, trike DULV, GPL passengers, SPL hours] }
  - { id: minutes.ifr, definition: "SUM(ifr_time)", where: "currency_flight_data.go:43", used_by: [EASA IR] }
  - { id: minutes.dual, definition: "SUM(dual_time) (dual received; field InstructorMinutes)", where: "currency_flight_data.go:44", used_by: [refresher training, SPL hours] }
  - { id: minutes.night, definition: "SUM(night_time)", where: "currency_flight_data.go:45", used_by: [computed, unused by rules] }
  - { id: landings.total, definition: "SUM(landings_day + landings_night)", where: "currency_flight_data.go:46", used_by: [most rules] }
  - { id: landings.day, definition: "SUM(landings_day)", where: "currency_flight_data.go:47", used_by: [computed, unused (the day_landings requirement uses total)] }
  - { id: landings.night, definition: "SUM(landings_night)", where: "currency_flight_data.go:48", used_by: [FAA Tier-1 night] }
  - { id: approaches, definition: "SUM(approaches_count)", where: "currency_flight_data.go:49", used_by: [FAA IR] }
  - { id: holds, definition: "SUM(holds)", where: "currency_flight_data.go:50", used_by: [FAA IR] }
  - { id: launches, definition: "SUM(COALESCE(launches, GREATEST(takeoffs_day + takeoffs_night, 1)))", where: "currency_flight_data.go:29, 51", used_by: [SPL launches, privileges, training] }
  - { id: minutes.spic, definition: "SUM(spic_time)", where: "currency_flight_data.go:52", used_by: [SPL/SPL-TMG hours, training] }
  - { id: training_flights, definition: "COUNT(*) FILTER (WHERE dual_time > 0)", where: "currency_flight_data.go:53", used_by: [SPL 2 training flights, FAA 61.56(b)] }
  - { id: longest_training_flight_minutes, definition: "MAX(total_time) FILTER (WHERE dual_time > 0)", where: "currency_flight_data.go:54", used_by: [LAPL, SPL-TMG, German UL training flight] }
  - { id: minutes.picOrDualOrSpic, definition: "pic + dual + spic (derived)", where: "internal/service/currency/engine.go:63-64", used_by: [SFCL.160(a)(b) hours] }
  - { id: ul_credited_pic_minutes, definition: "PIC minutes on UL of given kinds, towed included", where: "internal/service/currency/engine.go:198-207", used_by: [SFCL.160 hours credit] }
  - { id: unclassified_ul_flights, definition: "flights on UL aircraft with no kind in the window when not counted", where: "internal/service/currency/engine.go:275-287", used_by: [German UL output field] }
  - { id: last_proficiency_check, definition: "MAX date of is_proficiency_check flight since window start on classes (IR: any flight, no join; others: towed excluded unless GLIDER)", where: "currency_flight_data.go:198-232", used_by: [MEP/SET, IR, LAPL, SPL, SPL-TMG, GPL, German UL] }
  - { id: last_proficiency_check_ul, definition: "same on UL selector", where: "currency_flight_data.go:120-137", used_by: [German UL native] }
  - { id: last_flight_review, definition: "MAX date of is_flight_review flight, lifetime, any class", where: "currency_flight_data.go:180-196", used_by: [FAA 61.56] }
  - { id: launches_by_method, definition: "per launch_method SUM(launchCountSQL) on one class, towed not filtered, launch_method non-empty", where: "currency_flight_data.go:272-297; daily: currency_flight_data_daily.go:100-105", used_by: [SFCL.155(c)] }
  - { id: landing_days, definition: "per date SUM(landings_day), SUM(landings_night) on one class, optional pic_time > 0, towed filter, HAVING landings > 0, newest first", where: "currency_flight_data.go:234-256", used_by: [EASA/FAA passengers, SPL passengers, TMG night overlay] }
  - { id: landing_days_ul_with_takeoffs, definition: "per date landings plus SUM(GREATEST(takeoffs_day + takeoffs_night, 1)) on UL selector", where: "currency_flight_data.go:139-168", used_by: [LuftPersV 45a] }
  - { id: pax_takeoffs_and_landings_min, definition: "min(total landings, total takeoffs)", where: "internal/service/currency/german_ul.go:322-323", used_by: [LuftPersV 45a] }
  - { id: gpl_pic_since_issue, definition: "PIC minutes on GYROPLANE since licence IssueDate", where: "internal/service/currency/easa.go:745", used_by: [FCL.205.G(a)(2)] }
  - { id: activity_days, definition: "per date: COUNT(*), SUM(pic_time), SUM(ifr_time), SUM(dual_given_time), SUM(launchCountSQL), COUNT(landings >= 2), SUM(distance NM); filters classes/ulKinds, ExcludeUL, is_tow_flight, ifr_time>0, pic_time>0, dual_given_time>0, dual_time>0, cross_country_time>0, launch_method", where: "currency_privilege_data.go:14-86", used_by: [privileges, SFCL.115, 84a] }
