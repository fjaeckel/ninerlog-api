  - id: faa.14cfr61.61-69.towing
    where: { definition: "internal/service/currency/privileges.go:262-283 (faaTowingRule)" }
    article: [14 CFR 61.69(a)(5) (as cited)]
    ruleDescriptionKey: faa_61_69_towing
    subject: { kind: privilege, privilege_kinds: [SAILPLANE_TOWING], authorities: "equalFold FAA" }
    window:
      kind: calendar_months
      value: 24
      code: "since = first day of month of now.AddDate(0,-24,0) (privileges.go:179-181); validUntil = last day of the 24th month after the reached date (privileges.go:189-191)"
    requirements:
      any_of:
        - { id: tows, nameKey: requirement.tows, metric: 'tows (is_tow_flight, non-UL)', min: 3, unit: tows, remedy: remedy.fly_more }
        - { id: towed_glider_flights, nameKey: requirement.towed_glider_flights, metric: 'launches of GLIDER flights with pic_time > 0 and launch_method aerotow', min: 3, unit: flights, remedy: remedy.fly_more }
    stages: same as sailplane towing
    messages: [privilege.expired, privilege.evaluation_failed, privilege.recency_current, privilege.recency_not_met, requirement.progress, remedy.fly_more]
    edge_cases:
      - Window includes the current month plus 24 preceding months (starts on the 1st of the month 24 months ago).
      - Other 61.69 prerequisites (100 h PIC, endorsement) not evaluated; unpowered UL tows not distinguished.
    suspected_divergence:
      - status: suspected
        what: Calendar-month window may be one month longer than "preceding 24 calendar months"; also 61.69(a)(5) alternative with a qualified pilot not modelled.
