            - { id: tmg_time, nameKey: requirement.tmg_time, metric: minutes.picOrDualOrSpic, min: 360, unit: minutes, counted_on: "TMG + UL THREE_AXIS_MOTORGLIDER PIC" }
            - { id: tmg_landings, nameKey: requirement.tmg_landings, metric: landings.total, min: 12, unit: landings, counted_on: TMG only }
