  - id: faa.14cfr61.61-57-ab.passengers
    where:
      definition: internal/service/currency/faa.go:284-360 (FAAEvaluator.EvaluatePassengerCurrency)
    article: [14 CFR 61.57(a), 61.57(b)]
    ruleDescriptionKey: faa_pax_day_night
    subject:
      kind: passengers
      classes: every non-IR class on an FAA licence except GLIDER and except on a GLIDER licence type (see glider variant)
    window: { kind: rolling_days, value: 90, code: 'paxWindowStart (midnight UTC)' }
    requirements:
      day: { metric: 'landings.total (day + night), any role, towed excluded', min: 3, unit: landings }
      night:
        applies_when: HasNightPrivilege (false for SPORT, RECREATIONAL, GLIDER licence types)
        metric: landings.night (any, not only full-stop)
        min: 3
        unit: landings
    stages:
      - { when: read error, dayStatus: unknown, nightStatus: unknown, messageKey: pax.evaluation_failed }
      - { when: no night privilege and day met, nightStatus: unknown, messageKey: pax.current_day_no_night_privilege }
      - { when: no night privilege and day unmet, dayStatus: expired, messageKey: pax.not_current, params: [needed] }
      - { when: day and night met, messageKey: pax.current_day_night }
      - { when: 'day met, night unmet', nightStatus: expired, messageKey: pax.day_current_night_not, params: ["needed = 3 - night"] }
      - { when: day unmet, dayStatus: expired, messageKey: pax.not_current, params: ["needed = 3 - landings"] }
    messages: [pax.evaluation_failed, pax.current_day_no_night_privilege, pax.not_current, pax.current_day_night, pax.day_current_night_not]
    edge_cases:
      - nightRequired set to 0 without night privilege; RuleDescription names the licence type.
      - NightExpiresOn computed with paxExpiryDate (nil when requirement 0).
    suspected_divergence:
      - status: suspected
        what: 61.57(b) night requires full-stop landings (and night take-offs) in the 1-hour-after-sunset window; code counts any logged night landings and no take-offs. Full-stop data is not stored.
      - status: suspected
        what: Sole manipulator of the controls not enforced for powered aircraft (dual flights count).
      - status: suspected
        what: Tailwheel full-stop requirement (61.57(a)(1)(ii)) and "type, if a type rating is required" not modelled.
      - status: suspected
        what: FFS/FTD alternatives (61.57(a)(3)?) not modelled; simulators excluded.
    tests: [two_tier_test.go TestFAA_PassengerCurrency_*, TestFAA_SportPilot_PassengerCurrency_NoNight, TestFAA_PrivatePilot_PassengerCurrency_HasNight, passenger_expiry_test.go TestFAA_PassengerCurrency_*]
    maps_to:

