  # ======================= EASA Part-SFCL rating rules =======================

  - id: easa.part-sfcl.sfcl-160-a.sailplane
    where:
      definition: internal/service/currency/easa.go:421-486 (easaSPLRule)
      extra_credit: internal/service/currency/easa.go:488-498 (easaSPLExtraCredit)
      ul_pic_credit: internal/service/currency/engine.go:198-207 (ulHoursCredit)
    article: [EASA SFCL.160(a)(1), SFCL.160(a)(2), AMC1 SFCL.160]
    ruleDescriptionKey: easa_spl
    subject:
      kind: rating
      classes: GLIDER on any licence under EASA / LBA / DULV / DAeC / unknown authority; every non-TMG class on an SPL or LAPL(S) licence
      selection: easa.go:62-63, 76-81; other.go:28-29
    window:
      kind: rolling_months
      value: 24
      code: "windowSpec{windowRollingNow, years: 2}"
    requirements:
      any_of:
        - all_of:
            - { id: flight_time, nameKey: requirement.flight_time, metric: minutes.picOrDualOrSpic, min: 300, unit: minutes, counted_on: "rating class (towed included) + TMG (GLIDER rating only; towed excluded; PIC+dual+SPIC) + UL SAILPLANE and UL THREE_AXIS_MOTORGLIDER PIC minutes (towed included)" }
            - { id: launches, nameKey: requirement.launches, metric: launches, min: 15, unit: launches, counted_on: 'rating class only, towed included' }
            - { id: training_flights, nameKey: requirement.training_flights, metric: 'training_flights (flights with dual_time > 0)', min: 2, unit: flights, counted_on: rating class only }
        - { id: proficiency_check, nameKey: requirement.proficiency_check, metric: 'proficiency_checks on the rating class (towed allowed on GLIDER)', min: 1, unit: check }
    stages:
      - { when: 'data read error (sailplane, TMG or UL read)', status: unknown, messageKey: rating.evaluation_failed }
      - { when: experience met or check, status: current, messageKey: rating.recency_current }
      - { when: otherwise, status: lapsed, messageKey: rating.recency_not_met }
    messages: [rating.evaluation_failed, rating.recency_current, rating.recency_not_met, requirement.progress, requirement.prof_check_completed, requirement.prof_check_missing, remedy.fly_more, remedy.proficiency_check, launch_method.progress, remedy.launch_method_dual]
    output_fields: [launchMethodCurrency (see easa.part-sfcl.sfcl-155-c.launch-method), "countedClasses [GLIDER, TMG]", "creditedUltralightKinds [SAILPLANE, THREE_AXIS_MOTORGLIDER]", validUntil]
    edge_cases:
      - Supervised solo counts toward hours as SPIC time (spic_time); a solo logged as PIC counts as PIC.
      - Training flights are a count of flights with any dual time; no minimum duration.
      - Launches = stored launches, else takeoffs_day+takeoffs_night, at least 1 per flight (launchCountSQL).
      - TMG time and UL PIC time count only toward the 5 h, never launches or training flights; UL dual/SPIC never counted.
      - Extra credit (TMG, UL) only for a GLIDER rating; an SEP_LAND rating on an SPL licence counts only SEP_LAND flights under this rule.
      - Proficiency check error swallowed (easa.go:478).
      - Rating expiry ignored.
      - Service overlay - SFCL.155(a) trained launch methods (easa.part-sfcl.sfcl-155-a.launch-method-trained) applied to every result with ruleDescriptionKey easa_spl when privileges are readable.
    suspected_divergence:
      - status: suspected
        what: Proficiency check "with an FE(S) on a sailplane, excluding TMGs" is matched by any is_proficiency_check flight on the rating class; examiner not checked.
      - status: suspected
        what: Training flights "with an FI(S)" approximated by dual_time > 0.
      - status: suspected
        what: Non-GLIDER classes on an SPL licence (e.g. SEP_LAND) are evaluated as sailplanes.
    tests: [lapl_spl_test.go TestEASA_SPL_*, sfcl_supervised_solo_test.go, sfcl_ul_test.go TestSFCL160a_ULSailplaneAndMotorgliderPICHoursCount, glider_ul_test.go TestGermanULEvaluator_GliderUsesSPLRule, TestEASA_GliderClass_CountsGliderFlights, TestTowedFlights_IncludedOnlyForSailplaneRules, cross_class_test.go TestEASA_LAPL_GliderRatingUsesSPLRule, projection_test.go TestValidUntil_SPLLaunches, TestValidUntil_ProficiencyCheckAlternative]
    maps_to:

  - id: easa.part-sfcl.sfcl-155-c.launch-method
    where:
      definition: internal/service/currency/easa.go:509-551 (launchMethods, launchMethodRequired, easaLaunchMethodCurrency)
      remedy: internal/service/currency/projection.go:71-80
    article: [EASA SFCL.155(c), SFCL.155(d) (remedy)]
    subject:
      kind: launch_method (per method on a sailplane rating result)
      parent_rule: easa.part-sfcl.sfcl-160-a.sailplane
    window:
      kind: rolling_months
      value: 24
      code: same since as the parent rule
    requirements:
      per_method:
        methods_order: [winch, car, aerotow, self-launch, bungee]
        listed_when: the method was EVER logged on the rating class (GetLaunchCounts since zero time), or a LAUNCH_METHOD_TRAINED privilege exists (overlay)
        metric: launches by method on the rating class since window start (towed not filtered); self-launch adds the TMG launches in the window (only for GLIDER ratings, from the extra-credit TMG read)
        min: "5; bungee 2"
    stages:
      - { when: 'count >= required', met: true, messageKey: launch_method.progress }
      - { when: otherwise, met: false, messageKey: launch_method.progress, remedy: "remedy.launch_method_dual {method, missing}" }
    messages: [launch_method.progress, remedy.launch_method_dual, readiness.launch_method_current]
    edge_cases:
      - Launch-count read errors silently return no launch methods at all (easa.go:524-531).
      - Launch method status never changes the rating status (informational).
      - validUntil per met method via projection.
      - Launch method string is the stored lower-case value; flights without launch_method are ignored.
    suspected_divergence:
      - status: suspected
        what: TMG take-offs counted as self-launches; SFCL.155 self-launch recency may be meant for self-launching sailplanes only.
    tests: [lapl_spl_test.go TestEASA_SPL_LaunchMethodCurrency, TestEASA_SPL_LaunchMethodNeverUsedIsOmitted, glider_ul_test.go TestEASA_SPL_LaunchCountsUseRatingClass, projection_test.go TestRemedyKeys_LaunchMethodDual]
    maps_to:

  - id: easa.part-sfcl.sfcl-155-a.launch-method-trained
    where:
      overlay: internal/service/currency/service_privileges.go:69-109 (applyTrainedLaunchMethods); service.go:113-115
      privilege_status: internal/service/currency/privileges.go:132-134
    article: [EASA SFCL.155(a)]
    ruleDescriptionKey: sfcl_155_launch_method (on the privilege result)
    subject:
      kind: privilege (LAUNCH_METHOD_TRAINED, detail = launch method) and launch_method overlay
    window: "privilege: none; added launch-method rows use the SPL window (24 months) for self-launch TMG launches"
    requirements: none (marks trained)
    stages:
      - { when: privilege expired, status: expired, messageKey: privilege.expired }
      - { when: otherwise, status: current, messageKey: privilege.valid }
    overlay_logic: >-
      For a rating result with ruleDescriptionKey easa_spl: rebuild launchMethodCurrency in
      launchMethods order; keep logged methods; add trained-but-never-logged methods with 0
      launches (self-launch: TMG launches in the last 24 months, towed excluded), met =
      launches >= required, remedy.launch_method_dual when unmet; set trained=true for methods
      with a LAUNCH_METHOD_TRAINED privilege on the rating's own licence (any expiry state).
    messages: [privilege.valid, privilege.expired, launch_method.progress, remedy.launch_method_dual]
    edge_cases:
      - Trained flag ignores whether the privilege is expired.
      - Added rows get no validUntil (overlay runs after projection).
      - Initial training counts (10 dual + 5 solo winch launches etc.) are not evaluated.
    suspected_divergence: []
    tests: [privileges_test.go TestService_TrainedLaunchMethods]
    maps_to:

  - id: easa.part-sfcl.sfcl-160-b.tmg
    where:
