  # ======================= Readiness =======================

  - id: other.ninerlog.readiness.rating
    where: { definition: "internal/service/readiness/readiness.go:218-254 (ratingItem), 105-170 (Evaluate), 193-204 (ratingCovers)" }
    article: []
    subject: { kind: 'readiness item "rating", for each rating from EvaluateAsOf(date)' }
    window: "date from today to today+366 days (utcDate), else ErrInvalidDate; EvaluateAsOf runs at noon UTC on the date"
    requirements: none (reads the rating evaluation)
    messages: [any rating messageKey, remedy.fly_more, remedy.training_flight, remedy.proficiency_check]
    stages:
      - { when: status current or expiring, ready: true, reasonKey: rating messageKey, params: rating messageParams }
      - { when: status lapsed, ready: false, reasonKey: "remedyKey of the first unmet row whose remedy is not remedy.proficiency_check, else remedy.proficiency_check", params: remedyParams }
      - { when: expired or unknown, ready: false, reasonKey: rating messageKey }
    edge_cases:
      - With aircraftReg only ratings whose own class equals the aircraft class are listed (a UL rating with a kind must cover the aircraft kind; kindless UL rating covers all UL). IR never matches an aircraft.
      - Unknown registration -> ErrAircraftNotFound (404).
    suspected_divergence:
      - status: suspected
        what: Status expiring is ready - fine for EASA revalidation, wrong for the FAA IR grace period (rating.ir_lapsed_safety_pilot) and FAA night-only shortfall is irrelevant to solo flight but FAA day-expired blocks readiness although only passengers are restricted.
      - status: suspected
        what: FAA flight review and licence privileges are not readiness items.
    tests: [readiness_test.go TestEvaluate_Items, TestEvaluate_AircraftFilter, TestEvaluate_Date, TestEvaluate_Errors]
    maps_to:

