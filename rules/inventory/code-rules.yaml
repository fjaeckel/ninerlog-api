  - id: easa.part-sfcl.sfcl-205-c.sailplane-towing
    where:
      definition: internal/service/currency/privileges.go:242-257 (towRule, sfclTowingRule); 170-230 (rollingWindow, countRow)
      data: internal/repository/postgres/currency_privilege_data.go:14-86
    article: [EASA SFCL.205(c)]
    ruleDescriptionKey: sfcl_205_towing
    subject: { kind: privilege, privilege_kinds: [SAILPLANE_TOWING], authorities: "every licence whose authority is not equalFold FAA" }
    window: { kind: rolling_months, value: 24, code: "now.AddDate(0,-24,0) (privileges.go:183); validUntil = reachedDate.AddDate(0,24,-1)" }
    requirements:
      - { id: tows, nameKey: requirement.tows, metric: 'tows (launches of is_tow_flight flights, any non-UL class)', min: 5, unit: tows, remedy: "remedy.privilege_with_instructor {missing, unit}" }
    stages:
      - { when: privilege expired, status: expired, messageKey: privilege.expired }
      - { when: no PrivilegeDataProvider, status: unknown, messageKey: privilege.evaluation_failed }
      - { when: read error, status: unknown, messageKey: privilege.evaluation_failed, requirements: cleared }
      - { when: met, status: current, messageKey: privilege.recency_current, params: [date (optional)] }
      - { when: otherwise, status: lapsed, messageKey: privilege.recency_not_met, params: [date (optional)] }
    messages: [privilege.expired, privilege.evaluation_failed, privilege.recency_current, privilege.recency_not_met, requirement.progress, remedy.privilege_with_instructor]
    edge_cases:
      - Banner and sailplane tows share is_tow_flight.
      - Tow flights still count as ordinary flights in class-rating aggregates; only this privilege query filters is_tow_flight (UL excluded).
    suspected_divergence:
      - status: suspected
        what: SFCL.205 applied to any non-FAA licence; for PPL(A)/LAPL(A) holders towing in aeroplanes the recency is believed to be FCL.805.
    tests: [privileges_test.go TestEvaluatePrivilege_Recency]
    maps_to:

