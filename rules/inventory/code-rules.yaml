      - status: suspected
        what: No way to ask about night passenger carriage.
    tests: [readiness_test.go TestEvaluate_Passengers]
    maps_to:

  - id: other.ninerlog.readiness.medical
    where: { definition: "internal/service/readiness/readiness.go:292-336 (credentialItem, latestMedicals); internal/models/credential.go:50-66" }
    article: []
    subject:
      kind: credential
      credential_types: [EASA_CLASS1_MEDICAL, EASA_CLASS2_MEDICAL, EASA_LAPL_MEDICAL, FAA_CLASS1_MEDICAL, FAA_CLASS2_MEDICAL, FAA_CLASS3_MEDICAL]
    window: "one item per medical type: the certificate expiring last (no expiry counts as last)"
    requirements: none (expiry date only)
    messages: [readiness.credential_valid, readiness.credential_expired]
    stages:
      - { when: "expiryDate null or not before date+12h", ready: true, status: valid, reasonKey: readiness.credential_valid, params: "date = expiry if set" }
      - { when: otherwise, ready: false, status: expired, reasonKey: readiness.credential_expired, params: [date] }
    edge_cases:
      - Expired on the expiry date itself (expiry 00:00 before noon).
      - Informational only; no medical is tied to a licence or class; language, radio and security credentials ignored.
    suspected_divergence:
      - status: suspected
        what: Medical validity (age-dependent periods, class downgrade e.g. FAA class 1 privileges decaying to class 3, BasicMed Part 68, LAPL medical, German 120 kg UL exemption) is not computed - only the user-entered expiry date is used.
      - status: suspected
        what: Credential treated as expired on its expiry date.
    tests: [readiness_test.go TestEvaluate_Medicals]
    maps_to:

  # ======================= Night privilege and save-time checks =======================

  - id: other.ninerlog.night-privilege
    where: { definition: "internal/service/currency/faa.go:262-282 (HasNightPrivilege)" }
    article: [14 CFR 61.315/61.101 (sport/recreational), FCL.810, LuftPersV §44(2)]
    subject: { kind: 'licence (gate for night passenger evaluation)' }
    window: none
    requirements: none
    messages: [pax.current_day_no_night_privilege (downstream)]
    stages: see logic
    logic:
      - { when: "authority FAA and kind in {FAA_SPORT, FAA_RECREATIONAL, FAA_GLIDER}", night: false }
      - { when: "authority EASA and kind SPL or LAPL_S", night: false }
      - { when: "authority EASA and kind LAPL_A", night: false }
      - { when: "authority DULV or DAEC, or authority LBA and kind UL", night: false }
      - { when: 'kind GPL (any authority)', night: false }
      - { when: otherwise, night: true }
      - { note: "EASA and FAA passenger rules additionally force night off for class GLIDER" }
    edge_cases:
      - Authority compared upper-case here; an "LBA" SPL gets night privilege (EASA branch only for authority EASA).
    suspected_divergence:
      - status: suspected
        what: LAPL(A) / SPL holders with a night rating (FCL.810 / SFCL.210 via TMG_NIGHT only for SPL TMG) are always excluded.
    tests: [two_tier_test.go TestHasNightPrivilege, german_ul_test.go TestHasNightPrivilege_ULAuthorities, gpl_test.go TestHasNightPrivilege_GermanAndGPL]
    maps_to:

  - id: de.luftpersv.44-2.ul-night-flight-warning
    where: { definition: "internal/service/save_warnings.go:87-103 (checkULNightFlight)" }
    article: [LuftPersV §44(2)]
    subject: { kind: 'flight save warning (not a currency result)' }
    window: per flight
    requirements: none
    stages: see logic
    messages: [ul_night_flight (warning code, not a message key)]
    logic: >-
      Warning ul_night_flight (severity warning) when a non-simulator flight on a fleet
      aircraft of class ULTRALIGHT logs night_time > 0 or landings_night > 0; params
      nightTime, landingsNight, registration, ulKind.
    edge_cases: [Aircraft not in fleet or non-UL never warn]
    suspected_divergence: []
    tests: [internal/service/save_warnings_test.go]
    maps_to:

  # ======================= Training progress programmes =======================

  - id: easa.part-sfcl.sfcl-130.spl-training
    where: { definition: "internal/service/training/templates.go:17-53, 80-84, 184-210; service.go:37-107; repository/postgres/training.go:22-34, 65-78" }
    article: [EASA SFCL.130(a), SFCL.130(b)]
    subject: { kind: 'training programme SPL, discipline SAILPLANE' }
    window: lifetime (all crewed GLIDER flights; FSTD and passenger flights excluded; fleet aircraft only)
    requirements:
      all_of:
        - { key: training.spl.instruction_time, metric: minutes.dual + minutes.spic, min: 900, unit: minutes }
        - { key: training.spl.dual_time, metric: minutes.dual, min: 600, unit: minutes }
        - { key: training.spl.supervised_solo_time, metric: minutes.spic, min: 120, unit: minutes }
        - { key: training.spl.launches, metric: launches of flights with dual or SPIC time, min: 45, unit: launches }
        - { key: training.spl.cross_country, metric: "one flight with cross_country_time > 0 that is solo (no dual, PIC+SPIC > 0) with distance >= 50 km, or dual with distance >= 100 km; distance 0 (unknown) also qualifies", min: 1, unit: flights }
      informational:
        - { key: training.spl.credit_sfcl130b, metric: "min(10% of PIC minutes on non GLIDER/TMG/UL aircraft, 420)", required: 420, unit: minutes, only_when: 'pilot holds an aeroplane, GPL or helicopter licence kind' }
    stages:
      - { item: met, messageKey: training.met }
      - { item: not met, messageKey: training.not_met }
      - { item: xc met only by unknown distance, messageKey: training.cross_country_distance_unknown }
      - { item: 'credit > 0', messageKey: training.credit_available }
      - { item: credit 0, messageKey: training.credit_none }
      - { programme: allMet = every non-informational item met }
    selection: "programme listed when the SAILPLANE discipline status is training, or requested explicitly"
    messages: [training.met, training.not_met, training.cross_country_distance_unknown, training.credit_available, training.credit_none, training.programme.spl]
    edge_cases: [signedFlights counts flights with a completed signature (informational); credit never reduces other items]
    suspected_divergence:
      - status: suspected
        what: Straight-line distance understates tasks; out-and-return flights have no cross-country time.
    tests: [training/templates_test.go TestEvaluate, TestEvaluate_CreditNeverAffectsAllMet, training/service_test.go TestService_Progress, TestIsOtherCategoryLicence]
    maps_to:

  - id: easa.part-sfcl.sfcl-150-b.tmg-extension-training
    where: { definition: "internal/service/training/templates.go:28-30, 85-88, 211-218" }
    article: [EASA SFCL.150(b)]
    subject: { kind: 'training programme SPL_TMG_EXTENSION, discipline TMG' }
    window: lifetime (TMG flights)
    requirements:
      all_of:
        - { key: training.tmg.instruction_time, metric: minutes.dual + minutes.spic, min: 360, unit: minutes }
        - { key: training.tmg.dual_time, metric: minutes.dual, min: 240, unit: minutes }
        - { key: training.tmg.solo_cross_country, metric: "one solo flight with cross_country_time > 0 and distance >= 150 km or unknown", min: 1, unit: flights }
    stages: as easa.part-sfcl.sfcl-130.spl-training (training.met / training.not_met / training.cross_country_distance_unknown; allMet over all items)
    messages: [training.met, training.not_met, training.cross_country_distance_unknown, training.programme.spl_tmg_extension]
    edge_cases: [Full-stop landing elsewhere approximated by cross-country time]
    suspected_divergence: []
    tests: [training/templates_test.go TestEvaluate]
    maps_to:

  - id: de.luftpersv.42.three-axis-training
    where: { definition: "internal/service/training/templates.go:32-33, 89-92, 219-225" }
    article: [LuftPersV §42]
    subject: { kind: 'training programme UL_THREE_AXIS, discipline ULTRALIGHT' }
    window: lifetime (UL THREE_AXIS + THREE_AXIS_MOTORGLIDER flights; kindless never)
    requirements:
      all_of:
        - { key: training.ul.total_time, metric: minutes.dual + minutes.pic + minutes.spic, min: 1800, unit: minutes }
        - { key: training.ul.solo_time, metric: minutes.pic + minutes.spic, min: 300, unit: minutes }
    stages: training.met when current >= required, else training.not_met; allMet over all items
    messages: [training.met, training.not_met, training.programme.ul_three_axis]
    edge_cases: []
    suspected_divergence:
      - status: suspected
        what: Post-licence PIC time counts as training time.
    tests: [training/templates_test.go TestEvaluate]
    maps_to:

  - id: de.luftpersv.42.weight-shift-training
    where: { definition: "internal/service/training/templates.go:34-36, 93-96, 226-233" }
    article: [LuftPersV §42]
    subject: { kind: 'training programme UL_WEIGHT_SHIFT, discipline ULTRALIGHT' }
    window: lifetime (UL WEIGHT_SHIFT flights)
    requirements:
      all_of:
        - { key: training.ul.total_time, metric: minutes.dual + minutes.pic + minutes.spic, min: 1500, unit: minutes }
        - { key: training.ul.dual_time, metric: minutes.dual, min: 600, unit: minutes }
        - { key: training.ul.solo_time, metric: minutes.pic + minutes.spic, min: 300, unit: minutes }
    stages: training.met when current >= required, else training.not_met; allMet over all items
    messages: [training.met, training.not_met, training.programme.ul_weight_shift]
    edge_cases: []
    suspected_divergence: []
    tests: [training/templates_test.go TestEvaluate]
    maps_to:

# ---------------------------------------------------------------------------------------
adjacent_logic:
  # Not rules to port, but consumers / neighbours whose behaviour depends on rule output.
  - what: Notifications consume currency results
    where: internal/service/notification.go:266-293, 318-393, 395-478, 480-545
    note: >-
      Rating expiry warnings at the user's warning days, revalidation/recency notice when
      status is expiring/expired/lapsed, passenger notice when dayStatus != current (except
      pax.ul_authorisation_missing), night notice when nightPrivilege and night not current,
      flight review warnings, privilege expiry warnings; credential expiry warnings at warning
      days (notification.go:218-250). Keys rendered by pkg/email/currency_messages.go.
  - what: Pilot profile discipline recency (not regulatory)
    where: internal/service/pilotprofile/derive.go:15-16, 190
    note: 24-month evidence window, cutoff = midnight today minus 24 months; drives active/dormant/training statuses and which training programmes appear.
  - what: Credit scope for licence logbooks
    where: internal/service/currency/credit_scope.go:21-122
    note: Reuses each rule's classes / ulCredit / extraCredit to decide which flights are "credited" in a licence logbook; must stay consistent with catalogue crediting.
  - what: Save-time aircraft warnings
    where: internal/service/save_warnings.go:105-125
    note: ul_mtom_exceeds_600 (MTOM > 600 kg, warning) and ul_120kg_class (MTOM <= 120 kg, info).

out_of_scope:
  - id: custom-currency-rules
    where: internal/service/currency/custom.go, custom_service.go, internal/repository/postgres/custom_currency_data.go
    reason: Pilot-authored rules (user data), no regulatory basis; keep in the API.

