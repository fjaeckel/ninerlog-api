# Inventory of every currency, recency, validity, passenger, privilege, flight-review,
# readiness and training-progress rule the NinerLog API evaluates today (DESIGN.md section 8).
# Parity baseline: anything evaluated by Go code and missing here is lost on the port.
#
# Paths are relative to the ninerlog-api root. Line numbers refer to branch
# feature/rules-catalogue at the time of writing.
# "suspected_divergence" entries are suspicions from reading code, comments and docs only;
# no regulation text was read to write them. Each must be checked against sources/.

meta:
  generated_for: rules/DESIGN.md section 8
  scope_note: >-
    Custom currency rules (internal/service/currency/custom.go, custom_service.go) are
    pilot-defined and OUT of scope; they are listed under out_of_scope only.
  shared_conventions:
    statuses: [current, expiring, expired, lapsed, unknown]
    status_meaning:
      current: may exercise privileges
      expiring: expiry approaching, or expiry-anchored revalidation experience not yet met, or FAA IR grace / FAA night-only shortfall
      expired: past a date expiry, FAA 61.57 currency not met, passenger day requirement unmet
      lapsed: rolling recency rule unmet (licence stays valid); also privileges with unmet recency
      unknown: no data / evaluation failed / not applicable (messageKey disambiguates)
    now: >-
      All rules read "now" from context (clock.go:17 nowFrom); EvaluateAsOf runs at noon UTC
      on the requested date (clock.go:30 dateAt, service.go:54).
    rolling_window_since: >-
      windowRollingNow: since = now.AddDate(-years,-months,-days) (engine.go:138). since
      carries the clock time of now (noon for as-of evaluations); SQL compares f.date (DATE)
      >= since, and the daily cache uses !midnightUTC(date).Before(since) (daily.go:70), so a
      flight flown exactly N years/months/days before the evaluation date is OUTSIDE the
      window unless now is exactly midnight. lastDayCounted (daily.go:250) mirrors this.
    expiry_anchored_since: since = rating.ExpiryDate.AddDate(-1,0,0) (easa.go:126,182,252)
    expiry_check: >-
      ClassRating.IsExpiredAt(now) = ExpiryDate.Before(now) (models/class_rating.go:81); the
      expiry date is stored at 00:00 so a rating is already "expired" during its expiry day
      (as-of evaluations run at 12:00). IsExpiringSoonAt(now,90) = ExpiryDate <
      now+90d and not expired (class_rating.go:94). daysUntil = int(hours/24) truncated
      (clock.go:25).
    global_flight_filters: >-
      Every flight read excludes is_simulator and is_passenger flights. Class reads INNER JOIN
      aircraft by (user_id, registration) and match upper(trim(aircraft_class)); flights on
      registrations not in the fleet never count toward a class rule. GetProgressAll and the
      IR proficiency-check lookup do NOT join aircraft, so they count flights on unknown
      aircraft (currency_flight_data.go:170-178, 203-210).
    towed_launch_exclusion: >-
      Towed launches = winch, aerotow, car, bungee (models/launch_method.go:40). They are
      counted only when includeTowedFlights(classType, sailplane) is true: the rating class is
      GLIDER or the rule is flagged countsTowed / the licence is a sailplane licence
      (engine.go:327-329; SQL currency_flight_data.go:104,115,149,243). scopeByClassOverride
      rules (SPL TMG) never include towed (engine.go:232). Proficiency checks exclude towed
      launches except on GLIDER aircraft (currency_flight_data.go:216). Launch counts by method
      ignore the towed filter (currency_flight_data.go:272-297).
    remedies: >-
      After every rating evaluation annotateRemedies (projection.go:63-81) sets on each unmet
      requirement with a nameKey: unit "check" -> remedy.proficiency_check (no params); unit
      "review" -> none; nameKey requirement.training_flight or requirement.tmg_training_flight
      -> remedy.training_flight (no params); otherwise remedy.fly_more {missing:
      ceil(required-current), unit}. Every unmet launch method -> remedy.launch_method_dual
      {method, missing}.
    valid_until_projection: >-
      Only when the provider is a dailyCache (always in Service.evaluateAll when the Postgres
      provider is used) and the rule window is windowRollingNow (projection.go:13-50): the
      rule is re-evaluated at every date a recorded flight date leaves the window; each met
      requirement / met launch method / current rating gets validUntil = last such date on
      which it is still met. Expiry-anchored and expiry-only rules get none. Passenger
      currency uses its own dayExpiresOn/nightExpiresOn (passenger_expiry.go).

# ---------------------------------------------------------------------------------------
# Dispatch: how a (licence, class rating) pair reaches a rule. Needed to reproduce selection.
# ---------------------------------------------------------------------------------------
dispatch:
  registry:
    where: cmd/api/main.go:256-262; internal/service/currency/evaluator.go:120-155; service.go:180-185
    logic: >-
      Registry keyed by the exact, case-sensitive license.RegulatoryAuthority string:
      "EASA" -> EASAEvaluator, "FAA" -> FAAEvaluator, "" -> OtherEvaluator, "LBA", "DULV",
      "DAeC", "DAEC" -> GermanULEvaluator. Any other string (including "easa", "Faa",
      "daec", "EASA " with whitespace, "FOCA", "CAA") -> OtherEvaluator fallback.
    edge_cases:
      - Authority matching is case-sensitive here while HasNightPrivilege (faa.go:266) and ClassifyLicence upper-case it; a licence entered as "easa" gets expiry-only rules but EASA night logic.
      - OtherEvaluator implements neither passenger nor flight-review interfaces, so unknown authorities get no passenger currency (tested TestService_TwoTier_OtherAuthority_NoPassengerCurrency).
  licence_classification:
    where: internal/models/licence_kind.go:66-95
    logic: >-
      ClassifyLicence(type, authority): authority DULV/DAEC (upper, trimmed) or a type naming
      UL ("UL", "UL ...", "UL-...", contains ULTRALIGHT/ULTRALEICHT) -> UL; exact table
      PPL/PPL(A)->PPL_A, LAPL/LAPL(A)->LAPL_A, CPL(A), ATPL(A), MPL(A), SPL, LAPL(S), GPL,
      SPORT, RECREATIONAL, PRIVATE, COMMERCIAL, ATP, GLIDER (FAA glider), IR/IR(A)/IR(H),
      EXAMINER/CFI/CFII/MEI and FI/CRI/IRI/TRI/SFI/MCCI/FE/CRE/IRE/TRE[(x)] -> INSTRUCTOR;
      suffix (H) -> HELICOPTER; else UNKNOWN. Currency calls pass authority "" (easa.go:38,44,
      gpl.go:45, faa.go:259,265) so DULV/DAeC authority alone does not make a type UL there.
    tests: [internal/models/licence_kind_test.go, internal/service/currency/licence_classifier_test.go TestLicenceClassifierWrappers, two_tier_test.go TestEASALicenceTypeSpellings]
  easa:
    where: internal/service/currency/easa.go:51-92
    order:
      - class IR -> easa.part-fcl.fcl-625-a.ir (any licence type)
      - class GLIDER -> easa.part-sfcl.sfcl-160-a.sailplane (any licence type)
      - class GYROPLANE -> easa.part-fcl.fcl-240-g.gpl (any licence type)
      - class ULTRALIGHT -> easa.part-fcl.class-rating-expiry (expiry only)
      - licence kind LAPL_A -> easa.part-fcl.fcl-140-a.lapl-a (every remaining class incl. MEP/SET/OTHER)
      - licence kind SPL or LAPL_S, class TMG -> easa.part-sfcl.sfcl-160-b.tmg
      - licence kind SPL or LAPL_S, any other class (SEP_LAND, OTHER...) -> easa.part-sfcl.sfcl-160-a.sailplane
      - SEP_LAND, SEP_SEA, TMG -> easa.part-fcl.fcl-740-a.sep-tmg
      - MEP_LAND, MEP_SEA, SET_LAND, SET_SEA -> easa.part-fcl.fcl-740-a.mep-set
      - anything else (OTHER, unknown) -> easa.part-fcl.class-rating-expiry
    tests: [lapl_spl_test.go TestEASA_Dispatch_*, glider_ul_test.go TestGliderULClass_RuleSelection, gpl_test.go TestGPL_AnyLicenceTypeUsesGPLRule]
  faa:
    where: internal/service/currency/faa.go:33-51
    order:
      - class ULTRALIGHT -> other.ninerlog.expiry-only
      - class IR and upper(licenseType) in {SPORT, RECREATIONAL} (exact, untrimmed) -> faa.14cfr61.61-315.ir-not-applicable
      - class IR otherwise -> faa.14cfr61.61-57-c.instrument
      - upper(licenseType) == GLIDER or class GLIDER -> faa.14cfr61.61-56.glider-rating
      - everything else (SEP, MEP, SET, TMG, GYROPLANE, OTHER) -> faa.14cfr61.61-57-ab.rating
  german_ul:
    where: internal/service/currency/german_ul.go:63-71, 104-122
    order:
      - class != ULTRALIGHT -> delegated to EASAEvaluator.EvaluateWithPeers (EASA dispatch above)
      - ULTRALIGHT with no ul_kind -> de.luftpersv.45.kind-required
      - HELICOPTER -> de.luftpersv.45-2a.helicopter
      - GYROPLANE -> de.luftpersv.45-4.gyroplane
      - WEIGHT_SHIFT and trimmed authority equalFold "DAeC" -> de.luftpersv.45-4.weight-shift-daec
      - WEIGHT_SHIFT otherwise (LBA, DULV) -> de.luftpersv.45-4.weight-shift-dulv
      - POWERED_PARAGLIDER -> de.luftpersv.45-4.powered-paraglider
      - SAILPLANE -> de.luftpersv.45-4.sailplane
      - default (THREE_AXIS) -> de.luftpersv.45-2.three-axis
  other:
    where: internal/service/currency/other.go:26-33
    order:
      - class GLIDER -> easa.part-sfcl.sfcl-160-a.sailplane (EASA rule reused, no peers)
      - everything else -> other.ninerlog.expiry-only
  service_orchestration:
    where: internal/service/currency/service.go:60-177
    logic: >-
      For each licence, for each class rating: evaluate (HolderAware > PeerAware > plain;
      peers = ratings on the same licence, held = ratings on all licences); then apply the
      SFCL.160(c) exemption, then the SFCL.155(a) trained-launch overlay; then passenger
      currency once per key class:authority[:ulKind] (first licence wins), skipping IR, UL
      outside GermanULEvaluator and UL with no kind; then privilege overlays on the passenger
      result. Flight review evaluated once, from the first licence whose evaluator implements
      FlightReviewEvaluator (FAA). Privileges evaluated for every licence when a
      PrivilegeLister is wired and readable. A licence whose ratings fail to load is skipped
      silently (service.go:81-83).

# ---------------------------------------------------------------------------------------
rules:
# ---------------------------------------------------------------------------------------

  # ======================= EASA Part-FCL rating rules =======================

  - id: easa.part-fcl.fcl-740-a.sep-tmg
    where:
      definition: internal/service/currency/easa.go:96-158 (easaSEPTMGRule)
      class_pool: internal/service/currency/credited_classes.go:20-27 (easaSEPTMGClasses)
      ul_credit: internal/service/currency/credited_classes.go:42-53 (easaAnnexICredit)
      window_guard: internal/service/currency/easa.go:648-659 (applyClosedWindow)
    article: [EASA FCL.740.A(b)(1), EASA FCL.035(a)(4)]
    ruleDescriptionKey: easa_sep_tmg
    subject:
      kind: rating
      classes: [SEP_LAND, SEP_SEA, TMG]
      authorities: [EASA, "LBA/DULV/DAeC (non-UL ratings delegated to EASA)"]
      licence_kinds: every kind except LAPL_A, SPL, LAPL_S (PPL, CPL, ATPL, MPL, unknown, UL-type licences holding such a class)
      selection: easa.go:84-86
    window:
      kind: before_expiry_months
      value: 12
      code: "since := rating.ExpiryDate.AddDate(-1, 0, 0)  (easa.go:126)"
      closed_window: >-
        If now < since the result is current / rating.window_not_open {date: since} with no
        requirements (applyClosedWindow). windowOpensAt=since and windowOpen are set on every
        result that reaches the window step.
    requirements:
      all_of:
        - { id: total_time, nameKey: requirement.total_time, metric: minutes.total, min: 720, unit: minutes }
        - { id: pic_time, nameKey: requirement.pic_time, metric: minutes.pic, min: 360, unit: minutes }
        - { id: landings, nameKey: requirement.landings, metric: landings.total, min: 12, unit: landings }
        - { id: refresher, nameKey: requirement.refresher_training, metric: 'minutes.dual (sum of dual_time)', min: 60, unit: minutes }
      filters: >-
        Classes: [rating class], or [SEP_LAND, TMG] when the rating is SEP_LAND or TMG and
        the same licence holds both SEP_LAND and TMG ratings (peers). SEP_SEA never pooled.
        Towed launches excluded. Plus Annex I UL credit: THREE_AXIS flights when SEP_LAND is
        counted, THREE_AXIS_MOTORGLIDER when TMG is counted; UL flights add total, PIC,
        landings, flights, IFR, night, approaches, holds, launches but NOT dual/SPIC/training
        flights (addProgress withDual=false, engine.go:250-273).
    stages:
      - { when: expiryDate is null, status: unknown, messageKey: rating.no_expiry_date }
      - { when: now < expiry-12mo, status: current, messageKey: rating.window_not_open, params: [date] }
      - { when: flight data read error, status: unknown, messageKey: rating.evaluation_failed }
      - { when: 'expired (expiry < now)', status: expired, messageKey: rating.expired }
      - { when: not all requirements met, status: expiring, messageKey: rating.revalidation_not_met }
      - { when: all met and expiry within 90 days, status: expiring, messageKey: rating.revalidation_expiring_met, params: [days] }
      - { when: all met, status: current, messageKey: rating.revalidation_current }
    messages: [rating.no_expiry_date, rating.window_not_open, rating.evaluation_failed, rating.expired, rating.revalidation_not_met, rating.revalidation_expiring_met, rating.revalidation_current, requirement.progress, remedy.fly_more]
    output_fields: [windowOpensAt, windowOpen, countedClasses (when pooled), creditedUltralightKinds, progress]
    edge_cases:
      - Pooling needs BOTH SEP_LAND and TMG ratings on the same licence; when called without peers (Evaluate) nothing is pooled.
      - UL credit is time and landings only; the refresher never counts UL dual time (FCL.035(a)(4) reading, docs/DOMAIN.md Ultralights).
      - UL credit only for aircraft with an explicit ul_kind; kindless UL flights never credited.
      - An expired rating reports expired even if the experience is met; renewal is not modelled.
      - Unmet requirements before expiry report "expiring", not lapsed (rating still valid until expiry).
      - Refresher is cumulative dual minutes across flights, not one flight (TestRefresherTraining_StaysCumulative).
      - No validUntil projection (expiry-anchored).
    suspected_divergence:
      - status: suspected
        what: No proficiency-check alternative. FCL.740.A(b)(1) is believed to allow revalidation by a proficiency check within the 3 months before expiry OR by experience; the code only evaluates experience.
      - status: suspected
        what: Counts landings only; the rule is believed to require 12 take-offs AND 12 landings. Takeoffs are not read.
      - status: suspected
        what: Refresher "with an FI or CRI" is approximated by any dual_time; instructor qualification and the ATO-aircraft condition are not checked (UL dual excluded by design).
      - status: suspected
        what: Rating treated as expired on its expiry date itself (ExpiryDate 00:00 before now); validity is usually understood to run through the expiry date.
    tests: [currency_test.go TestEASA_SEP_*, TestEASA_TMG_Current, two_tier_test.go TestEASA_SEP_LookbackIs12Months_NotFlights, cross_class_test.go TestEASA_PPL_SEPLandAndTMG_Pooled, TestEASA_PPL_SEPLandOnly_TMGNotCounted, TestEASA_PPL_SEPSea_NotPooledWithTMG, TestEASA_PooledRules_ExcludeTowedLaunches, annex_i_credit_test.go TestEASA_SEP_ThreeAxisULTimeAndLandingsCount, TestEASA_SEP_ULRefresherDoesNotCount, TestEASA_AnnexICredit_ByClass, ul_recency_test.go TestRefresherTraining_StaysCumulative, TestExpiryAnchoredRevalidationUnmetStaysExpiring, projection_test.go TestValidUntil_ExpiryAnchoredRuleOmitted]
    maps_to:

  - id: easa.part-fcl.fcl-740-a.mep-set
    where:
      definition: internal/service/currency/easa.go:160-232 (easaMEPSETRule)
    article: [EASA FCL.740.A(b)(2) (as cited in code)]
    ruleDescriptionKey: easa_mep_set
    subject:
      kind: rating
      classes: [MEP_LAND, MEP_SEA, SET_LAND, SET_SEA]
      authorities: [EASA, LBA/DULV/DAeC via delegation]
      licence_kinds: all except LAPL_A, SPL, LAPL_S
      selection: easa.go:87-88
    window:
      kind: before_expiry_months
      value: 12
      code: "since := rating.ExpiryDate.AddDate(-1, 0, 0)  (easa.go:182); closed-window guard as SEP"
    requirements:
      any_of:
        - all_of:
            - { id: route_sectors, nameKey: requirement.route_sectors, metric: flights, min: 10, unit: flights }
            - { id: refresher, nameKey: requirement.refresher_training, metric: minutes.dual, min: 60, unit: minutes }
        - { id: proficiency_check, nameKey: requirement.proficiency_check, metric: 'proficiency_checks (latest is_proficiency_check flight on the rating class since window start)', min: 1, unit: check }
      filters: rating class only, towed excluded, no UL credit; route sectors = COUNT of flights in class, any role (dual included).
    stages:
      - { when: expiryDate is null, status: unknown, messageKey: rating.no_expiry_date }
      - { when: now < expiry-12mo, status: current, messageKey: rating.window_not_open, params: [date] }
      - { when: data read error, status: unknown, messageKey: rating.evaluation_failed }
      - { when: expired, status: expired, messageKey: rating.expired }
      - { when: neither experience nor check, status: expiring, messageKey: rating.revalidation_not_met_prof_check }
      - { when: met and expiry within 90 days, status: expiring, messageKey: rating.revalidation_expiring_met, params: [days] }
      - { when: met, status: current, messageKey: rating.revalidation_current }
    requirement_messages:
      proficiency_check: "requirement.prof_check_completed {date} when found, else requirement.prof_check_missing"
    messages: [rating.no_expiry_date, rating.window_not_open, rating.evaluation_failed, rating.expired, rating.revalidation_not_met_prof_check, rating.revalidation_expiring_met, rating.revalidation_current, requirement.progress, requirement.prof_check_completed, requirement.prof_check_missing, remedy.fly_more, remedy.proficiency_check]
    edge_cases:
      - Proficiency-check lookup error is swallowed (profCheckDate, _ := ...) and treated as "no check" (easa.go:199).
      - Proficiency check anywhere in the 12-month window counts.
    suspected_divergence:
      - status: suspected
        what: Revalidation by 10 route sectors + refresher without a proficiency check. For single-pilot multi-engine class ratings a proficiency check within the 3 months before expiry is believed mandatory; route sectors look like a type-rating / SET provision.
      - status: suspected
        what: Proficiency check accepted anywhere in the 12 months before expiry instead of the 3-month revalidation window.
      - status: suspected
        what: Route sectors counted as any flight in class, including dual/instructional flights and multi-leg rows as one.
    tests: [currency_test.go TestEASA_MEP_AllMet, TestEASA_MEP_InsufficientSectors_Expiring, TestEASA_MEP_WindowNotYetOpen, proficiency_check_test.go TestEASA_MEP_ProfCheckOnly_Current, TestEASA_MEP_NoProfCheck_NoExperience_Expiring, TestEASA_MEP_ProfCheckRequirement_InResponse, two_tier_test.go TestEASA_MEP_LookbackIs12Months, cross_class_test.go TestEASA_PPL_MEP_NotPooled]
    maps_to:

  - id: easa.part-fcl.fcl-625-a.ir
    where:
      definition: internal/service/currency/easa.go:234-306 (easaIRRule)
      data: internal/repository/postgres/currency_flight_data.go:170-178 (GetProgressAll), 202-210 (IR proficiency check, no class filter)
    article: [EASA FCL.625.A (as cited in code)]
    ruleDescriptionKey: easa_ir
    subject:
      kind: rating
      classes: [IR]
      authorities: [EASA, LBA/DULV/DAeC via delegation]
      licence_kinds: all (dispatch before licence type)
      selection: easa.go:55-57
    window:
      kind: before_expiry_months
      value: 12
      code: "since := rating.ExpiryDate.AddDate(-1, 0, 0) (easa.go:252); closed-window guard"
    requirements:
      all_of:
        - { id: ifr_time, nameKey: requirement.ifr_time, metric: minutes.ifr, min: 600, unit: minutes }
        - { id: proficiency_check, nameKey: requirement.proficiency_check, metric: 'proficiency_checks (any class, no aircraft join)', min: 1, unit: check }
      filters: >-
        All flights except simulators, passenger flights and flights on GLIDER or UL
        SAILPLANE aircraft (notSailplaneFlightSQL); flights on aircraft not in the fleet count.
    stages:
      - { when: expiryDate is null, status: unknown, messageKey: rating.no_expiry_date }
      - { when: now < expiry-12mo, status: current, messageKey: rating.window_not_open, params: [date] }
      - { when: data read error, status: unknown, messageKey: rating.evaluation_failed }
      - { when: expired, status: expired, messageKey: rating.expired }
      - { when: ifr unmet and no check, status: expiring, messageKey: rating.ir_hours_and_check_not_met }
      - { when: ifr unmet, status: expiring, messageKey: rating.ir_hours_not_met }
      - { when: check missing, status: expiring, messageKey: rating.ir_check_not_met }
      - { when: met and expiry within 90 days, status: expiring, messageKey: rating.revalidation_expiring_met, params: [days] }
      - { when: met, status: current, messageKey: rating.revalidation_current }
    messages: [rating.no_expiry_date, rating.window_not_open, rating.evaluation_failed, rating.expired, rating.ir_hours_and_check_not_met, rating.ir_hours_not_met, rating.ir_check_not_met, rating.revalidation_expiring_met, rating.revalidation_current, requirement.progress, requirement.prof_check_completed, requirement.prof_check_missing, remedy.fly_more, remedy.proficiency_check]
    edge_cases:
      - Sailplane IFR time (cloud flying) never counts (GLIDER and UL SAILPLANE excluded).
      - Proficiency check error swallowed as "no check".
      - IR ratings never get passenger currency (service.go:121).
      - A valid IR (non-nil, unexpired expiry) waives the FCL.060(b) night passenger requirement on the same licence (see easa.part-fcl.fcl-060-b.passengers).
    suspected_divergence:
      - status: suspected
        what: 10 h IFR flight time requirement; FCL.625.A revalidation is believed to be a proficiency check only (the 10 h may come from another provision, e.g. IR(A) with one-per-two-years check alternation).
      - status: suspected
        what: Any is_proficiency_check flight in any class (an SEP class-rating check, even a glider check) satisfies the IR proficiency check; FSTD checks are excluded because simulators are filtered.
      - status: suspected
        what: Proficiency check accepted anywhere in 12 months before expiry rather than the 3-month window.
      - status: suspected
        what: FSTD IFR time excluded from the IFR total.
    tests: [currency_test.go TestEASA_IR_Current, TestEASA_IR_InsufficientIFR_Expiring, TestEASA_IR_Expired, TestEASA_IR_WindowNotYetOpen, proficiency_check_test.go TestEASA_IR_*, lapl_spl_test.go TestEASA_Dispatch_IR_SameForAllLicenseTypes]
    maps_to:

  - id: easa.part-fcl.class-rating-expiry
    where:
      definition: internal/service/currency/easa.go:308-332 (easaExpiryOnlyRule)
    article: []
    ruleDescriptionKey: ""
    subject:
      kind: rating
      classes: [ULTRALIGHT (under EASA), OTHER, any class not listed in EASA dispatch]
      authorities: [EASA, LBA/DULV/DAeC for non-UL classes that fall through]
    window: none (expiry only)
    requirements: none
    stages:
      - { when: expiryDate is null, status: unknown, messageKey: rating.no_expiry_date }
      - { when: expired, status: expired, messageKey: rating.expired }
      - { when: expiry within 90 days, status: expiring, messageKey: rating.expiring, params: [days] }
      - { when: always, status: current, messageKey: rating.valid_until }
    messages: [rating.no_expiry_date, rating.expired, rating.expiring, rating.valid_until]
    edge_cases:
      - EASA never evaluates an ULTRALIGHT rating's recency; UL ratings under EASA get expiry only and no passenger currency (service.go:124).
    suspected_divergence: []
    tests: [annex_i_credit_test.go TestEASA_ULTRALIGHTRatingStaysExpiryOnly, glider_ul_test.go TestEASA_ULClass_ExpiryOnly]
    maps_to:

  - id: easa.part-fcl.fcl-140-a.lapl-a
    where:
      definition: internal/service/currency/easa.go:334-395 (easaLAPLRule)
      land_sea_split: internal/service/currency/easa.go:397-419 (easaLAPLLandSeaReqs)
      class_pool: internal/service/currency/credited_classes.go:5-16
    article: [EASA FCL.140.A(a)(1), FCL.140.A(a)(2), FCL.140.A(b), FCL.035(a)(4)]
    ruleDescriptionKey: easa_lapl
    subject:
      kind: rating
      classes: every class on a LAPL(A) licence except IR, GLIDER, GYROPLANE, ULTRALIGHT
      licence_kinds: ['LAPL_A ("LAPL", "LAPL(A)" case/space-insensitive)']
      authorities: [EASA, LBA/DULV/DAeC delegated]
      selection: easa.go:70-73
    window:
      kind: rolling_months
      value: 24
      code: "rt.since = windowSpec{windowRollingNow, years: 2}.rollingSince(now) = now.AddDate(-2,0,0) (easa.go:348,358)"
    requirements:
      any_of:
        - all_of:
            - { id: total_time, nameKey: requirement.total_time, metric: minutes.total, min: 720, unit: minutes }
            - { id: landings, nameKey: requirement.landings, metric: landings.total, min: 12, unit: landings }
            - { id: training_flight, nameKey: requirement.training_flight, metric: longest_training_flight_minutes, min: 60, unit: minutes }
            - conditional: when the SAME licence holds both SEP_LAND and SEP_SEA ratings
              all_of:
                - { id: sep_land_time, nameKey: requirement.sep_land_time, metric: 'minutes.total (SEP_LAND only, no UL)', min: 60, unit: minutes }
                - { id: sep_land_landings, nameKey: requirement.sep_land_landings, metric: 'landings.total (SEP_LAND only)', min: 6, unit: landings }
                - { id: sep_sea_time, nameKey: requirement.sep_sea_time, metric: 'minutes.total (SEP_SEA only)', min: 60, unit: minutes }
                - { id: sep_sea_landings, nameKey: requirement.sep_sea_landings, metric: 'landings.total (SEP_SEA only)', min: 6, unit: landings }
        - { id: proficiency_check, nameKey: requirement.proficiency_check, metric: proficiency_checks on any pooled class, min: 1, unit: check }
      filters: >-
        Pool = SEP_LAND, SEP_SEA, MEP_LAND, MEP_SEA, SET_LAND, SET_SEA, TMG always (not only
        rated classes); towed excluded; Annex I UL credit THREE_AXIS (as SEP_LAND) and
        THREE_AXIS_MOTORGLIDER (as TMG) for time and landings only. GLIDER never counts.
        Training flight = longest total_time of a single flight with dual_time > 0 on the
        pooled classes (UL flights excluded from it).
    stages:
      - { when: 'data read error (incl. land/sea split read)', status: unknown, messageKey: rating.evaluation_failed }
      - { when: experience met or check found, status: current, messageKey: rating.recency_current }
      - { when: otherwise, status: lapsed, messageKey: rating.recency_not_met }
    messages: [rating.evaluation_failed, rating.recency_current, rating.recency_not_met, requirement.progress, requirement.prof_check_completed, requirement.prof_check_missing, remedy.fly_more, remedy.training_flight, remedy.proficiency_check]
    output_fields: [countedClasses (the 7-class pool), creditedUltralightKinds, validUntil, requirements.validUntil]
    edge_cases:
      - No PIC-time requirement.
      - rating.expiryDate is ignored entirely; a LAPL class rating with a past expiry date can report current.
      - The land/sea split is appended only when both ratings are peers on the same licence.
      - Proficiency check error swallowed as none (easa.go:379).
      - Training flight is ONE flight of >= 60 min total time with some dual; three 20-minute dual circuits do not meet it (TestLAPL_TrainingFlight_IsOneFlightOfAnHour).
    suspected_divergence:
      - status: suspected
        what: Total time counts every role (SIC, PICUS, examiner...) via total_time; FCL.140.A(a)(1) is believed to count flight time as PIC (or dual / supervised solo).
      - status: suspected
        what: Counts landings only; the article speaks of take-offs and landings.
      - status: suspected
        what: rating expiry ignored; if a LAPL rating record carries an expiry date it never produces expired.
      - status: suspected
        what: MEP/SET classes pooled for a LAPL although LAPL(A) privileges are SEP/TMG only (harmless unless such flights exist).
    tests: [lapl_spl_test.go TestEASA_LAPL_Current, TestEASA_LAPL_NoPICRequirement, TestEASA_LAPL_InsufficientHours, TestEASA_LAPL_RollingFromNow, cross_class_test.go TestEASA_LAPL_*, annex_i_credit_test.go TestEASA_LAPL_ULTimeCountsNotTrainingFlight, ul_recency_test.go TestLAPL_TrainingFlight_IsOneFlightOfAnHour, TestRollingRecencyUnmetIsLapsed, lapl_spl_test.go TestEASA_Dispatch_LAPL_UsesFCL140A]
    maps_to:

  - id: easa.part-fcl.fcl-240-g.gpl
    where:
      definition: internal/service/currency/gpl.go:21-41 (easaGPLRule), 15-19 (gplAnnexICredit)
      finalize: internal/service/currency/engine.go:394-426 (recencyFinalize(true))
    article: [EASA FCL.240.G(a), FCL.035(a)(5)]
    ruleDescriptionKey: easa_gpl
    subject:
      kind: rating
      classes: [GYROPLANE]
      licence_kinds: any (selection by class, easa.go:64-65)
      authorities: [EASA, LBA/DULV/DAeC delegated]
    window:
      kind: rolling_months
      value: 24
      code: "windowSpec{windowRollingNow, years: 2}"
    requirements:
      any_of:
        - all_of:
            - { id: total_time, nameKey: requirement.total_time, metric: minutes.total, min: 720, unit: minutes }
            - { id: landings, nameKey: requirement.landings, metric: landings.total, min: 12, unit: landings }
            - { id: refresher, nameKey: requirement.refresher_training, metric: 'minutes.dual (cumulative)', min: 60, unit: minutes }
        - { id: proficiency_check, nameKey: requirement.proficiency_check, metric: 'proficiency_checks on GYROPLANE (UL checks not counted, credit not native)', min: 1, unit: check }
      filters: GYROPLANE class, towed excluded; UL GYROPLANE with mtom_kg >= 450 add time and landings (not dual); UL without mtom not credited.
    stages:
      - { when: data read error, status: unknown, messageKey: rating.evaluation_failed }
      - { when: experience met or check, status: current, messageKey: rating.recency_current }
      - { when: otherwise, status: lapsed, messageKey: rating.recency_not_met }
    messages: [rating.evaluation_failed, rating.recency_current, rating.recency_not_met, requirement.progress, requirement.prof_check_completed, requirement.prof_check_missing, remedy.fly_more, remedy.proficiency_check]
    edge_cases:
      - Unlike other recency rules the proficiency-check lookup error here is NOT swallowed (recencyFinalize returns evaluation_failed).
      - Rating expiry ignored.
    suspected_divergence:
      - status: suspected
        what: Total time counts every role; the rule text (per code comment) is "as PIC, dual or supervised solo".
      - status: suspected
        what: Landings only, take-offs not counted.
    tests: [gpl_test.go TestGPL_Current, TestGPL_AnyLicenceTypeUsesGPLRule, TestGPL_AnnexIGyroplaneCredit, TestGPL_ProficiencyCheck]
