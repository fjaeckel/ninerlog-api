  # ======================= FAA rating rules =======================

  - id: faa.14cfr61.61-57-ab.rating
    where:
      definition: internal/service/currency/faa.go:55-99 (faaPassengerRatingRule)
    article: [14 CFR 61.57(a), 61.57(b)]
    ruleDescriptionKey: faa_pax_day_night
    subject:
      kind: rating
      classes: every FAA class except ULTRALIGHT, IR, GLIDER (and every class on a GLIDER licence)
    window:
      kind: rolling_days
      value: 90
      code: "now.AddDate(0,0,-90) with clock time (NOT paxWindowStart midnight) (faa.go:62,69)"
    requirements:
      all_of:
        - { id: day_landings, nameKey: requirement.day_landings, metric: 'landings.total (day+night)', min: 3, unit: landings }
        - { id: night_landings, nameKey: requirement.night_landings, metric: landings.night, min: 3, unit: landings }
      filters: rating class, towed excluded, any role
    stages:
      - { when: read error, status: unknown, messageKey: rating.evaluation_failed }
      - { when: day unmet, status: expired, messageKey: rating.pax_not_current, params: ["needed = 3 - landings"] }
      - { when: night unmet, status: expiring, messageKey: rating.pax_day_current_night_not, params: ["needed = 3 - night"] }
      - { when: both met, status: current, messageKey: rating.pax_current_day_night }
    messages: [rating.evaluation_failed, rating.pax_not_current, rating.pax_day_current_night_not, rating.pax_current_day_night, requirement.progress, remedy.fly_more]
    edge_cases:
      - rating.expiryDate ignored.
      - Tier 1 duplicates Tier 2 passenger logic with a different window anchor (clock time vs midnight).
    suspected_divergence:
      - status: suspected
        what: A rating's ability to fly is made to depend on passenger currency; 61.57(a)/(b) only restricts carrying passengers. An FAA pilot with no landings in 90 days shows the SEP rating "expired" (readiness not ready) though solo flight is legal.
      - status: suspected
        what: Night requirement applied regardless of HasNightPrivilege (Sport/Recreational SEP ratings show "expiring" for missing night landings).
      - status: suspected
        what: Same full-stop / sole-manipulator / takeoff gaps as the Tier-2 rule.
    tests: [currency_test.go TestFAA_Passenger_*, pipeline_test.go TestFullPipeline_FAAPilotMultiClass]
    maps_to:

  - id: faa.14cfr61.61-57-c.instrument
    where:
      definition: internal/service/currency/faa.go:101-159 (faaInstrumentRule)
    article: [14 CFR 61.57(c)(1), 61.57(d) (as cited)]
    ruleDescriptionKey: faa_ir
    subject:
      kind: rating
      classes: [IR]
      licence_kinds: FAA licences except type SPORT/RECREATIONAL
    window:
      kind: rolling_months
      value: 6
      code: "now.AddDate(0,-6,0) (faa.go:110,118); grace check since12 = now.AddDate(-1,0,0) (faa.go:144)"
    requirements:
      all_of:
        - { id: approaches, nameKey: requirement.approaches, metric: 'approaches (approaches_count)', min: 6, unit: approaches }
        - { id: holds, nameKey: requirement.holds, metric: holds, min: 1, unit: holds }
      filters: GetProgressAll (all classes except GLIDER / UL SAILPLANE; simulators excluded; unknown aircraft included)
    stages:
      - { when: read error, status: unknown, messageKey: rating.evaluation_failed }
      - { when: expiryDate set and expired, status: expired, messageKey: rating.expired }
      - { when: 6-month totals met, status: current, messageKey: rating.ir_current }
      - { when: '12-month totals >= 6 approaches and >= 1 hold', status: expiring, messageKey: rating.ir_lapsed_safety_pilot, ruleDescription: overridden English text }
      - { when: 'otherwise (incl. 12-month read error)', status: expired, messageKey: rating.ir_expired_ipc, ruleDescription: overridden English text }
    messages: [rating.evaluation_failed, rating.expired, rating.ir_current, rating.ir_lapsed_safety_pilot, rating.ir_expired_ipc, requirement.progress, remedy.fly_more]
    edge_cases:
      - The 12-month read error is swallowed and treated as "not met" -> ir_expired_ipc.
      - validUntil projection applies (windowRollingNow), re-evaluating the grace branch at each projected date.
    suspected_divergence:
      - status: suspected
        what: 61.57(c) uses the preceding 6 CALENDAR months; code uses rolling months (AddDate(0,-6,0)).
      - status: suspected
        what: Grace logic sums 12 rolling months instead of "was current and lapsed less than 6 calendar months ago"; 3 approaches 11 months ago + 3 last month shows "lapsed, recoverable" though never current.
      - status: suspected
        what: is_ipc is never read; an IPC never restores currency, so a pilot who passed an IPC stays ir_expired_ipc until 6 approaches + hold are logged.
      - status: suspected
        what: Intercepting and tracking courses (61.57(c)(1)) not tracked.
      - status: suspected
        what: FFS/FTD/ATD time (61.57(c)(2)-(5)) excluded because simulators are filtered out.
      - status: suspected
        what: Grace status "expiring" is treated as ready by readiness, although in the grace period the pilot may not act as PIC under IFR.
    tests: [currency_test.go TestFAA_IR_Current, TestFAA_IR_InsufficientIFR, TestFAA_IR_Expired, lapl_spl_test.go TestFAA_IR_GracePeriod_Within6Months_Current, TestFAA_IR_GracePeriod_NotMetAnywhere_Expired]
    maps_to:

  - id: faa.14cfr61.61-315.ir-not-applicable
    where:
      definition: internal/service/currency/faa.go:244-254 (faaSuppressedIRRule), 39-43
    article: [14 CFR 61.315]
    ruleDescriptionKey: faa_ir
    subject: { kind: rating, classes: [IR], licence_kinds: [SPORT, RECREATIONAL (exact upper-case match, untrimmed)] }
    window: none
    requirements: none
    stages:
      - { when: always, status: unknown, messageKey: rating.ir_not_applicable }
    messages: [rating.ir_not_applicable]
    edge_cases:
      - Recreational pilot IR privileges are also suppressed although 61.315 is the sport-pilot section (suspected mis-citation).
    suspected_divergence:
      - status: suspected
        what: Citation 61.315 covers sport pilots; recreational limitations are in 61.101.
    tests: [two_tier_test.go TestFAA_SportPilot_IR_Suppressed, TestFAA_RecreationalPilot_IR_Suppressed]
    maps_to:

  - id: faa.14cfr61.61-56.glider-rating
    where:
      definition: internal/service/currency/faa.go:161-242 (faaGliderRule, faaFlightReviewWindowStart, flightReviewRequirement)
    article: [14 CFR 61.56(a), 61.56(b), 61.56(c)]
    ruleDescriptionKey: faa_flight_review
    subject:
      kind: rating
      classes: GLIDER on any FAA licence, any class on an FAA GLIDER licence type
    window:
      kind: calendar_months
      value: 24
      code: "since = first day of the month 24 months before now's month (faa.go:221-223), used for the 61.56(b) alternative; flight review itself: last is_flight_review flight ever"
    requirements:
      any_of:
        - { id: flight_review, nameKey: requirement.flight_review, metric: 'last flight review (any class)', met: "review status current or expiring", unit: review, messageKey: "requirement.prof_check_completed {date} / requirement.prof_check_missing", remedy: none }
        - { id: instructional_flights, nameKey: requirement.training_flights, metric: 'training_flights (dual_time > 0) on GLIDER incl. towed', min: 3, unit: flights }
    stages:
      - { when: flight review read error or progress read error, status: unknown, messageKey: rating.evaluation_failed }
      - { when: review current, status: current, messageKey: flight_review.current, params: [date] }
      - { when: 3 instructional glider flights in window, status: current, messageKey: rating.flight_review_glider_alternative }
      - { when: 'review exists (expiring or expired)', status: review status, messageKey: 'flight_review.expiring {days,date} / flight_review.expired {date}' }
      - { when: no review, status: expired, messageKey: flight_review.none_on_record }
    messages: [rating.evaluation_failed, flight_review.current, flight_review.expiring, flight_review.expired, flight_review.none_on_record, rating.flight_review_glider_alternative, requirement.prof_check_completed, requirement.prof_check_missing, remedy.fly_more]
    edge_cases:
      - An expiring review outranks nothing; order is current review > glider alternative > review status > none.
      - Landings never change the rating status (passengers reported separately).
      - No validUntil projection (window kind is windowRollingNow with zero duration, so projectValidUntil returns early).
    suspected_divergence:
      - status: suspected
        what: 61.56(b) substitutes three instructional flights for the 1 hour of FLIGHT training only; ground training and the logbook endorsement are still required, so three dual flights alone do not constitute a flight review.
      - status: suspected
        what: The alternative flights may straddle the window start and carry no expiry; the flights must have been part of one review.
      - status: suspected
        what: 61.56(d) (a proficiency check / practical test / new rating counts as a flight review) not modelled - is_proficiency_check flights do not reset the review.
    tests: [faa_glider_test.go TestFAAGliderRating, TestFAAFlightReviewWindowStart]
    maps_to:

  - id: faa.14cfr61.61-56.flight-review
    where:
      definition: internal/service/currency/faa.go:362-415 (EvaluateFlightReview, faaFlightReviewStatus)
      service: internal/service/currency/service.go:152-158
      data: internal/repository/postgres/currency_flight_data.go:180-196
    article: [14 CFR 61.56(c)]
    subject:
      kind: flight_review (per pilot, once per response, from the first FAA licence)
    window:
      kind: calendar_months
      value: 24
      code: "expiresOn = time.Date(y, month+25, 0) = last day of the 24th month after the completion month; validUntil = expiresOn + 1 day (faa.go:390-395)"
    requirements:
      - { id: flight_review, metric: 'date of latest non-simulator, non-passenger flight with is_flight_review, any class' }
    stages:
      - { when: read error, status: unknown, messageKey: flight_review.evaluation_failed }
      - { when: no review, status: expired, messageKey: flight_review.none_on_record }
      - { when: 'now >= expiresOn+1d', status: expired, messageKey: flight_review.expired, params: [date = completion] }
      - { when: "days until expiresOn+1d <= 90 (int(hours/24))", status: expiring, messageKey: flight_review.expiring, params: [days, date] }
      - { when: otherwise, status: current, messageKey: flight_review.current, params: [date] }
    output_fields: [lastCompleted, expiresOn]
    messages: [flight_review.evaluation_failed, flight_review.none_on_record, flight_review.expired, flight_review.expiring, flight_review.current]
    edge_cases:
      - Ignores the 61.56(b) glider alternative (a glider rating can be current while flightReview is expired).
      - Evaluated for every FAA pilot including glider-only; not evaluated for EASA/German/other authorities.
      - Validity runs through the whole last day of the 24th month (TestFAA_FlightReview_ExpiryBoundary).
    suspected_divergence:
      - status: suspected
        what: 61.56(d)/(e) substitutes (proficiency check, practical test, WINGS) not recognised.
      - status: suspected
        what: Readiness does not include the flight review, so an FAA powered pilot with an expired review is reported ready.
    tests: [two_tier_test.go TestFAA_FlightReview_*, TestService_FAA_IncludesFlightReview, TestService_EASA_NoFlightReview, messages_test.go TestFlightReviewCarriesAKey]
    maps_to:

  - id: other.ninerlog.expiry-only
    where:
