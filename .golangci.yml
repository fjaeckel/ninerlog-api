version: "2"

run:
  build-tags:
    - integration
    - e2e
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - rowserrcheck
    - sqlclosecheck
  settings:
    errorlint:
      errorf-multi: false
  exclusions:
    generated: lax
    paths:
      - internal/api/generated/

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - internal/api/generated/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
