name: Rules

# The rules catalogue module (rules/). Runs only for changes under rules/.
# The strict gate fails until every inventory entry and article is ported; see rules/README.md.

on:
  push:
    branches: [main]
    paths: ['rules/**', '.github/workflows/rules.yml']
  pull_request:
    paths: ['rules/**', '.github/workflows/rules.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rules

jobs:
  rules:
    name: Rules catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
          cache-dependency-path: rules/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code
          test -z "$(git status --porcelain -- gen engine)"

      - name: Coverage gate
        run: go run ./cmd/rulescheck -strict
