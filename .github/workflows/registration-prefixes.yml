name: Registration Prefixes

# Compares the vendored nationality mark table in pkg/registration/prefixes.go
# against upstream. Advisory: it does not fail on drift, and writes its report
# to the job summary. Add --fail-on-drift to gate once the checker's recall is
# calibrated. See docs/AIRCRAFT_REGISTRATIONS.md.

on:
  schedule:
    # 07:00 UTC on the first of every third month.
    - cron: '0 7 1 */3 *'
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - 'pkg/registration/**'
      - 'scripts/check-registration-prefixes.py'

permissions:
  contents: read

jobs:
  drift:
    name: Nationality Mark Drift
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare the vendored table against upstream
        run: |
          {
            echo '## Nationality mark drift'
            echo
            echo 'Advisory. Confirm anything real against ICAO before editing the table —'
            echo 'see `docs/AIRCRAFT_REGISTRATIONS.md`.'
            echo
            echo '```'
            make prefix-check 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
