name: Generate OpenAPI Server

on:
  repository_dispatch:
    types: [openapi-updated]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-server:
    name: Generate Go Server Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout API repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true

      - name: Generate Go server types
        run: ./scripts/generate-server-types.sh api-spec/openapi.yaml

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code internal/api/generated/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Verify build
        if: steps.git-check.outputs.changes == 'true'
        run: |
          go mod tidy
          go build ./...

      - name: Run tests
        if: steps.git-check.outputs.changes == 'true'
        run: go test -short ./...

      # Regenerated code reaches main through a pull request and the full CI run
      # that gates it, never through a direct push.
      - name: Create Pull Request
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(api): regenerate server types from OpenAPI spec"
          title: "chore: Update API server types from OpenAPI spec"
          body: |
            ## OpenAPI Server Update

            Regenerated Go server types so that `internal/api/generated/` matches
            `api-spec/openapi.yaml`.

            **Triggered by**: ${{ github.event_name }}

            Merging this PR publishes a Docker image, as every merge to `main` does.
          branch: openapi-server-update
          delete-branch: true
