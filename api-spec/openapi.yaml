      description: |
        Returns the raw image bytes. This is an authenticated request like any
        other — the image is never reachable from an unauthenticated URL, so it
        cannot be loaded straight into an `<img src>`; fetch it with the
        `Authorization` header and render the resulting blob.
      operationId: getCredentialFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CredentialId'
        - $ref: '#/components/parameters/DocumentFileId'
      responses:
        '200':
          description: |
            File bytes, served with the stored content type. PDFs additionally
            carry `Content-Disposition: attachment`.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
