openapi: 3.1.0
info:
  title: NinerLog API
  version: 1.0.0
  description: |
    RESTful API for EASA/FAA compliant pilot logbook management.
    
    ## Features
    - Multi-license support (PPL, SPL, CPL, ATPL, IR)
    - EASA and FAA regulatory compliance
    - Flight logging with detailed time tracking
    - Currency calculations
    - Statistics and hour totals per license
    
    ## Authentication
    All endpoints except `/auth/register` and `/auth/login` require JWT authentication.
    Include the token in the Authorization header: `Bearer <token>`

    ## Idempotent writes

    Any authenticated `POST`, `PUT`, `PATCH` or `DELETE` accepts an optional
    `Idempotency-Key` request header, so a client that queues writes while offline
    can replay its queue without risking a duplicate logbook entry.

    - Omit the header and the endpoint behaves exactly as documented below — this is
      opt-in per request, never automatic.
    - Keys are scoped to the authenticated user, are at most 255 printable ASCII
      characters (a UUID or ULID is ideal), and stay replayable for 24 hours.
    - The first request with a key executes normally. A later request with the same key
      and the same payload returns the original status and body verbatim, with
      `Idempotency-Replayed: true` set on the response.
    - `409 Conflict` — an earlier request with this key is still running, or completed
      with a response too large to store. Retry once it settles.
    - `422 Unprocessable Entity` — the key was already used for a *different* request.
    - `503 Service Unavailable` — the replay store is unreachable, so the requested
      guarantee cannot be honoured. The request was not executed.

    Because it applies uniformly to every mutating operation, the header is handled in
    middleware and is not repeated as a parameter on each operation below. Server errors
    (`5xx`) release the key, so a genuine failure stays retryable.

  contact:
    name: Frederic Jaeckel
    email: frederic@ninerlog.app
  license:
    name: TBD

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
  - url: https://app.ninerlog.com/api/v1
    description: Production server

tags:
  - name: Authentication
    description: User registration and login
  - name: Users
    description: User profile management
  - name: Licenses
    description: Pilot license management
  - name: Aircraft
    description: Aircraft database management
  - name: Flights
    description: Flight log entries
  - name: Flight Sessions
    description: Live tap-to-log capture of block/flight times from mobile devices
  - name: Statistics
    description: Hour totals and analytics
  - name: Currency
    description: Currency status checks
  - name: Credentials
    description: Medicals, language proficiency, and security clearances
  - name: Maps
    description: Airport coordinates, flight routes, and activity heatmap
  - name: Import
    description: Flight log import from CSV and XLS/XLSX files (including ForeFlight export)
  - name: Reports
    description: Flight statistics, trends, and breakdowns
  - name: Contacts
    description: Reusable crew and contact management
  - name: Signatures
    description: Instructor sign-off on flight log entries (live, deferred email, or shareable link/QR), plus voiding for revalidation
  - name: Public Signing
    description: Unauthenticated token-based endpoints used by an instructor to review and sign a flight via an emailed or shared link
  - name: Admin
    description: Admin-only platform management (requires ADMIN_EMAIL env var match)
  - name: Backups
    description: Cloud backup destinations and scheduled runs (S3 and S3-compatible storage)
  - name: Sync
    description: Incremental synchronisation for offline-capable clients
  - name: Documents
    description: Reference photos/scans attached to a licence or credential (optional feature; see GET /features)

paths:
  /auth/providers:
    get:
      tags:
        - Authentication
      summary: Which sign-in methods this server offers
      description: |
        Unauthenticated capability probe. A NinerLog server runs in exactly one
        authentication mode, and the client uses this to decide which sign-in
        UI to render before anyone has logged in.

        * `local` — email/password, optional TOTP and passkeys, self-service
          registration (the default).
        * `oidc` — a single external identity provider owns all accounts.
          Password, registration, password-reset, TOTP and passkey endpoints
          all answer `503` in this mode.

        In `oidc` mode the client sends the browser to `authorizeUrl`, which is
        a redirect endpoint rather than a JSON API.
      operationId: getAuthProviders
      security: []
      responses:
        '200':
          description: Enabled authentication methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProviders'

  /auth/oidc/exchange:
    post:
      tags:
        - Authentication
      summary: Exchange an OIDC handoff code for tokens
      description: |
        Final step of the OIDC login. After the provider redirects the browser
        back to `/auth/oidc/callback`, the API sends it on to the frontend with
        a single-use `oidc_code` query parameter. The client posts that code
        here to receive the normal access/refresh token pair.

        The code is redeemable exactly once and expires within a minute, which
        is why the tokens themselves never appear in a URL.
      operationId: exchangeOidcCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: The single-use code from the `oidc_code` query parameter
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The code is unknown, expired, or has already been redeemed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The account has been disabled by an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: OIDC is not configured on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: |
        Create a new user account with email and password.

        When SMTP is configured, a verification email is sent to the provided address,
        and the user must confirm it before they can log in.

        When SMTP is not configured, the backend auto-verifies the new account so
        registration and login remain usable in local/self-hosted setups.

        No authentication tokens are returned from this endpoint.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                  example: pilot@example.com
                password:
                  type: string
                  format: password
                  minLength: 12
                  example: SecurePass123!
                  description: Must be at least 12 characters
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: John Doe
                preferredLocale:
                  type: string
                  enum: [en, de]
                  description: Preferred language for the interface. Defaults to `en` when omitted.
                  example: en
      responses:
        '201':
          description: User created (verification may be required depending on SMTP configuration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/LocalAuthDisabled'

  /auth/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify email address
      description: |
        Consume an email-verification token (delivered via the registration email)
        and mark the user's address as verified. On success, returns a full
        `AuthResponse` so the frontend can log the user in immediately.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Verification token from the email link
      responses:
        '200':
          description: Email verified — user is now logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/LocalAuthDisabled'

  /auth/verify-email/resend:
    post:
      tags:
        - Authentication
      summary: Resend the email-verification message
      description: |
        Request a fresh verification email. Always returns 204 regardless of whether
        the email exists or is already verified, to prevent user enumeration.
      operationId: resendVerificationEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: pilot@example.com
      responses:
        '204':
          description: Verification email sent (if account exists and is not yet verified)
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/LocalAuthDisabled'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: |
        Authenticate with email and password.

        The 200 response has two shapes. An account without two-factor
        authentication receives the tokens directly (`AuthResponse`). An account
        with two-factor authentication receives a challenge
        (`TwoFactorLoginRequired`) instead, and must exchange the
        `twoFactorToken` for tokens at `/auth/2fa/login`. Clients decide which
        one they got from the presence of `requiresTwoFactor`.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: pilot@example.com
                password:
                  type: string
                  format: password
                  example: SecurePass123!
      responses:
        '200':
          description: |
            Either a completed login, or — when the account has two-factor
            authentication enabled — a challenge to be completed at
            `/auth/2fa/login`. The two shapes are mutually exclusive: exactly one
            branch validates any given body.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthResponse'
                  - $ref: '#/components/schemas/TwoFactorLoginRequired'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Account cannot be used. The error `code` distinguishes the reason:
            `email_not_verified` (email confirmation pending) or `account_disabled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            Too many failed login attempts — the account is temporarily locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/LocalAuthDisabled'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out
      description: >-
        Revokes the supplied refresh token so the session cannot be resumed.
        Always returns 204: revocation is idempotent and the endpoint must not
        reveal whether a given token existed.
      operationId: logoutUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: Session revoked
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Use refresh token to obtain a new access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                    description: New refresh token (rotation — old token is invalidated)
                  expiresIn:
                    type: integer
                    description: Token expiry in seconds
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change password
      description: Change the authenticated user's password. Requires the current password for verification.
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                  description: The user's current password
                newPassword:
                  type: string
                  format: password
                  minLength: 12
                  description: The new password (minimum 12 characters)
      responses:
        '204':
          description: Password changed successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/LocalAuthDisabled'

  /auth/password-reset-request:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: |
        Send a password reset email to the provided address. Always returns 204 regardless
        of whether the email exists, to prevent user enumeration.
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: pilot@example.com
      responses:
        '204':
          description: Password reset email sent (if account exists)
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/LocalAuthDisabled'

  /auth/password-reset:
    post:
      tags:
        - Authentication
      summary: Reset password with token
      description: |
        Reset the user's password using a token received via email.

        **Two-factor accounts:** a password reset does NOT bypass or disable 2FA. When the
        account has TOTP enabled, `twoFactorCode` is required and must be a valid TOTP code
        or one of the account's unused recovery codes; 2FA stays enabled afterwards. Clients
        should submit the token and new password first, then re-submit with the code after
        receiving `401` with `code: two_factor_required`.

        On success all refresh tokens are revoked and a confirmation email is sent to the
        account address.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  description: Password reset token from email
                newPassword:
                  type: string
                  format: password
                  minLength: 12
                  description: The new password (minimum 12 characters)
                twoFactorCode:
                  type: string
                  description: |
                    TOTP code or recovery code. Required when the account has 2FA enabled,
                    ignored otherwise.
                  example: '123456'
      responses:
        '204':
          description: Password reset successfully
        '400':
          description: Invalid request, expired token, or already used token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            The account has 2FA enabled and no code was supplied (`code: two_factor_required`)
            or the supplied code was wrong (`code: invalid_two_factor_code`). The reset token
            is not consumed, so the request can be retried with a valid code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many failed two-factor attempts — the account is temporarily locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/LocalAuthDisabled'

  /auth/webauthn/register/options:
    post:
      tags:
        - Authentication
      summary: Begin passkey registration
      description: Returns WebAuthn `PublicKeyCredentialCreationOptions` plus an opaque session id used to verify the attestation.
      operationId: webauthnRegisterOptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Registration options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnRegistrationOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: >-
            Passkeys are unavailable: either WEBAUTHN_RP_ID is unset, or the
            server runs in OIDC mode, where all local credential methods are
            switched off.

  /auth/webauthn/register/verify:
    post:
      tags:
        - Authentication
      summary: Verify passkey registration attestation
      description: Verifies the authenticator attestation produced from the registration options and stores the credential.
      operationId: webauthnRegisterVerify
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - response
              properties:
                sessionId:
                  type: string
                  description: Single-use ceremony handle returned from `/auth/webauthn/register/options`. Rejected if it has expired, has already been used, or was issued for a different user.
                label:
                  type: string
                  description: Optional human-readable label for the passkey
                response:
                  type: object
                  description: Raw `PublicKeyCredential` returned from `navigator.credentials.create`
                  additionalProperties: true
      responses:
        '200':
          description: Newly registered passkey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnCredential'
        '400':
          description: Invalid or expired registration response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: >-
            Passkeys are unavailable: either WEBAUTHN_RP_ID is unset, or the
            server runs in OIDC mode, where all local credential methods are
            switched off.

  /auth/webauthn/login/options:
    post:
      tags:
        - Authentication
      summary: Begin passkey login
      description: Returns WebAuthn `PublicKeyCredentialRequestOptions` for either a discoverable credential (no email) or a specific user.
      operationId: webauthnLoginOptions
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Optional email to scope the challenge to a specific user
      responses:
        '200':
          description: Login options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnLoginOptions'
        '503':
          description: >-
            Passkeys are unavailable: either WEBAUTHN_RP_ID is unset, or the
            server runs in OIDC mode, where all local credential methods are
            switched off.

  /auth/webauthn/login/verify:
    post:
      tags:
        - Authentication
      summary: Verify passkey assertion and sign in
      description: Verifies the authenticator assertion and returns a token pair. Successful passkey logins bypass the 2FA challenge.
      operationId: webauthnLoginVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - response
              properties:
                sessionId:
                  type: string
                  description: Single-use ceremony handle returned from `/auth/webauthn/login/options`. Rejected if it has expired or has already been used.
                response:
                  type: object
                  description: Raw `PublicKeyCredential` returned from `navigator.credentials.get`
                  additionalProperties: true
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid or expired login response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Passkey verification failed or unknown credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: >-
            Passkeys are unavailable: either WEBAUTHN_RP_ID is unset, or the
            server runs in OIDC mode, where all local credential methods are
            switched off.

  /auth/webauthn/credentials:
    get:
      tags:
        - Authentication
      summary: List the current user's passkeys
      operationId: listWebauthnCredentials
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Passkeys registered for the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebAuthnCredential'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/webauthn/credentials/{credentialId}:
    delete:
      tags:
        - Authentication
      summary: Revoke a passkey
      operationId: deleteWebauthnCredential
      security:
        - bearerAuth: []
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Passkey revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Passkey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/2fa/setup:
    post:
      tags:
        - Authentication
      summary: Start 2FA setup
      description: Generate a TOTP secret and return the provisioning URI for authenticator apps. Does not enable 2FA until verified.
      operationId: setup2FA
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 2FA setup data with secret and QR URI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorSetup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 2FA is already enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/LocalAuthDisabled'

  /auth/2fa/verify:
    post:
      tags:
        - Authentication
      summary: Verify and enable 2FA
      description: Verify a TOTP code to confirm setup and enable 2FA. Returns backup recovery codes.
      operationId: verify2FA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  description: 6-digit TOTP code from authenticator app
      responses:
        '200':
          description: 2FA enabled with recovery codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorEnabled'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/LocalAuthDisabled'

  /auth/2fa/disable:
    post:
      tags:
        - Authentication
      summary: Disable 2FA
      description: Disable two-factor authentication. Requires current password for confirmation.
      operationId: disable2FA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
      responses:
        '204':
          description: 2FA disabled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/LocalAuthDisabled'

  /auth/2fa/login:
    post:
      tags:
        - Authentication
      summary: Complete login with 2FA code
      description: After initial login returns requiresTwoFactor, submit the TOTP code or recovery code here.
      operationId: login2FA
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - twoFactorToken
                - code
              properties:
                twoFactorToken:
                  type: string
                  description: Temporary token from login response
                code:
                  type: string
                  description: 6-digit TOTP code or recovery code
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/LocalAuthDisabled'

  /users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      description: Retrieve the authenticated user's profile information
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags:
        - Users
      summary: Update current user profile
      description: Update the authenticated user's profile information
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                email:
                  type: string
                  format: email
                currentPassword:
                  type: string
                  description: >-
                    Current password. Required when changing the email address.
                    The new address is marked unverified and a verification link
                    is sent to it before it is trusted again.
                timeDisplayFormat:
                  type: string
                  enum: [hm, decimal]
                  description: Preferred time display format
                dateFormat:
                  type: string
                  enum: [DD.MM.YYYY, MM/DD/YYYY, YYYY-MM-DD]
                  description: Preferred date display format
                decimalSeparator:
                  type: string
                  enum: [comma, dot]
                  description: Preferred decimal separator for number display
                preferredLocale:
                  type: string
                  enum: [en, de]
                  description: Preferred language for the interface
                recencyPerModel:
                  type: boolean
                  description: Show informational 90-day landing recency per aircraft model/type
                recencyPerRegistration:
                  type: boolean
                  description: Show informational 90-day landing recency per individual aircraft registration
                flightListColumnMode:
                  type: string
                  enum: [auto, custom]
                  description: >-
                    Whether the flights list picks its optional columns from
                    the data ("auto") or uses flightListColumns ("custom")
                flightListColumns:
                  type: array
                  items:
                    $ref: '#/components/schemas/FlightListColumn'
                  description: >-
                    The optional flights-list columns to show in "custom" mode.
                    Replaces the stored list; an empty array is valid and means
                    no optional columns. Unknown values are ignored.
