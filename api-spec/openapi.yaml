    FlightBaselineInput:
      type: object
      description: |
        Initial-hours snapshot input. Allows a user to record their pre-existing
        flying experience as a single carried-forward total without entering
        every historical flight. All numeric fields default to 0 when omitted.
      required:
        - baselineDate
      properties:
        baselineDate:
          type: string
          format: date
          description: Cutoff date the snapshot covers (inclusive).
        totalFlights:
          type: integer
          minimum: 0
          default: 0
        totalMinutes:
          type: integer
          minimum: 0
          default: 0
          description: Total block time in minutes
        picMinutes:
          type: integer
          minimum: 0
          default: 0
        sicMinutes:
          type: integer
          minimum: 0
          default: 0
        dualMinutes:
          type: integer
          minimum: 0
          default: 0
          description: Dual instruction received in minutes
        dualGivenMinutes:
          type: integer
          minimum: 0
          default: 0
        multiPilotMinutes:
          type: integer
          minimum: 0
          default: 0
        nightMinutes:
          type: integer
          minimum: 0
          default: 0
        ifrMinutes:
          type: integer
          minimum: 0
          default: 0
          description: Total IFR / instrument time in minutes
        soloMinutes:
          type: integer
          minimum: 0
          default: 0
        crossCountryMinutes:
          type: integer
          minimum: 0
          default: 0
        landingsDay:
          type: integer
          minimum: 0
          default: 0
        landingsNight:
          type: integer
          minimum: 0
          default: 0
        notes:
          type: [string, 'null']
          maxLength: 1000
          description: Optional free-form context (e.g. "From paper logbook 1998-2010").

