                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /flights/{flightId}/signatures/{signatureId}/resend:
    post:
      tags:
        - Signatures
      summary: Resend or regenerate a pending signature request
      description: |
        Rotates the request's token (invalidating any previously shared
        link/QR) and, if `instructorEmail` is supplied, updates the delivery
        address and (re)sends the request email. Calling this with no body
        just regenerates the link/QR without emailing anyone. Only valid
        while the request is still pending.
      operationId: resendSignatureRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlightId'
        - $ref: '#/components/parameters/SignatureId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendSignatureRequestRequest'
      responses:
        '200':
          description: Request updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Signature request is not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flights/{flightId}/signatures/{signatureId}/revoke:
    post:
      tags:
        - Signatures
      summary: Revoke a pending signature request
      description: Cancels a still-pending request before anyone has signed it. No reason required.
      operationId: revokeSignatureRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlightId'
        - $ref: '#/components/parameters/SignatureId'
      responses:
        '200':
          description: Request revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightSignature'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Signature request is not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flights/{flightId}/signatures/{signatureId}/void:
    post:
      tags:
        - Signatures
      summary: Void a completed signature
      description: |
        Invalidates an already-completed signature (a reason is required for
        the audit trail) and unlocks the flight for editing again. Editing
        and re-signing after a void is the expected "revalidation" workflow.
      operationId: voidFlightSignature
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlightId'
        - $ref: '#/components/parameters/SignatureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidSignatureRequest'
      responses:
        '200':
          description: Signature voided, flight unlocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightSignature'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Signature is not completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sign/{token}:
    get:
      tags:
        - Public Signing
      summary: Get public signing info for a token
      description: |
        Unauthenticated endpoint used by the recipient of a signing link
        (email or shared URL/QR) to review the flight before signing. Never
        returns 401/403: an invalid, already-used, or revoked/voided token is
        reported as 404, and an expired token as 410, both with the same
        generic message so a caller cannot enumerate token state.
      operationId: getPublicSignatureInfo
      security: []
      parameters:
        - $ref: '#/components/parameters/SignatureToken'
      responses:
        '200':
          description: Flight summary and request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSignatureInfo'
        '404':
          description: This signing link is invalid or has already been used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: This signing link has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Public Signing
      summary: Complete a signature via a public link
      description: |
        Records the instructor's signature against a valid pending token.
        Deliberately returns a minimal body — no flight or owner details are
        echoed back to an unauthenticated caller.
      operationId: completePublicSignature
      security: []
      parameters:
        - $ref: '#/components/parameters/SignatureToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSignatureRequest'
      responses:
        '200':
          description: Signature recorded
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Signature recorded. Thank you!
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: This signing link is invalid or has already been used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: This signing link has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

