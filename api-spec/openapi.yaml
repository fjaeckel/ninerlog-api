  /licenses/{licenseId}/files:
    get:
      tags:
        - Documents
      summary: List a licence's reference files
      description: |
        Returns metadata only — the bytes are fetched one image at a time from
        `/licenses/{licenseId}/files/{fileId}`.
      operationId: listLicenseFiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LicenseId'
      responses:
        '200':
          description: The licence's files, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/DocumentFilesDisabled'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Documents
      summary: Upload a reference file for a licence
      description: |
        Attaches a photo or scan of the licence document. At most
        **5 files per licence**, each at most **5 MB**.

        **JPEG, PNG and PDF** are accepted, and the format is determined from
        the file's own bytes — the declared part `Content-Type` is ignored.

        * Images must have a header that parses as the format they claim.
          Validation stops at the header, so trailing bytes after a valid one
          are stored as-is rather than refused.
        * PDFs cannot be validated the same way: there is no header to decode
          and no dimensions to bound, so the check is the `%PDF-` signature plus
          a `%%EOF` trailer, and the size cap does the rest.

        Every response serves the sniffed type behind
        `X-Content-Type-Options: nosniff`. PDFs are additionally served with
        `Content-Disposition: attachment`, because unlike an image a PDF is an
        active format — it can carry scripts and embedded files — and is
        therefore never rendered inside the application's own origin.
      operationId: uploadLicenseFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LicenseId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentFileUpload'
            encoding:
              file:
                contentType: image/jpeg, image/png, application/pdf
      responses:
        '201':
          description: Image stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/DocumentFilesDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DocumentFileLimitReached'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /licenses/{licenseId}/files/{fileId}:
    get:
      tags:
        - Documents
      summary: Download a licence reference image
      description: |
        Returns the raw image bytes. This is an authenticated request like any
        other — the image is never reachable from an unauthenticated URL, so it
        cannot be loaded straight into an `<img src>`; fetch it with the
        `Authorization` header and render the resulting blob.
      operationId: getLicenseFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LicenseId'
        - $ref: '#/components/parameters/DocumentFileId'
      responses:
        '200':
          description: |
            File bytes, served with the stored content type. PDFs additionally
            carry `Content-Disposition: attachment`.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/DocumentFilesDisabled'
