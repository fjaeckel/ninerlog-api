        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - Users
      summary: Delete current user account
      description: |
        Permanently delete the authenticated user's account and all associated
        data (licenses, flights, tokens). This action cannot be undone.

        Confirmation depends on the server's authentication mode:
        * **local mode** — send `password`.
        * **OIDC mode** — there is no local password, so send `confirmEmail`
          holding the account's own email address instead.
      operationId: deleteCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
                  description: Current password for confirmation (local mode)
                confirmEmail:
                  type: string
                  format: email
                  description: >-
                    The account's own email address, typed as confirmation.
                    Required in OIDC mode, where no local password exists.
      responses:
        '204':
          description: Account deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

