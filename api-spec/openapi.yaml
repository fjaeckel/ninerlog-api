          description: Instructor endorsements, skill test references, examiner notes. EASA AMC1 FCL.050 Col 24 / FAA §61.51(h). Separate from pilot remarks.
        crewMembers:
          type: array
          items:
            $ref: '#/components/schemas/FlightCrewMember'
          description: People on board this flight with their roles
        createdAt:
          type: string
          format: date-time
          example: '2026-01-30T16:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-01-30T16:00:00Z'
        signatureId:
          type: [string, 'null']
          format: uuid
          description: |
            Present iff the flight is locked by a completed, non-voided
            instructor signature. Void the signature (see
            /flights/{flightId}/signatures/{signatureId}/void) to unlock it
            for editing.

