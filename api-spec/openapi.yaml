      description: Get all unique flight routes with coordinates for map visualization
      operationId: getFlightRoutes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Flight routes with airport coordinates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightRoutesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/airport-stats:
    get:
      tags: [Maps]
      summary: Get airport statistics
      description: Get flight count and hours per airport for the authenticated user
      operationId: getAirportStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Airport statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AirportStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Import ────────────────────────────────────────────────────────────

  /imports/upload:
    post:
      tags: [Import]
      summary: Upload file for import
      description: |
        Upload a CSV or XLS/XLSX file containing flight log entries.
        The server parses the file, detects the format (generic CSV, ForeFlight CSV,
        or Excel), and returns the detected columns along with a preview of the
        first rows.  No flights are created at this stage.

        **Supported formats:**
        - Generic CSV (comma, semicolon, or tab delimited)
        - ForeFlight logbook export CSV (auto-detected via header row)
        - XLS (Excel 97-2003)
        - XLSX (Excel 2007+)

        Maximum file size: 10 MB.
      operationId: uploadImportFile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or XLS/XLSX file to import
            encoding:
              file:
                contentType: text/csv, application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        '200':
          description: File parsed successfully — columns and preview rows returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportUploadResponse'
        '400':
          description: File is empty, too large, unsupported format, or cannot be parsed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /imports/preview:
    post:
      tags: [Import]
      summary: Preview mapped flights
      description: |
        Submit column-to-field mappings for a previously uploaded file.
        The server validates every row against flight log rules, detects
        potential duplicates (same date + aircraft + departure + arrival within
        a time tolerance), and returns the validated flights grouped into
        `valid`, `duplicate`, and `error` buckets.  No flights are persisted.
      operationId: previewImport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportPreviewRequest'
      responses:
        '200':
          description: Validation results with categorised flights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Upload token not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /imports/confirm:
    post:
      tags: [Import]
      summary: Confirm and execute import
      description: |
        Confirm a previously previewed import.  The caller specifies which rows
        to import (by row index) and whether to include detected duplicates.
        The server creates flight log entries for the selected rows and returns
        an import summary.
      operationId: confirmImport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportConfirmRequest'
      responses:
        '201':
          description: Import completed — flights created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Upload token not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /imports:
    get:
      tags: [Import]
      summary: List import history
      description: Get a paginated list of past imports for the authenticated user
      operationId: listImports
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated list of imports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedImports'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /imports/{importId}:
    get:
      tags: [Import]
      summary: Get import details
      description: Get details of a specific import including per-row results
      operationId: getImport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Import details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /exports/csv:
    get:
      tags: [Export]
      summary: Export flights as CSV
      description: Export all flight data as a CSV file. Supports EASA (AMC1 FCL.050 columns), FAA (ASA/Jeppesen columns), and standard (ForeFlight-compatible) formats.
      operationId: exportFlightsCSV
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          description: CSV column format — easa, faa, or standard (ForeFlight-compatible default)
          schema:
            type: string
            enum: [easa, faa, standard]
            default: standard
      responses:
        '200':
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'

  /exports/vcard:
    get:
      tags: [Export]
      summary: Export contacts as vCard
      description: |
        Export the authenticated user's contacts as a single vCard 3.0 (.vcf)
        stream, for import into a phone or mail client's address book.

        Each card carries the contact's name, email, phone and notes. Contacts
        the pilot has flown with also carry their logged crew roles as
        `CATEGORIES` (most-flown role first), and every card carries a stable
        `UID`, so re-importing a later export updates the existing cards instead
        of duplicating them.
      operationId: exportContactsVCard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: vCard file download
          content:
            text/vcard:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'

  /exports/json:
    get:
      tags: [Export]
      summary: Export full data backup as JSON
      description: Export all user data (flights, aircraft, licenses, class ratings, credentials) as a JSON backup file
      operationId: exportDataJSON
      security:
        - bearerAuth: []
      responses:
        '200':
          description: JSON backup file download
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /imports/json:
    post:
      tags: [Import]
      summary: Restore a NinerLog JSON backup
      description: |
        Restore a previously exported NinerLog JSON backup into the authenticated
        user's account. Recreates aircraft, licenses, class ratings, credentials,
        flights and crew members from the backup. New UUIDs are assigned so the
        backup can be restored into any NinerLog installation (including the one
        it was exported from).

        This is an additive operation — it does not modify or delete existing
        data. Aircraft whose registration already exists for the user are
        skipped (and the existing aircraft is referenced by imported flights).
      operationId: importDataJSON
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A NinerLog JSON backup as produced by `GET /exports/json`
              required: [format]
              properties:
                format:
                  type: string
                  example: NinerLog JSON Backup
                version:
                  type: string
                exportedAt:
                  type: string
                  format: date-time
                flights:
                  type: array
                  items:
                    type: object
                aircraft:
                  type: array
                  items:
                    type: object
                licenses:
                  type: array
                  items:
                    type: object
                credentials:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Restore summary with per-entity counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJSONResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /exports/pdf:
    get:
      tags: [Export]
      summary: Export flights as PDF logbook
      description: |
        Export all flight data as a formatted PDF document. Supports EASA AMC1 FCL.050
        and FAA 14 CFR § 61.51 (ASA/Jeppesen-style) logbook layouts plus a summary format.

        Every logbook page carries the three-row totals block (total this page /
        total from previous pages / total time) and a per-page certification and
        signature block, so each printed page can be individually signed.
      operationId: exportFlightsPDF
      security:
        - bearerAuth: []
      parameters:
        - name: logbookLicenseId
          in: query
          description: Filter flights for a specific logbook license
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          description: PDF format — easa (AMC1 FCL.050 columns), faa (14 CFR § 61.51 / ASA-Jeppesen columns), or summary (simplified totals)
          schema:
            type: string
            enum: [easa, faa, summary]
            default: easa
        - name: page_size
          in: query
          description: Page size for the generated PDF. All sizes are rendered in landscape orientation.
          schema:
            type: string
            enum: [a4, a5, letter]
            default: a4
        - name: layout
          in: query
          description: >-
            Page layout. `spread` (default) lays the logbook out as a book-style
            two-page spread (left + right facing pages) intended for double-sided
            printing, in any page size; intentionally-blank filler pages (one at
            the start, one before the totals summary) keep each spread on facing
            pages when printed duplex. `single` renders all columns on one
            landscape page per batch of flights — designed for single-page A4
            landscape printing. Ignored for the summary format.
          schema:
            type: string
            enum: [spread, single]
            default: spread
        - name: rows_per_page
          in: query
          description: >-
            Number of flight rows per logbook page. When set, the row height —
            and, for dense layouts, the body font — scales dynamically so the
            rows fill the page: fewer rows give an airier, larger-print
            logbook, more rows a denser one. Values are clamped to what stays
            legible on the chosen page size; omitted, the row count is derived
            from the page size's default row height. Ignored for the summary
            format.
          schema:
            type: integer
            minimum: 5
            maximum: 60
      responses:
        '200':
          description: PDF file download
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Reports ──

  /reports/trends:
    get:
      tags:
        - Reports
      summary: Get monthly flight trends
      description: Returns monthly aggregated flight data (hours, flights, aircraft breakdown) for the specified number of months.
      operationId: getFlightTrends
      security:
        - bearerAuth: []
      parameters:
        - name: months
          in: query
          description: Number of months to include (default 12, max 60)
          schema:
            type: integer
            default: 12
            maximum: 60
      responses:
        '200':
          description: Monthly trend data
          content:
            application/json:
              schema:
                type: object
                properties:
                  trends:
                    type: array
                    items:
                      type: object
                      properties:
                        month:
                          type: string
                          description: Month in YYYY-MM format
                        totalMinutes:
                          type: integer
                        flights:
                          type: integer
                  aircraftBreakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        aircraftType:
                          type: string
                        minutes:
                          type: integer
                        flights:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/stats-by-class:
    get:
      tags:
        - Reports
      summary: Get statistics by aircraft class and category
      description: Returns aggregated flight statistics grouped by aircraft class, aircraft category (tailwheel, complex, high-performance), and regulatory authority. Results are scoped to the requested timeframe.
      operationId: getStatsByClass
      security:
        - bearerAuth: []
      parameters:
        - name: months
          in: query
          description: Number of months to include (default 12, 0 = all time)
          schema:
            type: integer
            default: 12
            maximum: 600
      responses:
        '200':
          description: Statistics grouped by class, category, and authority
          content:
            application/json:
              schema:
                type: object
                properties:
                  byClass:
                    type: array
                    items:
                      type: object
                      properties:
                        class:
                          type: string
                        flights:
                          type: integer
                        minutes:
                          type: integer
                        picMinutes:
                          type: integer
                        dualMinutes:
                          type: integer
                        landings:
                          type: integer
                  byCategory:
                    type: array
                    description: PIC and Dual time grouped by aircraft category (e.g. tailwheel, complex, high-performance). Only categories with flights are included.
                    items:
                      type: object
                      properties:
                        category:
                          type: string
                          description: "Category label, e.g. 'Tailwheel', 'Complex', 'High Performance'"
                        flights:
                          type: integer
                        picMinutes:
                          type: integer
                        dualMinutes:
                          type: integer
                  byAuthority:
                    type: array
                    items:
                      type: object
                      properties:
                        authority:
                          type: string
                        licenseType:
                          type: string
                        flights:
                          type: integer
                        minutes:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/analytics:
    get:
      tags:
        - Reports
      summary: Get full logbook analytics
      description: >-
        Returns the complete analytics payload backing the Reports page in a
        single round trip: experience totals, monthly and yearly series,
        breakdowns by aircraft type/registration/class/category, airports,
        countries and routes, instructor and crew time, instrument approach
        types, flying-pattern distributions (day of week, hour of day, month of
        year, flight duration), and personal records.

        All time values are in minutes and all distances in nautical miles.
        Every section is scoped to the requested timeframe except
        `records.allTime`, which is deliberately computed over the whole
        logbook so records stay stable as the timeframe changes.

        `totals` also includes the user's initial-hours snapshot whenever the
        timeframe reaches back to its cutoff date, so it matches
        `GET /users/me/statistics`; the contribution is reported separately in
        `baseline`.
      operationId: getFlightAnalytics
      security:
        - bearerAuth: []
      parameters:
        - name: months
          in: query
          description: Number of months to include, counted from the start of the month `months` months ago. 0 means all time.
          schema:
            type: integer
            default: 12
            minimum: 0
            maximum: 600
        - name: limit
          in: query
          description: Maximum number of rows returned per ranked breakdown (aircraft, airports, routes, instructors, crew).
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Full analytics payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightAnalytics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Contacts ──

  /contacts:
    get:
      tags:
        - Contacts
      summary: List all contacts
      description: Returns all contacts (crew, instructors, etc.) for the authenticated user.
      operationId: listContacts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UpdatedSince'
      responses:
        '200':
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Contacts
      summary: Create a contact
      description: |
        Creates a new reusable contact for the authenticated user.

        A contact is identified by its name: names are unique per user,
        case-insensitively and ignoring surrounding whitespace. Creating one
        that already exists returns 409 rather than a second row — use
        `GET /contacts/search` to find the existing contact.

        Contacts are also created automatically for crew names on flight
        create/update, spreadsheet import and backup restore, so a contact
        normally exists before anyone posts one.
      operationId: createContact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /contacts/search:
    get:
      tags:
        - Contacts
      summary: Search contacts
      description: Search contacts by name for autocomplete.
      operationId: searchContacts
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Search query string
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum results (default 10)
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Matching contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /contacts/{contactId}:
    get:
      tags:
        - Contacts
      summary: Get a contact
      description: Returns a single contact by ID.
      operationId: getContact
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Contact details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Contacts
      summary: Update a contact
      description: |
        Updates an existing contact.

        Renaming propagates: the crew entries of the user's flights that are
        linked to this contact are rewritten to the new name, so correcting a
        misspelling also corrects the logbook. Flights carrying a completed
        instructor signature are excluded — their crew names are attested
        content and stay as signed. The response header `X-Crew-Entries-Renamed`
        reports how many crew entries were rewritten.

        Renaming onto a name another contact already holds returns 409;
        contacts are not merged implicitly.
      operationId: updateContact
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      responses:
        '200':
          description: Contact updated
          headers:
            X-Crew-Entries-Renamed:
              description: Number of flight crew entries rewritten to the new name
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Contacts
      summary: Delete a contact
      description: |
        Deletes a contact by ID.

        This removes the address-book entry only. Flights the contact appears on
        keep the crew entry and the name it was logged with; the entry's
        `contactId` becomes null. No logbook content is lost, so deleting is
        allowed even for a contact referenced by signed flights.
      operationId: deleteContact
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Contact deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Flight Utilities ──

  /flights/delete-all:
    delete:
      tags:
        - Flights
      summary: Delete all flights
      description: |
        Permanently delete all flight log entries for the authenticated user.
        This also removes associated crew members and import history.
        This action cannot be undone.
      operationId: deleteAllFlights
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deletion results
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted:
                    type: integer
                    description: Number of flights deleted
                    example: 42
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/data:
    delete:
      tags:
        - Users
      summary: Delete all user data
      description: |
        Permanently delete all data for the authenticated user while keeping the account.
        This removes flights, aircraft, licenses, class ratings, contacts, credentials,
        import history, and notification logs. The user account itself is preserved.
        This action cannot be undone.
      operationId: deleteAllUserData
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deletion results
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: All user data deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  /flights/recalculate:
    post:
      tags:
        - Flights
      summary: Recalculate all flights
      description: Recalculates auto-computed fields (night time, distance, solo, cross-country, etc.) for all of the authenticated user's flights.
      operationId: recalculateFlights
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recalculation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                    description: Number of flights updated
                  errors:
                    type: integer
                    description: Number of flights that failed
                  total:
                    type: integer
                    description: Total flights processed
        '401':
          $ref: '#/components/responses/Unauthorized'

  /flight-sessions/current:
    get:
      tags:
        - Flight Sessions
      summary: Get current flight session
      description: Returns the authenticated user's open (in-progress) flight session, if any.
      operationId: getCurrentFlightSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The open flight session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Flight Sessions
      summary: Discard current flight session
      description: Discards the open flight session (e.g. after an accidental off-block tap). No flight log entry is created.
      operationId: discardCurrentFlightSession
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session discarded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /flight-sessions/current/events:
    post:
      tags:
        - Flight Sessions
      summary: Record a flight session event
      description: |
        Tap-to-log endpoint for recording block/flight time events live from a mobile device.

        - `offblock` opens a new session (or returns the existing open one — double-taps are harmless).
        - `takeoff` and `landing` stamp the airborne times on the open session.
        - `onblock` stamps the on-block time, closes the session, and converts it into a
          regular flight log entry (returned via `flightId`). The created flight is prefilled
          with block/flight times, block-time-derived total time, and auto-calculated fields;
          the pilot completes the remaining details later in the normal flight edit flow.

        Each event type is recorded at most once per session: repeating an event returns the
        session unchanged, which makes offline retries safe.

        The event timestamp defaults to the server clock; clients that queued the tap offline
        should send `occurredAt` with the instant the tap actually happened.

        When `lat`/`lon` are provided, the nearest airport (within 30 NM) is resolved and used
        as the departure airport (for `offblock`/`takeoff`) or arrival airport
        (for `landing`/`onblock`).
      operationId: recordFlightSessionEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlightSessionEvent'
      responses:
        '200':
          description: Event applied to the existing session (or ignored as a duplicate)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightSession'
        '201':
          description: New session opened (offblock)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No open session for takeoff/landing/onblock events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

