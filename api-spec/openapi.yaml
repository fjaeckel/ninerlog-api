  /flights/{flightId}/signatures:
    get:
      tags:
        - Signatures
      summary: List signature history for a flight
      description: Returns every signature attempt for the flight (pending, completed, revoked, voided, expired), newest first.
      operationId: listFlightSignatures
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlightId'
      responses:
        '200':
          description: Signature history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlightSignature'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Signatures
      summary: Create a deferred signature request
      description: |
        Starts a token-based signature request for the flight. If
        `instructorEmail` is supplied, the request email is sent immediately;
        if omitted, the request is created pending-and-unsent so the owner can
        send it later (once they have an address) or share the returned
        `signUrl` directly (e.g. as a QR code, over WhatsApp). Only one
        pending request may exist per flight at a time.
      operationId: createSignatureRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlightId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSignatureRequestRequest'
      responses:
        '201':
          description: Signature request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Flight is already locked, or a pending signature request already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flights/{flightId}/signatures/live:
    post:
      tags:
        - Signatures
      summary: Record a live (in-person) signature
      description: |
        Records a signature captured on the flight owner's own device while
        the instructor is physically present. Completes synchronously; no
        token or email is involved.
      operationId: signFlightLive
      security:
        - bearerAuth: []
