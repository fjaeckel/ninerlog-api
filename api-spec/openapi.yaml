    DocumentFile:
      type: object
      description: |
        Metadata for one reference photo attached to a licence or credential.
        The bytes themselves are never inlined — fetch them from the image's
        own authenticated URL.
      required:
        - id
        - contentType
        - byteSize
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        licenseId:
          type: [string, 'null']
          format: uuid
          description: Set when the image belongs to a licence; null otherwise
        credentialId:
          type: [string, 'null']
          format: uuid
          description: Set when the image belongs to a credential; null otherwise
        contentType:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
          description: Determined from the stored bytes, not from what the uploader declared
        byteSize:
          type: integer
          description: Size of the stored image in bytes
          example: 1843200
        width:
          type: [integer, 'null']
          description: Pixel width; null for formats without intrinsic dimensions, such as PDF
          example: 2048
        height:
          type: [integer, 'null']
          description: Pixel height; null for formats without intrinsic dimensions, such as PDF
          example: 1536
        filename:
          type: [string, 'null']
          description: Original filename, sanitized to a basename. Display only.
          example: licence-front.jpg
        caption:
          type: [string, 'null']
          example: Front page
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentFileUpload:
      type: object
      required:
        - file
